<script>
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function dec(x, n) { return (+x).toFixed(n).replace('.', ','); }
function num(s) { var v = parseFloat(String(s).replace(',', '.')); return isNaN(v) ? null : v; }
var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
var MESL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var TIPOS = { fosil: ['🦴', 'Fósil'], mineral: ['💎', 'Mineral'], cuerno: ['🦌', 'Cuerno'], craneo: ['💀', 'Cráneo'], otro: ['📌', 'Otro'] };
var BERGUEDA = [[41.95, 1.55], [42.36, 2.15]], CENTER = [42.13, 1.83];

// ---------- Local data first; the account copy arrives later ----------
var LS = 'estrat-v1', S = { sitios: {}, piezas: {} }, db = null, assets = null, sample = null, synced = false;
try { var raw = JSON.parse(localStorage.getItem(LS) || 'null'); if (raw && typeof raw === 'object') { S.sitios = raw.sitios || {}; S.piezas = raw.piezas || {}; } } catch (e) {}
function persist() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
function put(col, o) { S[col][o.id] = o; persist(); if (db) db.collection(col).doc(o.id).set(o).catch(function () {}); refresh(); }
function drop(col, id) { var o = S[col][id]; delete S[col][id]; persist(); if (db) db.collection(col).doc(id).delete().catch(function () {}); if (o && o.fotos && assets) o.fotos.forEach(function (f) { assets.delete(f).catch(function () {}); }); refresh(); }
function list(col) { return Object.keys(S[col]).map(function (k) { return S[col][k]; }); }

// ---------- Live data: La Baells, rain, desmogue ----------
var LIVE = { baells: null, baellsSerie: [], lluvia7: null, lluviaDias: [] };
function loadBaells() {
  var q = "https://analisi.transparenciacatalunya.cat/resource/gn9e-3qhr.json?$limit=60&$order=dia%20DESC&$where=" + encodeURIComponent("estaci like '%Baells%'");
  return fetch(q).then(function (r) { return r.json(); }).then(function (rows) {
    if (!rows || !rows.length) return;
    LIVE.baellsSerie = rows.map(function (r) { return { d: r.dia.slice(0, 10), p: +r.percentatge_volum_embassat, n: +r.nivell_absolut }; }).reverse();
    LIVE.baells = LIVE.baellsSerie[LIVE.baellsSerie.length - 1];
  }).catch(function () {});
}
function loadLluvia() {
  return fetch('https://api.open-meteo.com/v1/forecast?latitude=42.10&longitude=1.85&daily=precipitation_sum&past_days=14&forecast_days=1&timezone=Europe%2FMadrid')
    .then(function (r) { return r.json(); }).then(function (j) {
      var t = j.daily.time, p = j.daily.precipitation_sum; LIVE.lluviaDias = t.map(function (d, i) { return { d: d, mm: p[i] || 0 }; }).slice(0, -1);
      LIVE.lluvia7 = LIVE.lluviaDias.slice(-7).reduce(function (a, x) { return a + x.mm; }, 0);
    }).catch(function () {});
}
// Shedding months (1–12). Red deer drop antlers late winter, roe deer at the end of autumn
var DESMOGUE = [
  { k: 'ciervo', n: 'Ciervo', m: [2, 3, 4], t: 'Los machos grandes desmogan primero (febrero); los jóvenes hasta abril. Busca en solanas, comederos de invierno, pasos entre bosque y prado y cerca de fuentes.' },
  { k: 'corzo', n: 'Corzo', m: [10, 11, 12], t: 'Desmoga de octubre a diciembre y las cuernas son pequeñas: mira en lindes de bosque, zarzales y pasos estrechos. Los roedores las comen pronto, así que sal en cuanto empiece.' },
  { k: 'gamo', n: 'Gamo', m: [4, 5], t: 'Poco presente en el Berguedà; si lo hay, desmoga en abril y mayo.' }
];
function desmogueNow() { var m = new Date().getMonth() + 1; return DESMOGUE.filter(function (d) { return d.m.indexOf(m) >= 0; }); }

// A site's access condition → { ok: true/false/null, why }
function estado(s) {
  var c = s.cond || {}, m = new Date().getMonth() + 1;
  if (c.tipo === 'baells') {
    if (!LIVE.baells) return { ok: null, why: 'Sin dato del pantano ahora' };
    var ok = LIVE.baells.p <= c.max;

  var leyenda = unidades.map(function (u) { var d = u.i / N * L0; return '<div class="row" style="align-items:flex-start;margin:6px 0"><span style="flex:0 0 14px;height:14px;border-radius:3px;margin-top:3px;background:' + (u.e ? u.e[3] : '#bbb') + '"></span><span class="grow"><b>' + km(d) + '</b> · ' + esc(u.g ? geoShort(u.g) : 'Sin dato') + '</span></div>'; }).join('');
  showSheet(head('Corte geológico', '<button type="button" class="ghost" data-act="corteGo">Otro</button>') + '<div class="card">' + svg + '<p class="small">Altitud real (×' + dec(L0 / (hi - lo) * (H - 20) / W, 1) + ' exageración vertical) coloreada por la roca que aflora en cada punto. No muestra el buzamiento de las capas en profundidad.</p></div>' +
    '<div class="lab">Lo que cruzas de A a B</div>' + leyenda);
}

// ---------- Start ----------
$('eraPill').addEventListener('click', function () { setEra(filtroEra); });
applyLayers(); drawPins(); renderAlert();
Promise.all([loadBaells(), loadLluvia(), loadLluviaSitios()]).then(refresh);
if (!PREF.pein) loadPein(); // the GPS warnings need the PEIN outlines even with the layer hidden

// ---------- Sync: local copy first, the account when there is one ----------
(async function () {
  try {
    var c = window.claude && await window.claude.use('db'); if (!c) { numerar(); return; }
    db = c;
    try { assets = await window.claude.use('assets'); } catch (e) {}
    try { var sm = await window.claude.use('sample'); var lim = sm ? await sm.limits().catch(function () { return null; }) : null; sample = lim && lim.images ? sm : null; } catch (e) {}
    function cached(s) { return !!(s.metadata && s.metadata.fromCache); }
    var seenRain = false;
    ['sitios', 'piezas'].forEach(function (col) {
      var seen = false;
      c.collection(col).onSnapshot(function (snap) {
        var m = {}; snap.docs.forEach(function (d) { var x = d.data(); if (x) m[d.id] = x; });
        if (!cached(snap)) {
          synced = true;
          if (!seen) { seen = true; Object.keys(S[col]).forEach(function (k) { if (!m[k]) { m[k] = S[col][k]; c.collection(col).doc(k).set(S[col][k]).catch(function () {}); } }); }
        } else if (!synced && !snap.docs.length) return;
        var keep = {}; if (!synced) Object.keys(S[col]).forEach(function (k) { if (!m[k]) keep[k] = S[col][k]; });
        S[col] = Object.assign(keep, m); persist(); refresh();
        if (col === 'piezas' && !cached(snap)) numerar();
        if (col === 'sitios' && !cached(snap) && !seenRain) { seenRain = true; loadLluviaSitios().then(renderAlert); }
      }, function () {});
    });
  } catch (e) {}
})();
</script>
