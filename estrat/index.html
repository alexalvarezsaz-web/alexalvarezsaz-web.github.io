<script>

var BERGUEDA = [[41.95, 1.55], [42.36, 2.15]], CENTER = [42.13, 1.83];

var LIVE = { baells: null, baellsSerie: [], lluvia7: null, lluviaDias: [] };

}
// Shedding months (1–12). Red deer drop antlers late winter, roe deer at the end of autumn
var DESMOGUE = [
  { k: 'ciervo', n: 'Ciervo', m: [2, 3, 4], t: 'Los machos grandes desmogan primero (febrero); los jóvenes hasta abril. Busca en solanas, comederos de invierno, pasos entre bosque y prado y cerca de fuentes.' },
  { k: 'corzo', n: 'Corzo', m: [10, 11, 12], t: 'Desmoga de octubre a diciembre y las cuernas son pequeñas: mira en lindes de bosque, zarzales y pasos estrechos. Los roedores las comen pronto, así que sal en cuanto empiece.' },

function desmogueNow() { var m = new Date().getMonth() + 1; return DESMOGUE.filter(function (d) { return d.m.indexOf(m) >= 0; }); }

// A site's access condition → { ok: true/false/null, why }
function estado(s) {

  $('alertBtn').textContent = a.length ? a[0] + (a.length > 1 ? ' · +' + (a.length - 1) : '') : (b || 'Sin avisos ahora');
}

// ---------- Geology: what you stand on ----------
var ERAS = [ // period/epoch name in the ICGC table → start/end in millions of years, colour, what to look for
  ['Maastrichtià', 66, 72.1, '#a6d84a'], ['Campanià', 72.1, 83.6, '#bfe35d'], ['Santonià', 83.6, 86.3, '#b3de53'], ['Coniacià', 86.3, 89.8, '#a6d84a'], ['Turonià', 89.8, 93.9, '#bfe35d'], ['Cenomanià', 93.9, 100.5, '#b3de53'], ['Albià', 100.5, 113, '#ccea97'], ['Aptià', 113, 121.4, '#bfe48a'],
  ['Priabonià', 33.9, 37.7, '#fdcda1'], ['Bartonià', 37.7, 41.2, '#fdc091'], ['Lutecià', 41.2, 47.8, '#fcb482'], ['Cuisià', 47.8, 52, '#fca773'], ['Ilerdià', 52, 56, '#fca773'], ['Ypresià', 47.8, 56, '#fca773'], ['Thanetià', 56, 59.2, '#fdbf6f'],
  ['Holocè', 0, .012, '#f9f97f'], ['Plistocè', .012, 2.58, '#fff2ae'], ['Quaternari', 0, 2.58, '#f9f97f'],
  ['Pliocè', 2.58, 5.33, '#ffff99'], ['Miocè', 5.33, 23, '#ffff00'], ['Oligocè', 23, 33.9, '#fec07a'], ['Eocè', 33.9, 56, '#fdb46c'], ['Paleocè', 56, 66, '#fda75f'],
  ['Neogen', 2.58, 23, '#ffe619'], ['Paleogen', 23, 66, '#fd9a52'],
  ['Cretaci superior', 66, 100.5, '#a6d84a'], ['Cretaci inferior', 100.5, 145, '#8ccd57'], ['Cretaci', 66, 145, '#7fc64e'],

function eraOf(p) { var keys = [p.Edat, p.Epoca, p.Periode]; for (var i = 0; i < keys.length; i++) for (var j = 0; j < ERAS.length; j++) if (keys[i] && keys[i] !== 'Null' && keys[i].indexOf(ERAS[j][0]) === 0) return ERAS[j]; return null; }
function pistas(p) {
  var d = (p.Descripcio || '').toLowerCase(), per = (p.Periode || '') + ' ' + (p.Epoca || ''), out = [];
  if (/garumn/.test(d)) out.push('Garumniense: icnitas y huevos de dinosaurio, carofitas, gasterópodos de agua dulce y lignito. Fumanya y Vallcebre están protegidos: mira solo canchales y material suelto fuera del yacimiento.');
  else if (/Cretaci/.test(per)) out.push('Cretácico marino: rudistas, ostreidos, orbitolinas, equinodermos y algún ammonite.');
  if (/Eoc|Paleoc/.test(per) && /(calc|marg|gres|lutit)/.test(d)) out.push('Paleógeno marino: nummulites y alveolinas (las "lentejas"), equinoideos, gasterópodos, bivalvos y corales.');

  if (/Triàsic/.test(per)) out.push(/guix|keuper|argil/.test(d) ? 'Keuper: yesos con jacintos de Compostela (cuarzos rojos) y aragonitos: busca minerales.' : 'Triásico: en calizas del Muschelkalk, bivalvos y algún ceratites.');
  if (/Carbon|Permi|Devon|Silur|Ordovic/.test(per)) out.push('Paleozoico: pizarras con graptolites o plantas fósiles; filones con pirita y cuarzo.');

// ---------- Google Maps import (Takeout GeoJSON or list CSV) ----------
function coordsFromUrl(u) {
  var m = /[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/.exec(u) || /@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(u) || /\/search\/(-?\d+\.\d+),\s*\+?(-?\d+\.\d+)/.exec(decodeURIComponent(u)) || /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/.exec(u);
  return m ? [+m[1], +m[2]] : null;
}
function parseCsv(t) {
  var rows = [], row = [], f = '', q = false;
  for (var i = 0; i < t.length; i++) { var c = t[i]; if (q) { if (c === '"' && t[i + 1] === '"') { f += '"'; i++; } else if (c === '"') q = false; else f += c; } else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; } else if (c !== '\r') f += c; }
  if (f || row.length) { row.push(f); rows.push(row); } return rows;
}
document.addEventListener('change', async function (e) {
  if (e.target.id !== 'imp') return;
  var files = Array.prototype.slice.call(e.target.files || []), add = 0, sin = [], have = {};
  list('sitios').forEach(function (s) { have[s.nombre + '|' + (s.lat || 0).toFixed(4)] = 1; });
  function push(nombre, lat, lng, notas, lista) {
    if (lat == null || (lat === 0 && lng === 0)) { sin.push(nombre); return; }
    var k = nombre + '|' + lat.toFixed(4); if (have[k]) return; have[k] = 1;
    var tipo = /f[oó]sil|dino|ammon|trilob/i.test(nombre + lista) ? 'fosil' : /mina|mineral|cristal|cuarz|pirit/i.test(nombre + lista) ? 'mineral' : /cuern|desmog|ciervo|corzo/i.test(nombre + lista) ? 'cuerno' : /cr[aá]neo|hueso/i.test(nombre + lista) ? 'craneo' : 'otro';
    put('sitios', { id: uid('s'), nombre: nombre || 'Sin nombre', tipo: tipo, notas: [notas, lista ? 'Lista de Google Maps: ' + lista : ''].filter(Boolean).join('\n'), cond: { tipo: '' }, lat: lat, lng: lng, geo: '', ts: Date.now() }); add++;
  }
  for (var i = 0; i < files.length; i++) {
    var txt = await files[i].text(), lista = files[i].name.replace(/\.(csv|json|geojson)$/i, '');
    if (/\.csv$/i.test(files[i].name)) {
      var rows = parseCsv(txt), h = (rows.shift() || []).map(function (x) { return x.toLowerCase(); });
      var iT = h.findIndex(function (x) { return /t[ií]tulo|title/.test(x); }), iN = h.findIndex(function (x) { return /nota|note/.test(x); }), iU = h.findIndex(function (x) { return /url/.test(x); });
      rows.forEach(function (r) { if (!r[iT] && !r[iU]) return; var ll = coordsFromUrl(r[iU] || ''); push(r[iT] || '', ll ? ll[0] : null, ll ? ll[1] : null, r[iN] || '', lista); });
    } else {
      try { (JSON.parse(txt).features || []).forEach(function (f) { var pr = f.properties || {}, c = (f.geometry || {}).coordinates || [0, 0], nm = (pr.location && pr.location.name) || pr.name || pr.Title || ''; var ll = c[0] || c[1] ? [c[1], c[0]] : coordsFromUrl(pr.google_maps_url || ''); push(nm || 'Sitio guardado', ll ? ll[0] : null, ll ? ll[1] : null, pr.location && pr.location.address || '', ''); }); } catch (err) {}
    }
  }

  renderSitios();

// Offline: a service worker keeps every tile it sees; the button walks the whole comarca once
function tileUrls() {
  var urls = [], z, x, y;
  function t2(lat, lng, z) { var n = Math.pow(2, z), r = lat * Math.PI / 180; return [Math.floor((lng + 180) / 360 * n), Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)]; }
  for (z = 10; z <= 15; z++) {
    var a = t2(BERGUEDA[1][0], BERGUEDA[0][1], z), b = t2(BERGUEDA[0][0], BERGUEDA[1][1], z);
    for (x = a[0]; x <= b[0]; x++) for (y = a[1]; y <= b[1]; y++) {
      urls.push('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x);
      if (z <= 14) { var n = Math.pow(2, z), w = x / n * 40075016.686 - 20037508.343, e2 = (x + 1) / n * 40075016.686 - 20037508.343, no = 20037508.343 - y / n * 40075016.686, so = 20037508.343 - (y + 1) / n * 40075016.686; urls.push(GEO._url + L.Util.getParamString(Object.assign({}, GEO.wmsParams, { crs: 'EPSG:3857', bbox: [w, so, e2, no].join(','), width: 256, height: 256 }), GEO._url, true)); }
    }
  }
  return urls;
}
document.addEventListener('click', async function (e) {
  if (e.target.id !== 'dl') return;
  var b = e.target, note = $('dlNote'), urls = tileUrls(), done = 0, fail = 0;
  b.disabled = true;
  try {
    var c = await caches.open('estrat-tiles');
    for (var i = 0; i < urls.length; i += 8) {
      await Promise.all(urls.slice(i, i + 8).map(function (u) { return c.match(u).then(function (hit) { return hit || fetch(u, { mode: 'cors' }).then(function (r) { if (r.ok) return c.put(u, r); fail++; }); }).catch(function () { fail++; }); }));
      done = Math.min(urls.length, i + 8); note.textContent = done + ' de ' + urls.length + ' trozos de mapa…';
    }
    note.textContent = 'Listo: el Berguedà está guardado en el móvil' + (fail ? ' (fallaron ' + fail + ' trozos; vuelve a pulsar para reintentar)' : '') + '.';
  } catch (err) { note.textContent = 'No se pudo guardar: quizá falta espacio.'; }
  b.disabled = false;
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});

// ---------- Sync: local copy first, the account when there is one ----------
(async function () {

        } else if (!synced && !snap.docs.length) return;
