<style>
/* Layout: a dark-green hero says what's left this month, then the month's figures, the fixed bills to tick off and the month's records. Charts, the year, the savings jars and settings sit behind the bottom tabs; "+" adds a movement from anywhere */
:root {
  --bg: #f2f4ef; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --line: #e1e0d9; --axis: #c3c2b7;
  --acc: #127a52; --acc-ink: #ffffff; --acc-soft: #dcefe4;
  --hero1: #0f3b2c; --hero2: #17573f; --on-hero: #f1fbf5; --on-hero2: #a9d9bf;
  --s-fijo: #2a78d6; --s-var: #eb6834; --s-ing: #1baf7a; --s-aho: #eda100; --s-prev: #898781;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --crit: #d03b3b; --crit-ink: #b42828;
  --ring: rgba(11,11,11,0.10);
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --line: #2c2c2a; --axis: #383835;
  --acc: #3fc58b; --acc-ink: #06160f; --acc-soft: #173527;
  --hero1: #0f3b2c; --hero2: #145238;
  --s-fijo: #3987e5; --s-var: #d95926; --s-ing: #199e70; --s-aho: #c98500;
  --good-ink: #0ca30c; --crit-ink: #e66767; --ring: rgba(255,255,255,0.10); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --line: #2c2c2a; --axis: #383835;
  --acc: #3fc58b; --acc-ink: #06160f; --acc-soft: #173527;
  --hero1: #0f3b2c; --hero2: #145238;
  --s-fijo: #3987e5; --s-var: #d95926; --s-ing: #199e70; --s-aho: #c98500;
  --good-ink: #0ca30c; --crit-ink: #e66767; --ring: rgba(255,255,255,0.10); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.4 var(--sans); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 600px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left)) calc(150px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 0 10px; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; border-radius: 7px; }
.mnav { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--ring); border-radius: 999px; padding: 3px; }
.mnav button { border: 0; background: none; min-width: 36px; height: 36px; border-radius: 999px; font-size: 18px; color: var(--ink2); }
.mnav button.lab { font-size: 15px; font-weight: 700; color: var(--ink); padding: 0 6px; min-width: 120px; white-space: nowrap; }
.brand { white-space: nowrap; }
@media (max-width: 400px) { .brand span { display: none; } }
.mnav button:hover { background: var(--bg); }
.sync { font-size: 12px; color: var(--muted); text-align: right; min-height: 16px; margin-top: -6px; }

.hero { background: linear-gradient(150deg, var(--hero1), var(--hero2)); color: var(--on-hero); border-radius: 20px; padding: 18px 18px 16px; margin: 6px 0 14px; }
.hero .k { font-size: 13px; color: var(--on-hero2); font-weight: 600; }
.hero .big { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin: 2px 0 12px; }
.hero .big.neg { color: #ffb4a8; }
.hero .accs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hero .acc { background: rgba(255,255,255,.08); border-radius: 12px; padding: 8px 10px; }
.hero .acc b { display: block; font-size: 17px; }
.hero .acc span { font-size: 12px; color: var(--on-hero2); }
.hero .note { font-size: 12px; color: var(--on-hero2); margin-top: 10px; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 10px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--ink2); font-weight: 600; display: flex; align-items: center; gap: 5px; }
.tile .k i { width: 8px; height: 8px; border-radius: 3px; display: inline-block; flex: none; }
.tile b { display: block; font-size: 17px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.wide { grid-column: span 3; display: flex; align-items: center; justify-content: space-between; }
.tile.wide b { margin: 0; }

.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
.card h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 small { font-weight: 500; font-size: 13px; color: var(--muted); }
.card h3 { font-size: 13px; color: var(--ink2); margin: 14px 0 6px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.lnk { border: 0; background: none; color: var(--acc); font-weight: 700; font-size: 14px; padding: 6px 4px; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.small { font-size: 13px; color: var(--muted); }

.row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--bg); display: grid; place-items: center; font-size: 18px; flex: none; }
.row .mid { flex: 1; min-width: 0; }
.row .mid b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .mid span { font-size: 13px; color: var(--muted); }
.row .amt { font-weight: 700; white-space: nowrap; }
.amt.pos { color: var(--good-ink); }
.amt.aho { color: var(--ink2); }
.row.tap { cursor: pointer; }
.chk { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--axis); background: none; flex: none; display: grid; place-items: center; font-size: 17px; font-weight: 800; color: transparent; }
.chk.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.due { font-weight: 700; color: var(--crit-ink); }
.day { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 12px 0 2px; }
.search { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px; font-size: 16px; margin-bottom: 6px; }

.pb { margin: 8px 0 12px; }
.pb .t { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.pb .t span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.pb .bar { height: 10px; border-radius: 5px; background: var(--line); margin-top: 5px; overflow: hidden; }
.pb .bar i { display: block; height: 100%; border-radius: 5px; background: var(--good); }
.pb.warn .bar i { background: var(--warn); }
.pb.over .bar i { background: var(--crit); }
.pb .st { font-size: 12px; margin-top: 3px; color: var(--ink2); }
.pb.over .st { color: var(--crit-ink); font-weight: 700; }

/* charts */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink2); margin: 2px 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend i.dash { height: 2px; border-radius: 0; vertical-align: 3px; background: repeating-linear-gradient(90deg, var(--s-prev) 0 4px, transparent 4px 7px) !important; }
.donutw { display: flex; align-items: center; gap: 14px; }
.donutw svg { width: 150px; height: 150px; flex: none; }
.donutw .lg { flex: 1; min-width: 0; }
.donutw .lg div { display: flex; align-items: center; gap: 7px; padding: 4px 0; font-size: 14px; }
.donutw .lg div i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.donutw .lg div span { flex: 1; color: var(--ink2); }
.donutw .lg div b { white-space: nowrap; }
@media (max-width: 380px) { .donutw { flex-direction: column; align-items: stretch; } .donutw svg { margin: 0 auto; } }
.hb { display: grid; grid-template-columns: minmax(84px, 38%) 1fr; align-items: center; gap: 6px 8px; font-size: 14px; }
.hb .l { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb .b { position: relative; height: 22px; }
.hb .b i, .hb .b u { position: absolute; left: 0; top: 4px; height: 14px; border-radius: 0 4px 4px 0; min-width: 2px; }
.hb .b u { background: var(--line); box-shadow: inset -2px 0 0 var(--axis); }
.hb .b span { position: absolute; top: 2px; font-size: 13px; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
svg.ch { width: 100%; height: auto; display: block; overflow: visible; }
svg.ch text { font: 11px var(--sans); fill: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: right; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr.now td { font-weight: 700; }
.tblw { overflow-x: auto; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 13px; padding: 6px 9px; border-radius: 8px; max-width: 240px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }

/* hucha */
.jar { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.jar:first-child { border-top: 0; }
.jar .ic { font-size: 26px; width: 44px; height: 44px; border-radius: 13px; background: var(--bg); display: grid; place-items: center; flex: none; }
.jar .mid { flex: 1; min-width: 0; }
.jar .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.btn2 { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 36px; padding: 0 12px; font-weight: 600; font-size: 14px; }

/* nav + fab */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--ring); padding: 6px max(8px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-right)); }
.tabs .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 1px; padding: 4px 0; font-size: 11px; font-weight: 600; color: var(--muted); border-radius: 10px; }
.tabs button .e { font-size: 20px; line-height: 1.2; filter: grayscale(1); opacity: .7; }
.tabs button[aria-current="page"] { color: var(--acc); }
.tabs button[aria-current="page"] .e { filter: none; opacity: 1; }
.fab { position: fixed; z-index: 21; right: max(18px, calc(50% - 282px)); bottom: calc(76px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--acc); color: var(--acc-ink); font-size: 32px; font-weight: 400; line-height: 1; box-shadow: 0 8px 22px rgba(18,122,82,.35); }

/* sheets */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 600px; max-height: 92vh; border-radius: 20px 20px 0 0; background: var(--surface); color: var(--ink); }
dialog.sheet::backdrop { background: rgba(0,0,0,.45); }
@media (min-width: 640px) { dialog.sheet { margin: auto; border-radius: 20px; } }
.sh { padding: 16px max(16px, env(safe-area-inset-left)) calc(18px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right)); }
.sh .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sh .hd h2 { margin: 0; font-size: 18px; }
.x { border: 0; background: var(--bg); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; color: var(--ink2); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 12px; }
.seg button { border: 0; background: none; min-height: 38px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.amtin { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); margin-bottom: 14px; }
.amtin:focus-within { border-color: var(--acc); }
.amtin input { flex: 1; min-width: 0; border: 0; background: none; font-size: 40px; font-weight: 800; padding: 4px 0; outline: none; }
.amtin span { font-size: 28px; font-weight: 700; color: var(--muted); }
label.f { display: block; font-size: 13px; font-weight: 700; color: var(--ink2); margin: 12px 0 6px; }
input.in, select.in { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); padding: 0 12px; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 36px; padding: 0 12px; font-size: 14px; font-weight: 500; }
.chips button[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 700; }
.go { width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: var(--acc); color: var(--acc-ink); font-size: 17px; font-weight: 700; margin-top: 18px; }
.go:disabled { opacity: .45; }
.del { width: 100%; min-height: 44px; border: 0; background: none; color: var(--crit-ink); font-weight: 700; margin-top: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cat { display: grid; grid-template-columns: 40px 1fr 96px 34px; gap: 6px; align-items: center; padding: 5px 0; }
.cat input { height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); padding: 0 8px; font-size: 16px; min-width: 0; width: 100%; }
.cat input.e { text-align: center; padding: 0; }
.cat .x { width: 34px; height: 34px; font-size: 15px; }
.welcome p { color: var(--ink2); margin: 0 0 6px; }

/* ---------- Skin: a calm banking look (Inter, neutral greys, one emerald accent, tinted category tiles) ---------- */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --ink: #0f172a; --ink2: #475569; --muted: #8a94a6; --line: #e8eaef; --axis: #cfd4dc;
  --acc: #0e9f6e; --acc-ink: #ffffff; --acc-soft: #e3f6ee; --good-ink: #067a52; --crit-ink: #c2341f;
  --hero1: #0a1f18; --hero2: #12402f; --on-hero: #f2fbf6; --on-hero2: #9fd2b8;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
  --tile-l: 94%; --tile-s: 75%; --tile-fg-l: 34%;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0c0e; --surface: #15171a; --ink: #eef1f5; --ink2: #b4bcc8; --muted: #7d8696; --line: #24272d; --axis: #343841;
  --acc: #34d399; --acc-ink: #062016; --acc-soft: #12301f; --good-ink: #34d399; --crit-ink: #f87171;
  --shadow: none; --tile-l: 18%; --tile-s: 35%; --tile-fg-l: 75%;
} }
:root[data-theme="dark"] {
  --bg: #0b0c0e; --surface: #15171a; --ink: #eef1f5; --ink2: #b4bcc8; --muted: #7d8696; --line: #24272d; --axis: #343841;
  --acc: #34d399; --acc-ink: #062016; --acc-soft: #12301f; --good-ink: #34d399; --crit-ink: #f87171;
  --shadow: none; --tile-l: 18%; --tile-s: 35%; --tile-fg-l: 75%;
}
body { font-feature-settings: "cv11", "ss01"; letter-spacing: -.005em; }
.top { position: sticky; top: 0; z-index: 15; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); margin: 0 -16px; padding: 12px 16px 10px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
.mnav { border: 1px solid var(--line); box-shadow: var(--shadow); }
.mnav button.lab { font-weight: 650; font-size: 14px; }
.sync { margin: 0 0 4px; }
h1.vt { font-size: 26px; font-weight: 700; letter-spacing: -.03em; margin: 6px 2px 12px; }
h1.vt small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-bottom: 2px; }
.cents { font-size: .62em; font-weight: 600; opacity: .8; margin-left: 1px; }

.hero { border-radius: 22px; padding: 20px 20px 18px; position: relative; overflow: hidden; box-shadow: 0 10px 30px -12px rgba(10, 31, 24, .55); }
.hero::after { content: ""; position: absolute; right: -60px; top: -70px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(52, 211, 153, .22), transparent 70%); pointer-events: none; }
.hero .k { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.hero .big { font-size: 40px; font-weight: 700; letter-spacing: -.035em; margin: 6px 0 14px; }
.hero .acc { background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .08); border-radius: 14px; padding: 10px 12px; }
.hero .acc b { font-size: 16px; font-weight: 650; margin-top: 2px; }
.tile, .card { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.tile { border-radius: 16px; padding: 12px; }
.tile .k { font-weight: 500; color: var(--muted); font-size: 12px; }
.tile b { font-size: 17px; font-weight: 650; letter-spacing: -.02em; }
.card { border-radius: 18px; padding: 16px; }
.card h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.card h3 { font-size: 11px; color: var(--muted); letter-spacing: .08em; font-weight: 600; }

.day { font-size: 11px; letter-spacing: .08em; font-weight: 600; padding: 14px 0 4px; }
.chk { border-radius: 50%; width: 30px; height: 30px; font-size: 15px; border-width: 1.5px; }

.tabs { background: color-mix(in srgb, var(--surface) 94%, transparent); border-top: 1px solid var(--line); }
.tabs button { font-size: 10.5px; font-weight: 600; gap: 3px; padding: 6px 0 4px; }
.tabs .ti { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--acc); }
.fab { border-radius: 50%; width: 56px; height: 56px; font-size: 30px; font-weight: 300; box-shadow: 0 10px 24px -6px rgba(14, 159, 110, .55); }

.seg { border-radius: 12px; background: var(--bg); }

/* insight line and ranked lists */

.ins:first-of-type { border-top: 0; }
.ins .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; font-size: 15px; background: hsl(var(--h, 160) var(--tile-s) var(--tile-l)); }
.ins b { color: var(--ink); font-weight: 600; }
.rk { display: grid; grid-template-columns: 58px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }

.rk .v { font-weight: 600; font-variant-numeric: tabular-nums; grid-row: span 2; }
.rk .w { grid-column: 2; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sum { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 2px 0 10px; }
.sum b { font-size: 22px; font-weight: 700; letter-spacing: -.03em; }

<script>
// ---------- Data ----------
var LS = 'cashflow.v1', S, db = null, synced = false, syncErr = '';
var MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
var MES3 = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
var CUENTAS = { banco: { n: 'Banco', e: '🏦' }, efectivo: { n: 'Efectivo', e: '💶' } };
var DEF_CATS = [
  ['vivienda', '🏠', 'Vivienda', 'g'], ['super', '🛒', 'Supermercado', 'g'], ['compras', '🛍️', 'Compras', 'g'], ['servicios', '💡', 'Luz, agua y gas', 'g'], ['movil', '📱', 'Móvil e internet', 'g'],
  ['transporte', '🚗', 'Transporte', 'g'], ['comer', '🍽️', 'Bares y restaurantes', 'g'], ['ocio', '🎮', 'Ocio', 'g'], ['suscr', '📺', 'Suscripciones', 'g'],
  ['salud', '💊', 'Salud', 'g'], ['ropa', '👕', 'Ropa', 'g'], ['personal', '💈', 'Cuidado personal', 'g'], ['estudios', '📚', 'Estudios', 'g'],
  ['regalos', '🎁', 'Regalos', 'g'], ['cuotas', '💳', 'Cuotas', 'g'], ['viajes', '✈️', 'Viajes', 'g'], ['pareja', '❤️', 'Pareja', 'g'], ['amigos', '🤝', 'Bizum a amigos', 'g'],
  ['tabaco', '🚬', 'Tabaco', 'g'], ['tramites', '🏛️', 'Impuestos y trámites', 'g'], ['otros', '📦', 'Otros', 'g'], ['propiog', '🔁', 'A mis otras cuentas', 'g', 1],
  ['sueldo', '💰', 'Sueldo', 'i'], ['extra', '✨', 'Extras', 'i'], ['bizumr', '📲', 'Bizum recibidos', 'i'], ['intereses', '🏦', 'Intereses', 'i'], ['regaloi', '🎁', 'Regalos', 'i'], ['devol', '↩️', 'Devoluciones', 'i'],
  ['otrosi', '📥', 'Otros', 'i'], ['propio', '🔁', 'De mis otras cuentas', 'i', 1]
].map(function (c) { var o = { id: c[0], e: c[1], n: c[2], t: c[3] }; if (c[4]) o.neutro = true; return o; });
// One hue per category for its icon tile; categories made later get a hue from their id
var HUE = { vivienda: 215, super: 160, compras: 265, servicios: 45, movil: 200, transporte: 25, comer: 10, ocio: 290, suscr: 330, salud: 175, ropa: 240, personal: 300, estudios: 50, regalos: 345, cuotas: 220, viajes: 190, pareja: 350, amigos: 140, tabaco: 30, tramites: 230, otros: 0, propiog: 210, sueldo: 150, extra: 55, bizumr: 140, intereses: 170, regaloi: 345, devol: 190, otrosi: 0, propio: 210 };
function hueOf(id) { if (HUE[id] != null) return HUE[id]; var h = 0; String(id).split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) % 360; }); return h; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return iso(new Date()); }
function mesDe(f) { return String(f).slice(0, 7); }
function mesHoy() { return mesDe(today()); }
function mesAdd(m, n) { var y = +m.slice(0, 4), k = +m.slice(5, 7) - 1 + n; y += Math.floor(k / 12); k = ((k % 12) + 12) % 12; return y + '-' + pad(k + 1); }
function mesNom(m) { return MESES[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4); }
function diasMes(m) { return new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate(); }
function defAj() { return { init: false, ini: { banco: 0, efectivo: 0 }, desde: mesHoy(), cats: DEF_CATS.slice(), pres: {} }; }
function load() {
  var r = null; try { r = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
  r = r && typeof r === 'object' ? r : {};
  return { movs: r.movs || {}, fijos: r.fijos || {}, metas: r.metas || {}, inversiones: r.inversiones || {}, cartera: r.cartera || {}, aj: r.aj || defAj() };
}
S = load();
function persist() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var NF, NF0;
try { NF = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', useGrouping: 'always' }); NF.format(1000); } catch (e) { NF = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }); }
try { NF0 = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' }); NF0.format(1000); } catch (e) { NF0 = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }); }
function eur(v) { return NF.format(Math.round((v || 0) * 100) / 100 || 0); }
function eur0(v) { return NF0.format(Math.round(v || 0)); }
// The same amount as HTML, with the cents set smaller
function eurH(v) {
  var s = '', parts; try { parts = NF.formatToParts(Math.round((v || 0) * 100) / 100 || 0); } catch (e) { return esc(eur(v)); }
  parts.forEach(function (p) { s += p.type === 'decimal' ? '<span class="cents">' + p.value : p.type === 'fraction' ? p.value + '</span>' : esc(p.value); });
  return s;
}
function parseNum(s) {
  s = String(s == null ? '' : s).replace(/[\s€]/g, '');
  if (!s) return NaN;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  return parseFloat(s);
}
function numTxt(v) { var r = Math.round((+v || 0) * 100) / 100; return r ? String(r).replace('.', ',') : ''; }
function cat(id) { for (var i = 0; i < S.aj.cats.length; i++) if (S.aj.cats[i].id === id) return S.aj.cats[i]; return { id: id || '', e: '📦', n: 'Sin categoría', t: 'g' }; }

// Writes go to this device first and to the account when there is one
function put(col, o) {
  if (col === 'aj') { S.aj = o; persist(); render(); if (db) db.collection('ajustes').doc('general').set(o).catch(function () {}); return; }
  S[col][o.id] = o; persist(); render();
  if (db) db.collection(col).doc(o.id).set(o).catch(function () {});
}
function del(col, id) { delete S[col][id]; persist(); render(); if (db) db.collection(col).doc(id).delete().catch(function () {}); }

// ---------- Money maths ----------
function movsMes(m) { return Object.values(S.movs).filter(function (x) { return mesDe(x.fecha) === m; }).sort(function (a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (b.ts || 0) - (a.ts || 0); }); }
// What one movement does to each account: income adds, spending and saving take out, a transfer moves between them
function efecto(x, out) {
  var v = +x.importe || 0, c = x.cuenta || 'banco';
  if (x.tipo === 'ingreso') out[c] += v;
  else if (x.tipo === 'gasto' || x.tipo === 'ahorro') out[c] -= v;
  else if (x.tipo === 'traspaso') { out[c] -= v; out[x.a || (c === 'banco' ? 'efectivo' : 'banco')] += v; }
}
function saldoInicio(m) {
  var o = { banco: +S.aj.ini.banco || 0, efectivo: +S.aj.ini.efectivo || 0 };
  Object.values(S.movs).forEach(function (x) { var k = mesDe(x.fecha); if (k >= S.aj.desde && k < m) efecto(x, o); });
  return o;
}
function fijosMes(m) {
  return Object.values(S.fijos).filter(function (f) { return f.desde <= m && (!f.hasta || m <= f.hasta); })
    .sort(function (a, b) { return (a.dia || 99) - (b.dia || 99) || String(a.nombre).localeCompare(b.nombre); });
}
function pagoDe(f, m) { var ms = movsMes(m); for (var i = 0; i < ms.length; i++) if (ms[i].fijo === f.id) return ms[i]; return null; }
function resumen(m) {
  var r = { ing: 0, gas: 0, fijos: 0, vars: 0, aho: 0, porPagar: 0, porCat: {}, porCta: { banco: 0, efectivo: 0 } };
  movsMes(m).forEach(function (x) {
    var v = +x.importe || 0;
    // Money that only moves between Alex's own accounts changes the balance but is neither income nor spending
    if ((x.tipo === 'ingreso' || x.tipo === 'gasto') && cat(x.cat).neutro) return;
    if (x.tipo === 'ingreso') r.ing += v;
    else if (x.tipo === 'gasto') { r.gas += v; if (x.fijo) r.fijos += v; else r.vars += v; r.porCat[x.cat] = (r.porCat[x.cat] || 0) + v; r.porCta[x.cuenta || 'banco'] += v; }
    else if (x.tipo === 'ahorro') r.aho += v;
  });
  fijosMes(m).forEach(function (f) { if (f.tipo !== 'ingreso' && !pagoDe(f, m)) r.porPagar += +f.importe || 0; });
  r.ini = saldoInicio(m);
  r.fin = { banco: r.ini.banco, efectivo: r.ini.efectivo };
  movsMes(m).forEach(function (x) { efecto(x, r.fin); });
  return r;
}
function saldoMeta(id) { var s = 0; Object.values(S.movs).forEach(function (x) { if (x.tipo === 'ahorro' && (x.meta || '') === id) s += +x.importe || 0; }); return s; }

// ---------- View state ----------
var V = { v: 'mes', m: mesHoy(), q: '' };
function setView(v) { V.v = v; render(); window.scrollTo(0, 0); }
$('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setView(b.dataset.v); });
$('mPrev').onclick = function () { V.m = mesAdd(V.m, V.v === 'anio' ? -12 : -1); render(); };
$('mNext').onclick = function () { V.m = mesAdd(V.m, V.v === 'anio' ? 12 : 1); render(); };
$('mLab').onclick = function () { V.m = mesHoy(); render(); };
$('fab').onclick = function () { openMov(null, {}); };

function render() {
  [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { if (b.dataset.v === V.v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  $('mLab').textContent = V.v === 'anio' ? 'Año ' + V.m.slice(0, 4) : mesNom(V.m);
  $('mLab').parentNode.style.visibility = (V.v === 'huchas' || V.v === 'aj') ? 'hidden' : '';
  $('fab').hidden = V.v === 'aj' || !S.aj.init;
  var h = !S.aj.init ? vWelcome() : V.v === 'mes' ? vMes() : V.v === 'graf' ? vGraf() : V.v === 'anio' ? vAnio() : V.v === 'huchas' ? vHuchas() : vAjustes();
  if (S.aj.init) {
    var mn = MESES[+V.m.slice(5, 7) - 1];
    var tt = { mes: ['Resumen', mn], graf: ['Análisis', mn + ' ' + V.m.slice(0, 4)], anio: ['Resumen anual', V.m.slice(0, 4)], huchas: ['Patrimonio', 'Ahorro e inversiones'], aj: ['Cash Flow', 'Ajustes'] }[V.v];
    h = '<h1 class="vt"><small>' + esc(tt[0]) + '</small>' + esc(tt[1]) + '</h1>' + h;
  }
  var keepQ = document.activeElement && document.activeElement.id === 'q';
  $('view').innerHTML = h;
  if (keepQ) { var q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  syncTxt();
}
function syncTxt() {
  $('sync').textContent = syncErr || (db ? (synced ? '' : 'Sincronizando…') : 'Guardado en este dispositivo');
}

// ---------- First run ----------
function vWelcome() {
  return '<div class="card welcome"><h2>Bienvenido a Cash Flow 👋</h2>' +
    '<p>Para empezar, dime cuánto tienes ahora mismo. A partir de aquí la app suma y resta sola con lo que apuntes.</p>' +
    '<label class="f" for="wB">🏦 Saldo en el banco</label><input class="in num" id="wB" inputmode="decimal" placeholder="0,00">' +
    '<label class="f" for="wE">💶 Efectivo que tienes</label><input class="in num" id="wE" inputmode="decimal" placeholder="0,00">' +
    '<p class="small" style="margin-top:10px">Cuenta como saldo al empezar ' + esc(mesNom(mesHoy()).toLowerCase()) + '. Lo puedes cambiar en Ajustes.</p>' +
    '<button type="button" class="go" data-act="welcome">Empezar</button></div>';
}

// ---------- Mes ----------
function vMes() {
  var m = V.m, r = resumen(m), antes = m < S.aj.desde;
  if (antes) return '<div class="card"><p class="empty">Empezaste a usar Cash Flow en ' + esc(mesNom(S.aj.desde).toLowerCase()) + '. Antes de eso no hay datos.</p><button class="lnk" data-act="hoy">Ir al mes actual</button></div>';
  var total = r.fin.banco + r.fin.efectivo, queda = total - r.porPagar;
  var h = '<section class="hero"><div class="k">Te queda este mes' + (r.porPagar ? ' (ya descontados los fijos)' : '') + '</div>' +
    '<div class="big num' + (queda < 0 ? ' neg' : '') + '">' + eurH(queda) + '</div>' +
    '<div class="accs"><div class="acc"><span>Banco</span><b class="num">' + eurH(r.fin.banco) + '</b></div><div class="acc"><span>Efectivo</span><b class="num">' + eurH(r.fin.efectivo) + '</b></div></div>' +
    '<div class="note">Saldo del mes anterior: <b class="num">' + eur(r.ini.banco + r.ini.efectivo) + '</b>' + (r.porPagar ? ' · Fijos por pagar: <b class="num">' + eur(r.porPagar) + '</b>' : '') + '</div></section>';
  h += '<div class="tiles">' +
    '<div class="tile"><div class="k"><i style="background:var(--s-ing)"></i>Ingresos</div><b class="num">' + eurH(r.ing) + '</b></div>' +
    '<div class="tile"><div class="k"><i style="background:var(--s-var)"></i>Gastos</div><b class="num">' + eurH(r.gas) + '</b></div>' +
    '<div class="tile"><div class="k"><i style="background:var(--s-aho)"></i>Ahorro</div><b class="num">' + eurH(r.aho) + '</b></div></div>';
  h += insightsMes(m, r);
  // budgets
  var pres = S.aj.cats.filter(function (c) { return c.t === 'g' && +S.aj.pres[c.id] > 0; });
  if (pres.length) {
    h += '<section class="card"><h2>Presupuestos <button class="lnk" data-act="goaj">Editar</button></h2>';
    pres.forEach(function (c) {
      var lim = +S.aj.pres[c.id], g = r.porCat[c.id] || 0, p = g / lim, cls = p > 1 ? 'over' : p >= .8 ? 'warn' : '';
      var st = p > 1 ? '⚠ Te pasas ' + eur(g - lim) : p >= .8 ? '● Quedan ' + eur(lim - g) + ', ojo' : '✓ Quedan ' + eur(lim - g);
      h += '<div class="pb ' + cls + '"><div class="t"><b>' + c.e + ' ' + esc(c.n) + '</b><span class="num">' + eur(g) + ' / ' + eur(lim) + '</span></div><div class="bar"><i style="width:' + Math.min(100, p * 100).toFixed(1) + '%"></i></div><div class="st">' + st + '</div></div>';
    });
    h += '</section>';
  }
  // fixed
  var fs = fijosMes(m), hoy = today();
  h += '<section class="card"><h2>📌 Gastos fijos <span><small class="num">' + (r.porPagar ? eur(r.porPagar) + ' por pagar' : fs.length ? 'Todo pagado' : '') + '</small> <button class="lnk" data-act="newfijo">+ Añadir</button></span></h2>';
  if (!fs.length) h += '<p class="empty">Apunta aquí lo que pagas cada mes (alquiler, móvil, gimnasio…). Se repite solo y lo marcas al pagarlo.</p>';
  fs.forEach(function (f) {
    var p = pagoDe(f, m), c = f.tipo === 'ahorro' ? { e: '🐷', n: (S.metas[f.meta] || {}).nombre || 'Ahorro' } : cat(f.cat);
    var vence = f.dia ? m + '-' + pad(Math.min(f.dia, diasMes(m))) : '', tarde = !p && vence && vence < hoy;
    var sub = (f.dia ? (tarde ? '<span class="due">⚠ Vencido el ' + f.dia + '</span>' : 'Día ' + f.dia) + ' · ' : '') + esc(c.n) + ' · ' + CUENTAS[f.cuenta || 'banco'].n;
    h += '<div class="row"><button type="button" class="chk' + (p ? ' on' : '') + '" data-act="pagar" data-id="' + f.id + '" aria-pressed="' + !!p + '" aria-label="' + (p ? 'Pagado: ' : 'Marcar como pagado: ') + esc(f.nombre) + '">✓</button>' +
      '<div class="mid tap" data-act="editfijo" data-id="' + f.id + '"><b>' + esc(f.nombre) + '</b><span>' + sub + '</span></div>' +
      '<div class="amt num' + (f.tipo === 'ingreso' ? ' pos' : '') + '">' + eur(p ? p.importe : f.importe) + '</div></div>';
  });
  h += '</section>';
