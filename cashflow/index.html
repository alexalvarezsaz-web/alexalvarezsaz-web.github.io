<title>Cash Flow</title>

<meta name="apple-mobile-web-app-title" content="Cash Flow">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a single phone column. A forest-green balance card leads, then what needs a decision (bills due, this month against your normal month),
   then the record itself. Five tabs at the bottom; "+" adds from anywhere; details open in sheets that rise from the bottom. */
:root {
  --bg: #f2f5f3; --surface: #ffffff; --surface2: #f6f8f7; --ink: #0d1512; --ink2: #4a5752; --muted: #86928d; --line: #e3e8e5; --axis: #cdd5d1;
  --acc: #0b8a5f; --acc-ink: #ffffff; --acc-soft: #e1f3ea; --pos: #08744c; --neg: #c2361f; --warn: #a8690b;
  --forest1: #0b231a; --forest2: #134a35; --on-forest: #f1faf5; --on-forest2: #a3d4bb; --mint: #3fd09a;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s-prev: #9aa5a0;
  --good: #0ca30c; --warnc: #fab219; --crit: #d03b3b;
  --tile-l: 94%; --tile-s: 62%; --tile-fg: 34%;
  --shadow: 0 1px 2px rgba(13, 21, 18, .04), 0 2px 8px rgba(13, 21, 18, .05);
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Space Grotesk", "Inter", system-ui, sans-serif;
  --r-card: 20px; --r-ctl: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #090c0b; --surface: #121715; --surface2: #171d1a; --ink: #ecf3ef; --ink2: #b1bfb8; --muted: #7a8983; --line: #212a26; --axis: #313b37;
  --acc: #3fd09a; --acc-ink: #04170f; --acc-soft: #11291e; --pos: #3fd09a; --neg: #f47c6b; --warn: #f0b545;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s-prev: #5d6964;
  --tile-l: 17%; --tile-s: 30%; --tile-fg: 76%; --shadow: none; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #090c0b; --surface: #121715; --surface2: #171d1a; --ink: #ecf3ef; --ink2: #b1bfb8; --muted: #7a8983; --line: #212a26; --axis: #313b37;
  --acc: #3fd09a; --acc-ink: #04170f; --acc-soft: #11291e; --pos: #3fd09a; --neg: #f47c6b; --warn: #f0b545;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s-prev: #5d6964;
  --tile-l: 17%; --tile-s: 30%; --tile-fg: 76%; --shadow: none; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--f-ui); -webkit-tap-highlight-color: transparent; letter-spacing: -.006em; font-feature-settings: "cv11", "ss01"; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.fig { font-family: var(--f-num); font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.cents { font-size: .6em; font-weight: 500; opacity: .75; margin-left: .04em; letter-spacing: 0; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .mut { color: var(--muted); }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* shell */
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(132px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; background: var(--bg); }
.top.sh { box-shadow: 0 8px 12px -12px rgba(0, 0, 0, .25); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -.02em; white-space: nowrap; }
.brand svg { width: 28px; height: 28px; border-radius: 8px; flex: none; }
.mnav { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
.mnav button { border: 0; background: none; width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; color: var(--ink2); }
.mnav button:hover { background: var(--surface2); }
.mnav .lab { width: auto; min-width: 118px; padding: 0 6px; font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; }
.greet { margin: 4px 2px 14px; }
.greet small { display: block; color: var(--muted); font-size: 13px; }
.greet h1 { margin: 2px 0 0; font: 700 26px/1.15 var(--f-num); letter-spacing: -.035em; text-wrap: balance; }
.sync { font-size: 12px; color: var(--muted); min-height: 0; text-align: center; }
.sync:not(:empty) { margin: -6px 0 10px; }

/* view entrance */
.view > * { animation: rise .32s cubic-bezier(.2, .7, .2, 1) both; }
.view > *:nth-child(2) { animation-delay: .03s; } .view > *:nth-child(3) { animation-delay: .06s; } .view > *:nth-child(4) { animation-delay: .09s; } .view > *:nth-child(n+5) { animation-delay: .12s; }
.view.still > * { animation: none; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .view > *, .bar i, .hb i { animation: none !important; transition: none !important; } }

/* balance card */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: 20px 20px 16px; color: var(--on-forest); background: linear-gradient(155deg, var(--forest1) 10%, var(--forest2)); box-shadow: 0 16px 32px -18px rgba(11, 35, 26, .75); margin-bottom: 12px; }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 80% at 100% 0%, rgba(63, 208, 154, .22), transparent 55%); pointer-events: none; }
.hero > * { position: relative; }
.hero .lbl { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--on-forest2); }
.hero .big { font-size: 42px; line-height: 1.05; margin: 8px 0 4px; }
.hero .delta { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: rgba(255, 255, 255, .09); color: var(--on-forest); }
.hero .spark { display: block; width: calc(100% + 40px); height: 64px; margin: 10px -20px 6px; }
.hero .accs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hero .acc { border: 1px solid rgba(255, 255, 255, .09); background: rgba(255, 255, 255, .06); border-radius: 14px; padding: 9px 12px; text-align: left; color: inherit; }
.hero .acc > span { display: block; font-size: 12px; color: var(--on-forest2); }
.hero .acc b, .figs b, .kv b, .sum b { white-space: nowrap; }
.hero .acc b { font-size: 17px; }
.hero .foot { font-size: 12px; color: var(--on-forest2); margin-top: 10px; display: flex; justify-content: space-between; gap: 8px; }

/* quick actions */
.qa { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.qa button { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 4px 9px; display: grid; justify-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink2); box-shadow: var(--shadow); transition: transform .12s; }
.qa button .ico { width: 22px; height: 22px; color: var(--acc); }
.qa button:active, .card.tap:active, .row.tap:active { transform: scale(.98); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card > h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 10px; font-size: 15px; font-weight: 650; letter-spacing: -.015em; }
.card > h2 small { font-size: 12.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.card h3 { margin: 16px 0 6px; font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.lnk { border: 0; background: none; padding: 4px 0; color: var(--acc); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.empty { color: var(--muted); font-size: 14px; margin: 4px 0; }
.small { font-size: 13px; color: var(--muted); }
.note { font-size: 13px; color: var(--ink2); margin: 10px 0 0; }
.more { display: block; width: 100%; margin-top: 8px; padding: 11px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface2); font-weight: 600; font-size: 14px; color: var(--ink); }

/* figures row */
.figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.figs > div { min-width: 0; }
.figs > div > span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.figs > div > span i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.figs b { display: block; font-size: 19px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 10px; border-radius: 5px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; display: flex; margin: 12px 0 6px; }
.meter i { display: block; height: 100%; transition: width .5s cubic-bezier(.2, .7, .2, 1); }
.meter i + i { border-left: 2px solid var(--surface); }

/* rows */
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child, .dayh + .row { border-top: 0; }
.row.tap { cursor: pointer; border-radius: 12px; transition: background .12s, transform .12s; }
.row.tap:hover { background: var(--surface2); }
.tile { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; font-size: 18px; background: hsl(var(--h, 150) var(--tile-s) var(--tile-l)); color: hsl(var(--h, 150) 55% var(--tile-fg)); }
.tile .ico { width: 20px; height: 20px; }
.tile.sm { width: 32px; height: 32px; border-radius: 10px; font-size: 15px; } .tile.sm .ico { width: 17px; height: 17px; }
.tile.lg { width: 56px; height: 56px; border-radius: 18px; font-size: 26px; } .tile.lg .ico { width: 28px; height: 28px; }
.row .mid { flex: 1; min-width: 0; }
.row .mid b { display: block; font-weight: 550; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .mid span { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-weight: 600; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.row .amt small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); }
.amt.in { color: var(--pos); } .amt.mute { color: var(--ink2); }
.dayh { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 14px 0 4px; }
.dayh:first-child { padding-top: 0; }
.monh { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 5; display: flex; justify-content: space-between; align-items: baseline; padding: 10px 2px 6px; margin-top: 6px; background: var(--bg); font-weight: 650; }
.monh small { font-weight: 500; color: var(--muted); font-size: 13px; }
.chk { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--axis); background: none; display: grid; place-items: center; flex: none; color: transparent; transition: background .15s, border-color .15s; }
.chk .ico { width: 16px; height: 16px; stroke-width: 2.6; }
.chk.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); color: var(--ink2); vertical-align: 1px; }
.badge.due { background: color-mix(in srgb, var(--neg) 12%, var(--surface)); border-color: transparent; color: var(--neg); }

/* upcoming bills */
.cal { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px; scrollbar-width: none; }
.cal::-webkit-scrollbar { display: none; }
.cal > div { flex: none; width: 132px; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; background: var(--surface2); }
.cal .d { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.cal .d b { font: 600 22px var(--f-num); color: var(--ink); letter-spacing: -.03em; }
.cal .n { font-weight: 600; font-size: 14px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .v { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }

/* insight lines */
.ins { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink2); }
.ins:first-of-type { border-top: 0; }
.ins b { color: var(--ink); font-weight: 600; }

/* budgets */
.pb { padding: 8px 0; }
.pb .t { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; align-items: center; }
.pb .t > span:first-child { display: flex; align-items: center; gap: 8px; font-weight: 550; }
.pb .t .v { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; margin-top: 7px; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--good); animation: grow .6s cubic-bezier(.2, .7, .2, 1) both; transform-origin: left; }
.pb.warn .bar i { background: var(--warnc); } .pb.over .bar i { background: var(--crit); }
.pb .st { font-size: 12px; margin-top: 4px; color: var(--ink2); }
.pb.over .st { color: var(--neg); font-weight: 600; }
@keyframes grow { from { transform: scaleX(0); } }

/* search and filters */
.search { position: relative; margin-bottom: 10px; }
.search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 0 14px 0 40px; font-size: 16px; box-shadow: var(--shadow); }
.fchips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 8px; padding: 2px 16px; scrollbar-width: none; }
.fchips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 34px; padding: 0 13px; font-size: 13.5px; font-weight: 550; color: var(--ink2); }
.chip .ico { width: 16px; height: 16px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.resum { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: 2px 2px 4px; }

/* segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; border-radius: 13px; background: color-mix(in srgb, var(--ink) 6%, var(--bg)); margin-bottom: 12px; }
.seg button { border: 0; background: none; min-height: 36px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--ink2); transition: background .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

/* charts */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink2); margin: 0 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dash { height: 2px; border-radius: 0; vertical-align: 3px; background: repeating-linear-gradient(90deg, var(--s-prev) 0 4px, transparent 4px 7px) !important; }
.donutw { display: flex; align-items: center; gap: 16px; }
.donutw svg { width: 148px; height: 148px; flex: none; }
.donutw .lg { flex: 1; min-width: 0; display: grid; gap: 7px; }
.donutw .lg div { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.donutw .lg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.donutw .lg span { flex: 1; color: var(--ink2); min-width: 0; }
.donutw .lg b { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (max-width: 380px) { .donutw { flex-direction: column; align-items: stretch; } .donutw svg { margin: 0 auto; } }
.hb { display: grid; grid-template-columns: minmax(96px, 40%) 1fr; align-items: center; gap: 4px 10px; }
.hb .l { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink2); min-width: 0; }
.hb .l em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb .b { position: relative; height: 32px; }
.hb .b i, .hb .b u { position: absolute; left: 0; top: 10px; height: 12px; border-radius: 0 4px 4px 0; min-width: 3px; }
.hb .b i { animation: grow .6s cubic-bezier(.2, .7, .2, 1) both; transform-origin: left; }
.hb .b u { background: var(--surface2); border: 1px dashed var(--axis); border-left: 0; }
.hb .b span { position: absolute; top: 7px; font-size: 12.5px; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hb .tapr { cursor: pointer; }
svg.ch { width: 100%; height: auto; display: block; overflow: visible; }
svg.ch text { font: 500 10.5px var(--f-ui); fill: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: right; color: var(--muted); font-weight: 600; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 7px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr.now td { font-weight: 650; }
.tblw { overflow-x: auto; }
.rk { display: grid; grid-template-columns: 56px 1fr auto; gap: 3px 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
.rk:first-of-type { border-top: 0; }
.rk .m { font-weight: 600; font-size: 14px; }
.rk .bar { margin: 0; grid-column: 2; }
.rk .bar i { background: var(--s2); }
.rk .v { font-weight: 600; grid-row: span 2; font-variant-numeric: tabular-nums; }
.rk .w { grid-column: 2; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk.top .m { color: var(--neg); }
.sum { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 8px; }
.sum b { font-size: 24px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
.kv > div { background: var(--surface2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.kv > div > span { display: block; font-size: 12px; color: var(--muted); }
.kv b { font-size: 18px; }
#tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 500; padding: 7px 10px; border-radius: 9px; max-width: 250px; box-shadow: 0 8px 20px rgba(0, 0, 0, .22); }

/* savings */
.jar { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.jar:first-of-type { border-top: 0; }
.jar .mid { flex: 1; min-width: 0; }
.jar .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.btn2 { border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; min-height: 34px; padding: 0 12px; font-weight: 600; font-size: 13px; }

/* nav + fab */

  if (!s || !lim || !lim.images) { if (run === impRun) $('sh').innerHTML = hd('Solo en la versión de Claude') + '<p>Leer la cartera desde una captura funciona en la versión de Cash Flow que se abre en claude.ai. Aquí puedes añadir cada inversión a mano.</p>'; return; }
  const prompt = 'Esta captura es la cartera de inversiones de una app de bróker (normalmente Trade Republic) de una persona en España. Hoy es ' + today() + '.\n' +
    'Saca cada posición que se vea: nombre (corto, como sale), isin si aparece (si no, ""), parts (participaciones o null), valor (valor actual en euros), ganancia (rendimiento total en euros con signo, o null), tipo ("fondo" para ETF y fondos, "accion", "cripto" o "efectivo").\n' +
    'No incluyas el total de la cartera como posición. Números con punto decimal.\nResponde solo con JSON: {"posiciones":[{"nombre","isin","parts","valor","ganancia","tipo"}],"total":número o null}.';
  try {
    const r = await s.json(prompt, { images: files.slice(0, lim.images.maxCount || 5) });
    if (run !== impRun || !sheet.open) return;
    F.items = ((r && r.posiciones) || []).filter(p => +p.valor > 0 && p.nombre).map(p => {
      const x = { nombre: String(p.nombre).slice(0, 60), isin: String(p.isin || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), parts: +p.parts > 0 ? +p.parts : '', valor: r2(+p.valor), tipo: ['fondo', 'accion', 'cripto', 'efectivo'].indexOf(p.tipo) >= 0 ? p.tipo : 'fondo', on: true };
      if (p.ganancia != null && !isNaN(+p.ganancia)) x.aportado = r2(x.valor - +p.ganancia); return x;
    });
    drawCart();
  } catch (e) { if (run === impRun) $('sh').innerHTML = hd('No se pudo leer') + '<p>' + (e && e.code === 'not_granted' ? 'Sin permiso para usar Claude desde la app.' : e && e.code === 'rate_limited' ? 'Demasiadas peticiones seguidas. Prueba en un rato.' : 'Algo falló al leer la captura. Prueba otra vez.') + '</p>'; }
}
function drawCart() {
  let h = hd('Tu cartera');
  if (!F.items.length) { $('sh').innerHTML = h + '<p>No he encontrado posiciones. Sube la pantalla de la cartera donde se vea cada inversión con su valor.</p>'; return; }
  h += '<p class="small" style="margin-top:0">Sustituye el valor de las inversiones que ya tenías con el mismo nombre o ISIN.</p>';
  F.items.forEach((x, i) => { const old = findInv(x); h += '<div class="row"><input type="checkbox" class="cartchk" data-i="' + i + '"' + (x.on ? ' checked' : '') + ' style="width:22px;height:22px;flex:none;accent-color:var(--acc)" aria-label="Guardar ' + esc(x.nombre) + '"><div class="mid"><b>' + esc(x.nombre) + '</b><span>' + (old ? 'Antes ' + eur(old.valor) : 'Nueva') + '</span></div><div class="amt">' + eurH(x.valor) + (x.aportado != null ? '<small class="' + (x.valor >= x.aportado ? 'pos' : 'neg') + '">' + (x.valor >= x.aportado ? '+' : '−') + eur(Math.abs(x.valor - x.aportado)) + '</small>' : '') + '</div></div>'; });
  $('sh').innerHTML = h + '<button type="button" class="go" data-act="cartgo">Guardar cartera</button>';
}

// ================= Tooltip =================
const tip = $('tip'); let tipT = 0;
function showTip(t, x, y) { tip.textContent = t; tip.hidden = false; const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px'; tip.style.top = Math.max(8, y - h - 14) + 'px'; }
function hideTip() { tip.hidden = true; const xh = $('xh'); if (xh) xh.setAttribute('visibility', 'hidden'); }
function onPoint(e) {
  const t = e.target.closest && e.target.closest('[data-tip],[data-line]'); if (!t) { if (e.type !== 'pointerdown') hideTip(); return; }
  clearTimeout(tipT);
  if (t.dataset.line && lineData) {
    const svg = t.ownerSVGElement, pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const d = Math.max(0, Math.min(30, Math.round((p.x - lineData.L) / ((lineData.W - lineData.L - 6) / 30)))), xh = $('xh');
    if (xh) { xh.setAttribute('x1', lineData.X(d)); xh.setAttribute('x2', lineData.X(d)); xh.setAttribute('visibility', 'visible'); }
    showTip('Día ' + (d + 1) + ': ' + (d < lineData.a.length ? eur(lineData.a[d]) : '—') + (d < lineData.b.length && lineData.b[lineData.b.length - 1] ? ' · mes pasado ' + eur(lineData.b[d]) : ''), e.clientX, e.clientY);
  } else showTip(t.dataset.tip, e.clientX, e.clientY);
  if (e.pointerType !== 'mouse') tipT = setTimeout(hideTip, 2500);
}
document.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') onPoint(e); });
document.addEventListener('pointerdown', onPoint);
addEventListener('scroll', hideTip, { passive: true });

render();
setInterval(() => { if (!sheet.open && !askD.open && (!document.activeElement || document.activeElement.tagName !== 'INPUT')) { RES = {}; render(); } }, 60000);

// ================= Sync: this device first, the account when there is one =================
(async () => {
  try {
    const c = window.claude && await window.claude.use('db'); if (!c) { render(); return; }
    db = c; render();
    const timer = setTimeout(() => { syncErr = 'Sin conexión con tu cuenta. Lo de este dispositivo sigue guardado.'; syncTxt(); }, 10000), seen = {}, got = {};
    const cached = s => !!(s.metadata && s.metadata.fromCache);
    let pend = 0; const later = () => { cancelAnimationFrame(pend); pend = requestAnimationFrame(() => { if (!sheet.open && !askD.open) render(); }); };
    const live = () => { if (COLS.every(k => got[k]) && got.ajustes && !synced) { synced = true; syncErr = ''; clearTimeout(timer); render(); } };
    // What was written before signing in goes up once; then the account is the source of truth
    COLS.forEach(col => c.collection(col).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { const x = d.data(); if (x) m[d.id] = x; });
      if (!cached(snap)) {
        got[col] = 1;
        if (!seen[col]) {
          seen[col] = 1; const pc = PEND[col] || {};
          Object.keys(pc).forEach(k => {
            if (pc[k] === 's' && S[col][k]) { m[k] = S[col][k]; c.collection(col).doc(k).set(S[col][k]).catch(() => {}); }
            else if (pc[k] === 'd') { delete m[k]; c.collection(col).doc(k).delete().catch(() => {}); }
          });
          delete PEND[col]; try { localStorage.setItem(LS + '.pend', JSON.stringify(PEND)); } catch (e) {}
        }
        S[col] = m;
      } else { if (!snap.docs.length) return; S[col] = Object.assign({}, S[col], m); }
      changed(); persist(); live(); later();
    }, () => { clearTimeout(timer); syncErr = 'No se pudo leer tu cuenta. Recarga la página.'; syncTxt(); }));
    // Bulk loads prepared on the computer arrive as a few large documents, unpacked once into ordinary rows
    const unpacking = {};
    c.collection('importar').onSnapshot(snap => {
      if (cached(snap)) return;
      snap.docs.forEach(d => {
        const x = d.data(); if (!x || unpacking[d.id]) return; unpacking[d.id] = 1;
        (x.borrar || []).forEach(id => { delete S.movs[id]; c.collection('movs').doc(id).delete().catch(() => {}); });
        (x.movs || []).forEach(o => { if (o && o.id) { S.movs[o.id] = o; c.collection('movs').doc(o.id).set(o).catch(() => {}); } });
        (x.fijos || []).forEach(o => { if (o && o.id) { S.fijos[o.id] = o; c.collection('fijos').doc(o.id).set(o).catch(() => {}); } });
        if (x.aj) { S.aj = x.aj; c.collection('ajustes').doc('general').set(x.aj).catch(() => {}); }
        c.collection('importar').doc(d.id).delete().catch(() => {});
        changed(); persist(); render(); toast((x.movs || []).length + ' movimientos importados');
      });
    });
    c.collection('ajustes').onSnapshot(snap => {
      let d = null; snap.docs.forEach(x => { if (x.id === 'general') d = x.data(); });
      if (!cached(snap)) { got.ajustes = 1; if (d && (d.init || !S.aj.init)) S.aj = d; else if (S.aj.init) c.collection('ajustes').doc('general').set(S.aj).catch(() => {}); }
      else if (d && d.init) S.aj = d;
      changed(); persist(); live(); later();
    });
  } catch (e) { render(); }
})();
</script>
