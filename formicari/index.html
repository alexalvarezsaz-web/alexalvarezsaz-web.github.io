<style>
/* Dark soil around, sand-coloured cards, ant-orange accents, gold pips for LV.MAX. Each world only changes the cube and its sky. */
:root{--ink:#2a1a10;--sand:#f6e7c8;--sand2:#e3cf9f;--acc:#e8762b;--gold:#f2c14e;--soil:#1f130b;--glass:rgba(31,19,11,.88);box-sizing:border-box;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--soil);color:var(--sand);font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#3a2415,#1f130b 75%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:6px;padding:8px 12px 4px}
#logo{flex:1;text-align:left;background:none;border:0;padding:0;font-size:20px;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#tp{display:flex;gap:3px;align-items:center}
#tp i{width:9px;height:9px;border-radius:50%;background:rgba(246,231,200,.18);transition:background .3s,transform .3s}
#tp i.d{background:var(--acc)}
#tp i.c{background:var(--sand);transform:scale(1.35)}
.ib{background:rgba(246,231,200,.12);border:0;border-radius:12px;font-size:18px;width:38px;height:34px;line-height:1}
#rule{margin:2px 12px 0;padding:4px 10px;border-radius:99px;background:rgba(242,193,78,.16);color:var(--gold);font-size:13px;font-weight:600;text-align:center}
#rule[hidden]{display:none}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#meter{position:absolute;left:12px;top:8px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:var(--glass);border:2px solid rgba(246,231,200,.2);border-radius:99px;padding:3px 9px 3px 7px}
#meter .bar{width:54px;height:7px;border-radius:4px;background:rgba(246,231,200,.18);overflow:hidden}
#meter .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));width:0;transition:width .6s}
#cap,#pick{position:absolute;left:12px;right:12px;bottom:6px;background:var(--glass);border:2px solid rgba(246,231,200,.25);border-radius:16px}
#cap{min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;padding:7px 12px;font-size:15px;font-weight:500;line-height:1.25}
#cap[hidden],#pick[hidden]{display:none}
#cap.pop,#pick.pop{animation:pop .3s ease}
@keyframes pop{from{transform:translateY(8px) scale(.97);opacity:.3}to{transform:none;opacity:1}}
#pick{display:flex;align-items:center;gap:10px;padding:8px 10px}
#pick .pe{font-size:34px;line-height:1}
#pick .pt{flex:1;min-width:0;text-align:left}
#pick b{font-size:16px}
#pick small{display:block;color:var(--gold);font-weight:600;font-size:12px}
#pick p{margin:1px 0 0;font-size:12.5px;line-height:1.25;opacity:.85}
#pick .btn{padding:8px 14px;font-size:15px;flex:none}
#menu{padding:8px 10px 12px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.it{position:relative;border:3px solid var(--ink);background:var(--sand);color:var(--ink);border-radius:15px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;padding:5px 0 5px;transition:transform .12s,box-shadow .12s,opacity .2s}
.it .e{font-size:25px;line-height:1.15}
.it .n{font-size:10.5px;font-weight:600;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:2px;margin-top:4px;height:6px}
.pips i{width:7px;height:6px;border-radius:3px;background:rgba(42,26,16,.18)}
.pips i.on{background:var(--acc)}
.pips.max i{background:var(--gold);box-shadow:0 0 0 1px var(--ink) inset}
.it.sel{background:#fff6dd;transform:translateY(-3px);box-shadow:0 7px 0 var(--ink),0 0 0 3px var(--gold)}
.it:not(.used):active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.it.used{background:var(--sand2);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.it.used .e{opacity:.8}
.it.lock{opacity:.4}
.it.lock::after{content:'🔒';position:absolute;right:2px;top:0;font-size:11px}
#app.busy .it:not(.used){pointer-events:none;opacity:.55}
.sheet{padding:8px 14px 14px;text-align:center;max-height:54%;overflow:auto}
.endc{display:flex;align-items:center;gap:10px;text-align:left;background:rgba(242,193,78,.12);border:2px solid rgba(242,193,78,.35);border-radius:16px;padding:7px 10px;margin:0 0 6px}
.endc .ee{font-size:34px;line-height:1}
.endc b{font-size:16px;display:block}
.endc small{font-size:12.5px;opacity:.85;line-height:1.25;display:block}
.endc .nw{display:inline-block;background:var(--gold);color:var(--ink);font-size:10px;font-weight:700;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.sheet h2{margin:0;font-size:22px}
.sheet p{margin:1px 0 6px;opacity:.85;font-size:13.5px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:4px 0 6px}
.chip{background:rgba(246,231,200,.1);border-radius:12px;padding:3px 0 4px;font-size:19px;line-height:1.2;display:flex;flex-direction:column;align-items:center}
.chip .pips{margin-top:3px}
.chip .pips i{background:rgba(246,231,200,.2)}
.chip .pips i.on{background:var(--acc)}
.chip .pips.max i{background:var(--gold);box-shadow:none}
.seq{font-size:16px;letter-spacing:2px;margin:0 0 6px;opacity:.9}
#hint{min-height:18px;font-size:13px;color:var(--gold);margin:0 0 6px;line-height:1.3}
.row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.btn{border:3px solid var(--ink);background:var(--acc);color:#fff;font-weight:700;font-size:16px;padding:8px 16px;border-radius:16px;box-shadow:0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(42,26,16,.35)}
.btn.alt{background:var(--sand);color:var(--ink);text-shadow:none}
.btn.gold{background:var(--gold);color:var(--ink);text-shadow:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.5}
.ov{position:absolute;inset:0;z-index:5;background:rgba(20,11,5,.92);display:flex;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));text-align:center;overflow:auto}
.ov>:first-child{margin-top:auto}
.ov>:last-child{margin-bottom:auto}
.ov[hidden]{display:none}
.ov h1{font-size:40px;margin:2px 0 0;letter-spacing:1px}
.ov .sub{opacity:.85;margin:0 0 10px;font-size:14.5px;max-width:340px}
.big{font-size:46px;line-height:1}
.stat{font-size:12.5px;opacity:.7;margin-top:10px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:340px;margin:0 0 12px}
.wc{border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:9px 6px 8px;color:#fff;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.wc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.wc .we{font-size:32px;line-height:1.1}
.wc b{display:block;font-size:15px}
.wc small{display:block;font-size:11.5px;opacity:.9;line-height:1.2}
.wc em{display:block;font-style:normal;font-size:11.5px;font-weight:700;margin-top:3px;color:var(--gold)}
.menu3{display:flex;flex-direction:column;gap:9px;width:100%;max-width:340px}
.menu3 .btn{width:100%}
.menu3 small{display:block;font-size:12px;font-weight:500;opacity:.85}
#hub{justify-content:flex-start;padding-top:calc(12px + env(safe-area-inset-top))}
#hub>:first-child{margin-top:0}
.tabs{display:flex;gap:5px;width:100%;max-width:420px;margin:0 0 6px}
.tabs button{flex:1;border:0;background:rgba(246,231,200,.1);border-radius:12px;padding:7px 0;font-weight:600;font-size:13px}
.tabs button.on{background:var(--sand);color:var(--ink)}
.wchips{display:flex;gap:5px;width:100%;max-width:420px;margin:0 0 6px}
.wchips button{flex:1;border:2px solid transparent;background:rgba(246,231,200,.08);border-radius:12px;padding:4px 0;font-size:20px;line-height:1.2}
.wchips button.on{border-color:var(--gold);background:rgba(242,193,78,.16)}
#hubc{width:100%;max-width:420px;text-align:left;flex:1;min-height:0;overflow:auto;padding-bottom:8px}
.dg{margin:12px 0 2px;font-weight:600;font-size:15px}
.dg small{display:block;font-weight:400;font-size:12px;opacity:.65}
.de{display:flex;gap:8px;font-size:13.5px;line-height:1.3;margin:3px 0}
.de b{flex:none;width:34px;color:var(--gold);font-weight:600}
.de.no{opacity:.4}
.en{display:flex;gap:10px;align-items:center;margin:6px 0;padding:7px 10px;background:rgba(246,231,200,.08);border-radius:12px}
.en.no{opacity:.45}
.en .ee{font-size:26px}
.en b{display:block;font-size:14.5px}
.en small{font-size:12px;opacity:.8}
.tn{margin:10px 0 2px;font-weight:600;color:var(--gold);font-size:13.5px}
.tl{font-size:13px;margin:2px 0 2px 8px;line-height:1.3}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(246,231,200,.12);font-size:14px}
.kv b{font-weight:600}
.tg{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:var(--sand);color:var(--ink);font-weight:600;font-size:14px;padding:7px 14px;border-radius:99px;z-index:9;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#cap.pop,#pick.pop{animation:none}}
</style></head><body>
<div id="app" class="busy">
  <header>
    <button id="logo" aria-label="Mundos">Formicari</button>
    <div id="tp" role="img" aria-label="Turno"></div>
    <button class="ib" id="bsnd" aria-label="Sonido">🔊</button>
    <button class="ib" id="bhub" aria-label="Diario y más">📖</button>
  </header>
  <div id="rule" hidden></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="meter"><span>⭐</span><span id="mt">0/30</span><div class="bar"><b id="mb"></b></div></div>
    <div id="cap">Elige la primera pieza.</div>
    <div id="pick" hidden></div>
  </div>
  <section id="menu"><div id="grid"></div></section>
  <section id="end" class="sheet" hidden>
    <div class="endc" id="ef"></div>
    <h2 id="et"></h2><p id="es"></p>
    <div class="chips" id="ec"></div>
    <div class="seq" id="eq"></div>
    <div id="hint"></div>
    <div class="row"><button class="btn" id="again">Otra vez</button><button class="btn alt" id="bh">💡 Pista</button><button class="btn alt" id="bshare">📋 Copiar</button><button class="btn alt" id="bcr">📜 Crónica</button><button class="btn gold" id="bworlds">🗺️ Mundos</button></div>
  </section>
  <div class="ov" id="intro">
    <div class="big">🐜</div>
    <h1>Formicari</h1>
    <p class="sub">Diez piezas, diez turnos. Todo crece solo, pero solo si el momento es el bueno. Toca una pieza, mira su ficha y pulsa Colocar. Sin marcha atrás.</p>
    <div class="wgrid" id="wgrid"></div>
    <div class="menu3">
      <button class="btn gold" id="goD">Reto del día<small id="dtxt"></small></button>
      <button class="btn alt" id="bd3">📖 Diario y finales</button>
    </div>
    <div class="stat" id="stat"></div>
  </div>
  <div class="ov" id="hub" hidden>
    <div class="tabs" id="tabs"></div>
    <div class="wchips" id="wchips"></div>
    <div id="hubc"></div>
    <button class="btn" id="dclose">Cerrar</button>
  </div>
  <div id="toast"></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const DBG=Q.get('seq');

// =====================================================================
// WORLDS. Each one: 10 pieces, a rule per level step, endings, daily options and a look.
// RULE[piece][lv-1] = [condition to go lv -> lv+1 (s = levels, 0 = not here yet), what happens, what it needs]
// =====================================================================
const eW=(id,e,t,d,pos,k)=>({id,e,t,d,p:(o,l,n)=>n==10&&(pos=='first'?o[0]:o[9])==k});
const eF=(id,e,t,d,pos,k)=>({id,e,t,d,p:o=>(pos=='first'?o[0]:o[9])==k});
const eDone=(t,d)=>({id:'completo',e:'🏆',t,d,p:(o,l,n)=>n==10});
const eTail=[{id:'casi',e:'🤏',t:'Casi, casi',d:'Nueve de diez en LV.MAX.',p:(o,l,n)=>n==9},{id:'nomada',e:'🧳',t:'Primer intento',d:'Tres piezas o menos en LV.MAX.',p:(o,l,n)=>n<=3}];

const ANT={id:'ant',e:'🐜',n:'Nido de hormigas',sub:'Un formicario de Messor barbarus',col:'#9a5a2a',keys:'ORASLHPGDU',scene:'ant',
EL:{
 O:{n:'Obreras',e:'🐜',max:4,d:'Obreras de Messor barbarus: cavan, acarrean y mantienen el nido.',l:['Exploradoras','Cavadoras','Acarreadoras','Plantilla completa']},
 R:{n:'Reina',e:'👑',max:4,d:'La fundadora. Sin ella no hay camadas.',l:['Fundadora','Puesta','Primera camada','Vuelo nupcial']},
 A:{n:'Agua',e:'💧',max:3,d:'Gota a gota, el nido bebe. Pero el agua también estorba.',l:['Charca','Canal','Cisterna']},
 S:{n:'Semillas',e:'🌾',max:4,d:'El pan de las Messor: son granívoras.',l:['Semillas','Brotes','Espigas','Granero lleno']},
 L:{n:'Sol',e:'☀️',max:2,d:'Calor y luz. No a todos les gusta.',l:['Amanecer','Arcoíris']},
 H:{n:'Hongo',e:'🍄',max:3,d:'Crece en la sombra y la humedad.',l:['Esporas','Micelio','Jardín de hongos']},
 P:{n:'Piedra',e:'🪨',max:2,d:'Una roca pesada. Da sombra, pero también tapona.',l:['Roca','Entrada sellada']},
 G:{n:'Soldadas',e:'🛡️',max:3,d:'Cabezas enormes y mandíbulas afiladas. Defienden la entrada.',l:['Larva mayor','Soldadas','Guardia']},
 D:{n:'Lagarto',e:'🦎',max:3,d:'Un intruso con hambre. Le atrae el grano.',l:['Intruso','Merodeador','Centinela']},
 U:{n:'Pulgones',e:'🐛',max:2,d:'El ganado de las hormigas: dan miel a cambio de protección.',l:['Pulgones','Miel']}},
ARR:{
 O:'Llegan las primeras obreras, curioseando.',R:'Una reina Messor fundadora se instala.',A:'Cae una gota, otra… y se forma una charca.',
 S:'Unas semillas de cereal ruedan por la tierra.',L:'Sale el sol y el nido se despierta.',H:'Esporas de hongo flotan en el aire.',
 P:'Una piedra rueda hasta el borde del nido.',G:'Una larva de cabeza enorme: futura soldada.',D:'Un lagarto asoma entre las matas.',U:'Llegan unos pulgones diminutos.'},
RULE:{
 O:[[s=>true,'Las obreras excavan las primeras galerías.','Nada, solo tiempo.'],
    [s=>s.S>=2&&s.A>=1&&s.G==0,'Con la tierra húmeda y semillas que acarrear, abren galerías profundas.','Semillas ya brotadas, agua que ablande la tierra, y que todavía no haya soldadas.'],
    [s=>s.R>=2,'Las crías de la reina engrosan la plantilla de obreras.','Que la reina ya haya puesto huevos.']],
 R:[[s=>s.O>=2&&s.A>=1,'La reina se instala en una cámara húmeda y pone los primeros huevos.','Galerías excavadas y agua cerca.'],
    [s=>s.L>=1&&s.G==0,'El calor del sol hace eclosionar la primera camada, antes de que nazcan soldadas.','Calor del sol, y que todavía no haya soldadas.'],
    [s=>s.S>=3&&s.A>=1,'Vuelo nupcial: princesas y machos alzan el vuelo.','Espigas maduras (Semillas LV3) y agua.']],
 A:[[s=>s.O>=2&&s.H==0,'Un canal lleva el agua hasta las galerías, antes de que nada lo estorbe.','Galerías por donde canalizarla, y que el hongo todavía no haya llegado.'],
    [s=>s.L>=1&&s.H>=1,'El sol evapora y el hongo recoge el rocío en una cisterna.','Sol que evapore y un hongo que recoja el rocío.']],
 S:[[s=>s.A>=1&&s.U==0,'Las semillas brotan, antes de que nadie las chupe.','Agua en el suelo, y que los pulgones aún no hayan llegado.'],
    [s=>s.L>=1&&s.A>=2,'Espigas doradas bajo el sol y con el canal regando.','Sol y agua en canal (Agua LV2).'],
    [s=>s.O>=3,'Las obreras llenan el granero hasta el techo.','Obreras LV3 que acarreen el grano.']],
 L:[[s=>s.A>=2,'El sol evapora la charca y dibuja un arcoíris.','Un canal de agua (Agua LV2) que evaporar.']],
 H:[[s=>s.A>=1&&s.L==0,'En la penumbra húmeda brota el hongo.','Humedad y penumbra: que el sol todavía no haya salido.'],
    [s=>s.O>=3&&s.P>=1&&s.A>=2,'Las obreras abonan el hongo a la sombra de la piedra.','Obreras LV3, una piedra que dé sombra y agua en canal (Agua LV2).']],
 P:[[s=>s.O>=2,'Las obreras empujan la piedra y sellan la entrada.','Obreras que la empujen.']],
 G:[[s=>s.R>=2,'Nacen las soldadas, de cabeza grande y mandíbulas afiladas.','Huevos de la reina (Reina LV2).'],
    [s=>s.D>=2,'Las soldadas salen a plantar cara al intruso.','Un lagarto ya merodeando (Lagarto LV2).']],
 D:[[s=>s.S>=1&&s.P<2&&s.L>=1,'Con el sol alto, el lagarto husmea el granero.','Olor a grano, sol que lo saque de su escondite, y la entrada aún sin sellar con la piedra.'],
    [s=>s.G>=2,'Acorralado por las soldadas, el lagarto se queda de centinela.','Soldadas que lo acorralen.']],
 U:[[s=>s.S>=3&&s.O>=3,'Los pulgones trepan a las espigas y las obreras los ordeñan: gotas de miel.','Espigas maduras (Semillas LV3) y obreras LV3 que los ordeñen.']]},
ENDS:[
 {id:'amanecer',e:'🌅',t:'Amanecer en el nido',d:'Todo en LV.MAX y el sol sale casi al final.',p:(o,l,n)=>n==10&&o.indexOf('L')>=7},
 eW('madrugadora','👑','Reina madrugadora','Todo en LV.MAX empezando por la reina.','first','R'),
 eW('domador','🦎','Domador de lagartos','Todo en LV.MAX con el lagarto como primera pieza.','first','D'),
 eW('ultima','🪨','La última piedra','Todo en LV.MAX y la piedra cierra el nido al final.','last','P'),
 eW('miel','🍯','Nido de miel','Todo en LV.MAX y los pulgones llegan los últimos.','last','U'),
 eDone('Formicari completo','Las diez piezas en LV.MAX.'),
 eF('huerfano','🥚','Nido huérfano','La reina llegó la última, tarde para todo.','last','R'),
 eF('sequia','🏜️','Sequía','El agua llegó en el último turno.','last','A'),
 eF('noche','🌙','Noche larga','El sol salió en el último turno.','last','L'),
 eF('plaga','🐛','Plaga de pulgones','Los pulgones fueron lo primero que llegó.','first','U'),
 eF('solazo','🥵','Sol de justicia','Empezar con el sol lo reseca todo.','first','L'),
 eF('sellado','🧱','Nido sellado','La piedra fue la primera pieza.','first','P'),
 eF('invasion','😈','Invasión','El lagarto llegó antes que nadie y no ganaste.','first','D'),
 ...eTail],
DAILY:[{first:'O'},{last:'P'},{first:'R'},{last:'U'},{first:'A'},{first:'S'},{first:'D'}]};

const BOSC={id:'bosc',e:'🍄',n:'Bosc de bolets',sub:'Una ladera húmeda en otoño',col:'#3f7a3a',keys:'LPMBNSCRAZ',scene:'gen',

// Placing a piece sets it to LV1, then every piece may rise ONE level this turn if its condition holds.
// Pieces are checked in KEYS order and repeated until nothing changes, so reactions chain within a turn.
function step(lv,id){
  const ev=[{k:id,to:1}];lv[id]=1;
  const done={};let ch=true;
  while(ch){ch=false;for(const k of KEYS){const L=lv[k];
    if(L>0&&L<EL[k].max&&!done[k]&&RULE[k][L-1][0](lv)){lv[k]=L+1;done[k]=1;ch=true;ev.push({k,to:L+1});}}}
  return ev;
}

function along(P,u){let L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  const d=u*L[L.length-1];let i=1;while(i<L.length-1&&L[i]<d)i++;const f=(d-L[i-1])/((L[i]-L[i-1])||1);
  return[lerp(P[i-1][0],P[i][0],f),lerp(P[i-1][1],P[i][1],f),P[i][0]-P[i-1][0]]}
// Vector ant in profile. kind: w worker, s soldier, q queen, f flying (winged). s = scale (1 = ~20px long).
function ant(x,y,s,dir,ph,kind='w'){
  c.save();c.translate(x,y);c.scale(dir*s,s);
  const q=kind=='q',so=kind=='s',col=so?'#7a2d17':'#2a1912',hl=so?'#b0502d':'#55372a';
  c.strokeStyle=col;c.lineWidth=1.3;c.lineCap='round';c.lineJoin='round';
  if(kind!='f')for(let i=0;i<3;i++){const bx=-3+i*3.4,a=Math.sin(ph+i*2.2)*2.2;for(const sg of[1,-1]){c.beginPath();c.moveTo(bx,1.2);c.lineTo(bx+sg*a*.6-1,5);c.lineTo(bx+sg*a-1.5,8);c.stroke()}}
  c.fillStyle=col;
  c.beginPath();c.ellipse(q?-10:-7.5,.4,q?8:5.4,q?5.5:4.1,0,0,7);c.fill();
  c.fillStyle=hl;c.globalAlpha*=.7;c.beginPath();c.ellipse(q?-11:-8.2,-1.4,q?4:2.6,1.3,0,0,7);c.fill();c.globalAlpha=1;
  c.fillStyle=col;c.beginPath();c.ellipse(-1,-.4,3.4,2.7,0,0,7);c.fill();
  c.beginPath();c.ellipse(5.4,.2,so?3.9:3,so?3.3:2.6,0,0,7);c.fill();
  c.beginPath();c.moveTo(7,-1);c.lineTo(10.5,-4.5);c.lineTo(13.2,-3.6);c.stroke();
  if(so){c.beginPath();c.moveTo(8.6,1.6);c.lineTo(11.2,3.4);c.moveTo(8.6,.2);c.lineTo(11.6,1);c.stroke()}
  c.fillStyle='#fff';c.beginPath();c.arc(6.5,-.7,.7,0,7);c.fill();
  if(kind=='f'){c.fillStyle='rgba(235,245,255,.7)';const fl=Math.sin(ph*2)*.25;
    c.beginPath();c.ellipse(-3,-5,8,2.6,-.5+fl,0,7);c.fill();c.beginPath();c.ellipse(-4,-4,7,2.2,-.9+fl,0,7);c.fill()}
  c.restore();
}
function aphid(x,y,s=1,fl=1){c.save();c.translate(x,y);c.scale(fl*s,s);c.fillStyle='#8fdc5a';c.strokeStyle='#3f7a2c';c.lineWidth=.8;
  c.beginPath();c.ellipse(0,0,4.4,3.2,0,0,7);c.fill();c.stroke();c.beginPath();c.moveTo(3,-1);c.lineTo(5.5,-3.5);c.stroke();
  c.beginPath();c.moveTo(-1,2.6);c.lineTo(-2,4.6);c.moveTo(1.4,2.6);c.lineTo(2,4.6);c.stroke();c.fillStyle='#1a2a10';c.beginPath();c.arc(2.6,-.6,.6,0,7);c.fill();c.restore()}
function flower(x,y,col,t,i){c.save();c.translate(x,y);c.strokeStyle='#3f8a35';c.lineWidth=1.4;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(Math.sin(t+i)*1.5,-5,0,-10);c.stroke();
  c.fillStyle=col;for(let k=0;k<5;k++){const a=k*1.2566;c.beginPath();c.arc(Math.cos(a)*2.6,-10+Math.sin(a)*2.6,2,0,7);c.fill()}c.fillStyle='#ffe27a';c.beginPath();c.arc(0,-10,1.6,0,7);c.fill();c.restore()}
function walker(P,t,sp,ph,s,al=1,kind='w'){const x=t*sp+ph,u=.5-.5*Math.cos(x*Math.PI*2),fw=Math.sin(x*Math.PI*2)>=0,q=along(P,u);
  c.save();c.globalAlpha*=al;ant(q[0],q[1]+Math.sin(t*14+ph*9)*.6,s,(q[2]<0)===fw?-1:1,t*12+ph*7,kind);c.restore()}
function tunnel(f,pts,al,lw=9){if(al<=0)return[];const P=pts.map(p=>f(p[0],p[1]));c.save();c.globalAlpha=al;c.beginPath();
  P.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.lineCap='round';c.lineJoin='round';
  c.lineWidth=lw;c.strokeStyle='#1a0e07';c.stroke();c.lineWidth=lw-3;c.strokeStyle='#33200f';c.stroke();c.restore();return P}

  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.4,life:life*(.6+Math.random()*.6),max:life,col:cols[i%cols.length],sz:size*(.6+Math.random()),g})}}
const ANTANCH={O:T(.25,.93),R:FL(.6,.5),A:T(.3,.5),S:T(.66,.28),L:[305,52],H:FR(.5,.8),P:T(.55,.75),G:T(.2,.8),D:T(.8,.3),U:T(.65,.25)};
function anchor(k){if(W.id=='ant')return ANTANCH[k];const e=EL[k].sp[0],f=e[0];return f=='T'?T(e[1],e[2]):f=='L'?FL(e[1],e[2]):f=='R'?FR(e[1],e[2]):[e[1],e[2]]}
function spawnFx(k,to){
  const a=anchor(k),mx=to==EL[k].max;

  burst(a[0],a[1]-6,mx?26:12,mx?['#f2c14e','#fff3b0','#ffffff']:['#ffffff','#ffd9a0'],mx?90:60);

// ---------- scenes ----------
function sceneGen(now,t,dt){
  const V=W.vis,lv=G.shown,calm=save.calm;
  const d=V.sky.k?clamp(av[V.sky.k]):1;
  const sky=c.createLinearGradient(0,0,0,HH);sky.addColorStop(0,mix(V.sky.n[0],V.sky.d[0],d));sky.addColorStop(1,mix(V.sky.n[1],V.sky.d[1],d));
  c.fillStyle=sky;c.fillRect(0,0,CW,HH);
  V.bg&&V.bg(c,t,d);
  c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(CX,392,150,15,0,0,7);c.fill();
  c.save();if(!calm)c.translate(0,Math.sin(t*1.1)*1.6);
  // faces
  [[faceL,V.fl,FL],[faceR,V.fr,FR]].forEach(([f,col,fn])=>{poly(f());c.fillStyle=col;c.fill();c.save();poly(f());c.clip();
    c.strokeStyle=V.tex=='tile'?'rgba(255,255,255,.55)':'rgba(0,0,0,.13)';c.lineWidth=1;
    if(V.tex=='rock'){for(let j=1;j<7;j++){c.beginPath();c.moveTo(...fn(0,j/7));for(let i=1;i<=6;i++)c.lineTo(...fn(i/6,j/7+Math.sin(i*2+j*3)*.025));c.stroke()}}
    else{for(let i=1;i<6;i++){c.beginPath();c.moveTo(...fn(i/6,0));c.lineTo(...fn(i/6,1));c.stroke()}for(let j=1;j<5;j++){c.beginPath();c.moveTo(...fn(0,j/5));c.lineTo(...fn(1,j/5));c.stroke()}}
    if(V.tex!='tile')SPECK.forEach(s=>{const p=fn(s[0],s[1]);c.fillStyle=s[3]>.5?'rgba(0,0,0,.18)':'rgba(255,255,255,.14)';c.beginPath();c.ellipse(p[0],p[1],s[2]*1.4,s[2],0,0,7);c.fill()});
    const sh=c.createLinearGradient(0,Y0+h,0,Y0+2*h+Hs);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.2)');c.fillStyle=sh;c.fillRect(0,0,CW,HH);c.restore()});
  const tm=V.top.k?clamp(av[V.top.k]/V.top.div)*(V.top.amt||1):0;
  poly(faceT());c.fillStyle=mix(V.top.a,V.top.b,tm);c.fill();c.save();poly(faceT());c.clip();
  if(V.tex=='tile'){c.strokeStyle='rgba(120,150,175,.35)';for(let i=1;i<6;i++){c.beginPath();c.moveTo(...T(i/6,0));c.lineTo(...T(i/6,1));c.stroke();c.beginPath();c.moveTo(...T(0,i/6));c.lineTo(...T(1,i/6));c.stroke()}}
  else SPECK.forEach(s=>{const p=T(s[0],s[1]);c.fillStyle=tm>.3&&V.tex=='soil'&&s[3]>.55?'rgba(30,90,30,.35)':'rgba(0,0,0,.12)';c.beginPath();c.ellipse(p[0],p[1],s[2]*1.5,s[2],0,0,7);c.fill()});
  c.restore();
  c.lineJoin='round';c.lineWidth=3;c.strokeStyle=V.tex=='tile'?'#3a4a58':'#2a1a10';poly(faceT());c.stroke();poly(faceL());c.stroke();poly(faceR());c.stroke();
  // sprites: sky ones first, then side faces, then the top (depth-sorted)
  const list=[];
  for(const k of KEYS){const l=lv[k];if(!l)continue;for(const e of EL[k].sp){if(l<e[5]||l>e[6])continue;
    const p=e[0]=='T'?T(e[1],e[2]):e[0]=='L'?FL(e[1],e[2]):e[0]=='R'?FR(e[1],e[2]):[e[1],e[2]];
    list.push([(e[0]=='X'?-2000:e[0]=='T'?0:-1000)+p[1],k,e,p,l])}}
  list.sort((a,b)=>a[0]-b[0]);
  for(const [,k,e,p,l] of list){c.save();c.globalAlpha=clamp(av[k]);const s=e[4]*pop(k,now),g=e[3];
    if(g[0]=='@')GL[g.slice(1)](p[0],p[1],s,l,t,k);else em(g,p[0],p[1]-e[4]*.3+Math.sin(t*2+p[0]*.1)*1.2,s);c.restore()}
  // particles + level-up pops
  parts=parts.filter(p=>p.life>0);parts.forEach(p=>{p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;c.globalAlpha=clamp(p.life/p.max);c.fillStyle=p.col;
    if(p.rot!==undefined){c.save();c.translate(p.x,p.y);c.rotate(p.rot+=dt*6);c.fillRect(-p.sz,-p.sz*.5,p.sz*2,p.sz);c.restore()}else{c.beginPath();c.arc(p.x,p.y,p.sz,0,7);c.fill()}});
  fxs=fxs.filter(f=>now-f.t0<1500);
  fxs.forEach(f=>{const u=(now-f.t0)/1500;c.globalAlpha=1-u*u;
    c.strokeStyle=f.max?'#f2c14e':'#fff';c.lineWidth=3;c.beginPath();c.arc(f.x,f.y-6,10+u*34,0,7);c.stroke();
    c.font='700 15px Fredoka,system-ui,sans-serif';c.textAlign='center';c.lineWidth=4;c.strokeStyle='#2a1a10';
    const s=f.max?'¡MAX!':f.to==1?'¡Nuevo!':'LV'+f.to;c.strokeText(s,f.x,f.y-28-u*22);c.fillStyle=f.max?'#f2c14e':'#fff';c.fillText(s,f.x,f.y-28-u*22)});
  c.globalAlpha=1;c.restore();
  // weather
  if(!calm)(V.wx||[]).forEach(wx=>{const l=lv[wx.k],n=wx.n[l]||0;if(!n)return;
    if(wx.t=='rain'){c.strokeStyle='rgba(170,215,255,.7)';c.lineWidth=1.2;RAIN.slice(0,n).forEach(r=>{const y=(r[1]+t*260*r[2])%(HH+20)-10,x=r[0]-y*.15;c.beginPath();c.moveTo(x,y);c.lineTo(x-1.5,y+9);c.stroke()})}
    else{c.fillStyle='rgba(255,255,255,.9)';SNOW.slice(0,n).forEach(r=>{const y=(r[1]+t*40*r[2])%(HH+10),x=r[0]+Math.sin(t*.8+r[3])*14;c.beginPath();c.arc(x,y,1.5+r[2]*.8,0,7);c.fill()})}});
}
