<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crece Cubo</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crece Cubo">
<meta name="theme-color" content="#2b2438">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Paper-toy look: cream paper, thick ink outlines, offset ink shadows. The game screen takes its sky from the world's sky. */
@property --sky1{syntax:'<color>';inherits:true;initial-value:#bfe8ff}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#eaf9d2}
:root{--ink:#2b2438;--paper:#fff4dc;--accent:#ff7a59;--accent2:#ffcf4a;--sky1:#bfe8ff;--sky2:#eaf9d2;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#2b2438;color:var(--ink);font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{background:radial-gradient(circle at 50% 30%,#4a3d63,#241d33 70%)}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:var(--paper)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex;animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
svg text{font-family:'Fredoka',system-ui,sans-serif}

.btn{border:3px solid var(--ink);background:var(--accent);color:#fff;font-weight:700;font-size:22px;padding:13px 26px;border-radius:20px;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(43,36,56,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink);text-shadow:none}
.round{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.round:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}

/* menu */
#menu{background:linear-gradient(#ffe9bd,#ffb98f);align-items:center;justify-content:space-between;padding-bottom:max(18px,env(safe-area-inset-bottom))}
#menu .bar{align-self:stretch;display:flex;justify-content:flex-end;padding:12px 14px}
#menu h1{margin:0;text-align:center;font-size:clamp(46px,15vw,76px);line-height:.9;font-weight:700;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);letter-spacing:1px}
#menu h1 span{display:block;color:var(--accent2)}
#menu .sub{margin:14px 0 0;text-align:center;font-size:18px;font-weight:500;opacity:.8}
#menuCube{width:min(86%,360px);flex:1;min-height:0;margin:0 auto}
#menu .col{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;padding:0 28px}
#menu .col .btn{width:100%;max-width:340px}
.fin{position:relative;overflow:hidden}
.fin i{position:absolute;left:0;top:0;bottom:0;background:var(--accent2);width:0;transition:width .6s;z-index:0}
.fin b{position:relative;z-index:1;font-weight:700}
.menu-tip{font-size:15px;opacity:.7;text-align:center;max-width:320px;margin:0}

/* game */
#game{background:linear-gradient(var(--sky1),var(--sky2));transition:--sky1 .9s,--sky2 .9s}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 4px}
.slots{flex:1;display:flex;gap:6px;justify-content:center}
.slot{width:38px;height:38px;border-radius:12px;border:3px dashed rgba(43,36,56,.4);display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.35)}
.slot.f{border:3px solid var(--ink);background:#fff;animation:pop2 .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop2{from{transform:scale(.2)}to{transform:scale(1)}}
#stage{flex:1;position:relative;min-height:0}
#sv{width:100%;height:100%;display:block;overflow:visible}
#bubble{position:absolute;left:50%;top:1%;transform:translateX(-50%) scale(0);max-width:88%;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 16px;font-weight:600;font-size:16px;line-height:1.25;text-align:center;box-shadow:0 4px 0 var(--ink);transform-origin:50% 100%;pointer-events:none;z-index:3}
#bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:0 0 5px 0}
#bubble.show{animation:bub 3s ease both}
@keyframes bub{0%{transform:translateX(-50%) scale(0)}8%{transform:translateX(-50%) scale(1.08)}13%{transform:translateX(-50%) scale(1)}88%{transform:translateX(-50%) scale(1)}100%{transform:translateX(-50%) scale(0)}}
#hint{text-align:center;font-weight:600;font-size:15px;opacity:.75;padding:0 0 6px;min-height:22px}
#tray{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;padding:6px 12px 14px}
.it{width:calc((100% - 36px)/5);max-width:92px;aspect-ratio:1/1.05;border-radius:20px;border:3px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;transition:transform .08s,box-shadow .08s,opacity .3s,filter .3s}
.it .e{font-size:clamp(24px,8vw,36px);line-height:1.1}
.it small{font-size:12px;font-weight:600;line-height:1}
.it:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.it.used{opacity:.28;filter:grayscale(1);pointer-events:none;transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.it.secret{background:linear-gradient(135deg,#3f3169,#6b3fa8);color:#fff;animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 5px 0 var(--ink),0 0 18px 4px rgba(150,100,255,.7)}}
.fly{position:fixed;left:0;top:0;font-size:36px;z-index:60;pointer-events:none;margin:-22px 0 0 -22px;will-change:transform}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
#flash.on{animation:flash 1s ease both}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
/* menu beside the world on wide landscape screens */
@media (orientation:landscape) and (min-width:720px){
  #app{max-width:1000px}
  #game.on{display:grid;grid-template-columns:1fr 300px;grid-template-rows:auto 1fr}
  #game .top{grid-column:1;grid-row:1}
  #stage{grid-column:1;grid-row:2}
  #hint{grid-column:2;grid-row:1;align-self:center;padding:10px 12px 0}
  #tray{grid-column:2;grid-row:2;align-content:center;padding:12px}
  .it{width:calc((100% - 18px)/3);max-width:none}
}

/* ending */
#ending{background:var(--paper);overflow-y:auto}
.end-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 18px 22px;margin:auto 0}
.scene{position:relative;width:min(100%,46vh,420px);aspect-ratio:1;border-radius:28px;border:4px solid var(--ink);overflow:hidden;box-shadow:0 7px 0 var(--ink);background:#fff;flex:none}
.scene svg{display:block;width:100%;height:100%}
#eScene svg{animation:reveal 1s cubic-bezier(.2,.9,.3,1) both}
@keyframes reveal{from{clip-path:circle(0% at 50% 55%)}to{clip-path:circle(80% at 50% 55%)}}
.badge{position:absolute;left:10px;top:10px;background:var(--accent2);border:3px solid var(--ink);border-radius:12px;padding:3px 10px;font-weight:700;font-size:14px;transform:rotate(-6deg);animation:pop2 .5s .9s cubic-bezier(.3,1.7,.5,1) both;z-index:2}
.eno{font-weight:600;font-size:14px;opacity:.6;margin-top:6px}
#eTitle{margin:0;font-size:clamp(30px,9vw,42px);line-height:1;font-weight:700;text-align:center}
#eText{margin:0;text-align:center;font-size:17px;line-height:1.35;max-width:400px;font-weight:500}
.chips{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.chip{width:34px;height:34px;border-radius:11px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:18px}
.note{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:9px 14px;font-weight:600;font-size:15px;text-align:center;max-width:400px}
.btnrow{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;justify-content:center}

/* gallery */
#gallery{background:var(--paper)}
#gallery .top{padding:12px 14px 6px}
#gallery h2{margin:0;flex:1;font-size:26px;font-weight:700}
#gCount{font-weight:700;font-size:18px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 12px;box-shadow:0 3px 0 var(--ink)}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 16px 24px;align-content:start;grid-auto-rows:max-content}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{border:3px solid var(--ink);border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 5px 0 var(--ink);text-align:left;padding:0;display:flex;flex-direction:column}
.card .th{flex:none;width:100%;aspect-ratio:1;border-bottom:3px solid var(--ink);position:relative;overflow:hidden}
.card .th svg{display:block;width:100%;height:100%}
.card .th *{animation:none!important}
.card .bd{padding:7px 10px 9px;display:flex;flex-direction:column;gap:5px;min-height:62px}
.card b{font-size:16px;line-height:1.1}
.card .chips{justify-content:flex-start;gap:3px}
.card .chip{width:22px;height:22px;border-radius:7px;font-size:12px;border-width:2px}
.card.lock{background:#3a2f55;color:#fff}
.card.lock .th{background:repeating-linear-gradient(45deg,#4a3d6b 0 12px,#3f3360 12px 24px);display:grid;place-items:center;font-size:54px;font-weight:700;color:rgba(255,255,255,.85)}
.card.lock .clue{font-size:13px;line-height:1.25;opacity:.9;font-weight:500}
.reset{grid-column:1/-1;text-align:center;margin-top:8px}
.reset button{background:none;border:0;text-decoration:underline;opacity:.55;font-size:14px}
.ghost{font-size:13px;opacity:.6}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:var(--ink);color:#fff;border-radius:16px;padding:10px 18px;font-weight:600;opacity:0;pointer-events:none;transition:.35s;z-index:80;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* world animations (SVG: animated nodes carry no transform attribute) */
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.float{animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}
.tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.spin{animation:spin 16s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.drift{animation:drift 7s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(16px)}}
.rain{animation:rain 1.3s linear infinite}@keyframes rain{0%{transform:translateY(-10px);opacity:0}20%{opacity:1}100%{transform:translateY(80px);opacity:0}}
.rise{animation:rise 2.6s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-60px);opacity:0}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes flick{to{transform:scale(.92,1.1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.sway{animation:sway 5s ease-in-out infinite alternate}@keyframes sway{to{transform:translateX(14px)}}
.wob{animation:wob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes wob{50%{transform:rotate(2.5deg)}}
.pop{animation:popin .7s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes popin{0%{transform:scale(0)}100%{transform:scale(1)}}
.fade{animation:fadein .7s ease both}
@media (prefers-reduced-motion:reduce){.bob,.float,.spin,.drift,.sway,.wob{animation:none}}
</style></head>
<body>
<div id="app">

<section id="menu" class="screen on">
  <div class="bar"><button class="round" id="mSnd" aria-label="Sonido">🔊</button></div>
  <div>
    <h1>Crece<span>Cubo</span></h1>
    <p class="sub">Un solo mundo. Muchos finales.</p>
  </div>
  <svg id="menuCube" viewBox="0 0 400 400"></svg>
  <div class="col">
    <button class="btn" id="mPlay">Jugar</button>
    <button class="btn alt fin" id="mFin"><i></i><b>Finales <span id="mCount">0/0</span></b></button>
    <p class="menu-tip">Toca los objetos del menú para hacer crecer el mundo. Lo que pasa depende de lo que hiciste antes.</p>
  </div>
</section>

<section id="game" class="screen">
  <div class="top">
    <button class="round" id="gBack" aria-label="Volver">←</button>
    <div class="slots" id="slots"></div>
    <button class="round" id="gSnd" aria-label="Sonido">🔊</button>
  </div>
  <div id="stage">
    <div id="bubble"></div>
    <svg id="sv" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet"><g id="world"></g></svg>
  </div>
  <div id="hint"></div>
  <div id="tray"></div>
</section>

<section id="ending" class="screen">
  <div class="end-wrap">
    <div class="scene" id="eScene"></div>
    <div class="eno" id="eNo"></div>
    <h2 id="eTitle"></h2>
    <p id="eText"></p>
    <div class="chips" id="eChips"></div>
    <div class="note" id="eNote" hidden></div>
    <div class="btnrow">
      <button class="btn" id="eAgain">Otra vez</button>
      <button class="btn alt" id="eGal">Finales</button>
    </div>
  </div>
</section>

<section id="gallery" class="screen">
  <div class="top">
    <button class="round" id="lBack" aria-label="Volver">←</button>
    <h2>Finales</h2>
    <div id="gCount">0/0</div>
  </div>
  <div class="grid" id="grid"></div>
</section>

</div>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="toast"></div>

<script>
'use strict';
/* ================================================================== game rules */
const INK='#2b2438';
const TOTAL_LEN=6;
/* tg: where the item flies to on the map; col: particle colours; say: line when nothing visible happens */
const IT={
  A:{e:'💧',n:'Agua',   tg:[143,168],col:['#6ec6ff','#bfe9ff','#fff'],say:'El agua se filtra en la tierra.'},
  F:{e:'🔥',n:'Llama',  tg:[250,150],col:['#ffb347','#ff7a2f','#ffe066'],say:'Chisporrotea un momento y se apaga.'},
  S:{e:'🌱',n:'Semilla',tg:[260,175],col:['#7ad34f','#b4ee92','#fff'],say:'La semilla se esconde en la tierra.'},
  R:{e:'⚡',n:'Rayo',   tg:[255,70], col:['#fff36b','#ffd93d','#fff'],say:'Un trueno lejano retumba.'},
  L:{e:'🌙',n:'Luna',   tg:[80,62],  col:['#cdcdff','#8f8fe8','#fff6c8'],say:'La luna brilla, tranquila.'},
  O:{e:'☀️',n:'Sol',    tg:[320,66], col:['#ffe680','#ffc94a','#fff'],say:'El sol calienta un poquito.'},
  H:{e:'❄️',n:'Hielo',  tg:[143,168],col:['#eefaff','#bfe6fa','#93cdea'],say:'Un escalofrío recorre el mapa.'},
  M:{e:'🪙',n:'Moneda', tg:[212,139],col:['#ffd23f','#f2c94c','#fff0b4'],say:'La moneda rueda y se pierde.'},
  E:{e:'🥚',n:'Huevo',  tg:[197,206],col:['#fffaf0','#f5e6c8','#dec9a0'],say:'Un huevo… ¿de qué será?'},
  V:{e:'🌀',n:'Vacío',  tg:[200,60], col:['#7b69b3','#3f3169','#bfaaff'],say:'…'}
};
const ORDER=['A','F','S','R','L','O','H','M','E','V'];

/* World state: one value per slot. Each item reads the current state, so order changes the outcome. */
const S0={ground:'grass',pond:'pond',plant:'none',bld:'none',crt:'none',sky:'day',void:0};
const LIVE=['sprout','tree','forest','flower'];
function applyItem(s,k){
  const o={...s},m=[],ch=new Set();
  const set=(sl,v)=>{if(o[sl]!==v){o[sl]=v;ch.add(sl)}};
  const say=t=>m.push(t),first=t=>m.unshift(t);
  switch(k){
  case'A':{
    const wasDry=s.pond==='dry';
    if(wasDry){set('pond','pond');say(o.ground==='desert'?'Brota un oasis en el desierto':'El estanque vuelve a llenarse')}
    else if(s.pond==='pond'){set('pond','lake');say('El estanque se desborda: ¡un lago!')}
    else if(s.pond==='ice'||s.pond==='bigice'){set('pond','bigice');say('El agua se congela sobre el hielo')}
    if(o.plant==='sprout'){set('plant','tree');say('El brote crece hasta ser un árbol')}
    else if(o.plant==='tree'){set('plant','forest');say('¡El árbol se multiplica en un bosque!')}
    else if(o.plant==='burnt'){set('plant','none');say('La lluvia apaga las brasas')}
    if(o.ground==='desert'&&!wasDry){set('ground','grass');say('El desierto reverdece')}
    else if(o.ground==='ash'){set('ground','grass');say('La ceniza se vuelve tierra fértil')}
    if(o.sky==='day'||o.sky==='sun'||o.sky==='rainbow'){set('sky','rain');say('Empieza a llover')}
    if(o.crt==='egg'){set('crt','turtle');first('El huevo eclosiona: ¡una tortuga!')}
    break}
  case'F':{
    const wasSnow=s.ground==='snow';
    if(LIVE.includes(o.plant)){set('plant','burnt');say('Todo arde: solo quedan brasas')}
    else if(o.plant==='frozen'){set('plant','tree');say('El árbol se deshiela')}
    if(o.pond==='pond'){set('pond','dry');say('El estanque se evapora')}
    else if(o.pond==='lake'){set('pond','pond');say('El lago se evapora hasta quedar estanque')}
    else if(o.pond==='ice'){set('pond','pond');say('El hielo se derrite')}
    else if(o.pond==='bigice'){set('pond','lake');say('El hielo se derrite y deja un lago')}
    if(o.bld==='hut'){set('bld','ruin');say('La casa arde hasta los cimientos')}
    else if(o.bld==='igloo'){set('bld','none');say('El iglú se derrite')}
    if(wasSnow){set('ground','grass');say('La nieve se derrite')}
    else if(o.ground==='grass'){set('ground','ash');say('La hierba se chamusca')}
    if(o.sky==='snow'||o.sky==='rain'){set('sky','day');say('El cielo se despeja')}
    if(o.crt==='egg'){set('crt','dragon');first('El huevo eclosiona: ¡un dragón!')}
    break}
  case'S':{
    if(o.plant==='none'){
      if(o.ground==='desert'){set('plant','cactus');say('En el desierto solo crece un cactus')}
      else{set('plant','sprout');
        if(o.ground==='snow')say('La semilla espera bajo la nieve');
        else if(o.ground==='ash'){set('ground','grass');say('Las cenizas abonan la semilla: brota con fuerza')}
        else say('Brota una plantita')}
    }
    break}
  case'R':{
    set('sky',o.sky==='void'?'void':'storm');if(s.sky!=='storm'&&o.sky==='storm')say('Se desata una tormenta');
    if(LIVE.includes(o.plant)||o.plant==='frozen'){set('plant','burnt');first('Un rayo parte el árbol');if(o.ground==='grass')set('ground','ash')}
    if(o.bld==='hut'){set('bld','ruin');first('El rayo destroza la casa')}
    if(o.crt==='egg'){set('crt','monster');first('El huevo cobra vida: ¡un monstruo!')}
    break}
  case'H':{
    if(o.pond==='pond'){set('pond','ice');say('El estanque se congela')}
    else if(o.pond==='lake'){set('pond','bigice');say('El lago se congela entero')}
    if(o.ground==='grass'||o.ground==='ash'||o.ground==='desert'){set('ground','snow');say('La nieve lo cubre todo')}
    if(LIVE.includes(o.plant)){set('plant','frozen');say('El árbol se cubre de escarcha')}
    if(o.sky==='night'){set('sky','aurora');say('Una aurora ilumina la noche')}
    else if(o.sky!=='snow'&&o.sky!=='aurora'&&o.sky!=='void'){set('sky','snow');say('Empieza a nevar')}
    if(o.bld==='hut'){set('bld','igloo');say('La casa se convierte en iglú')}
    if(o.crt==='egg'){set('crt','penguin');first('El huevo eclosiona: ¡un pingüino!')}
    break}
  case'O':{
    if(o.sky==='rain'){set('sky','rainbow');say('Sale un arcoíris')}

  case'M':{

  }

}

function endingFor(seq){
  if(seq[0]==='V')return 'nada';
  if(seq.length===3&&['F','O','R'].every(k=>seq.includes(k)))return 'supernova';
  if(seq.length<TOTAL_LEN)return null;
  if(seq[TOTAL_LEN-1]==='V')return 'agujero';
  if(seq.includes('V'))return 'hipercubo';
  return classify(sim(seq));
}

}

  `<g class="pulse"><polygon points="200,150 212,186 250,176 226,206 258,230 218,230 200,266 182,230 142,230 174,206 150,176 188,186" fill="#ff7a2f" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/></g>`+
  miniBlock(200,196,.2,['#2b2438','#1e1829','#120e1b'])+
  `<text x="200" y="372" text-anchor="middle" font-size="46" font-weight="700" fill="#fff" stroke="${INK}" stroke-width="6" paint-order="stroke" class="pulse">¡BOOM!</text>`,
nada:()=>`<rect width="400" height="400" fill="#fbfaf6"/>`+
  `<g fill="none" stroke="#c4bdd6" stroke-width="3" stroke-dasharray="7 9" stroke-linejoin="round" transform="translate(200 190) scale(.9)"><path d="M-150 0L0 75L150 0L0 -75Z"/><path d="M-150 0V60L0 135L150 60V0"/><path d="M0 75V135"/></g>`+
  `<circle class="pulse" cx="200" cy="170" r="5" fill="${INK}"/>`+`<text x="200" y="362" text-anchor="middle" font-size="22" font-weight="500" fill="#b9b3c9">aquí había un mundo</text>`,
agujero:()=>rad(.5,.5,.75,[[0,'#2a1650'],[1,'#000']])+stars(60,4,0,400)+
  `<g transform="translate(200 215) rotate(-18)"><ellipse rx="170" ry="40" fill="none" stroke="#ff8a3d" stroke-width="14" opacity=".9"/><ellipse rx="150" ry="32" fill="none" stroke="#ffd36b" stroke-width="6" opacity=".8"/><ellipse rx="190" ry="48" fill="none" stroke="#a45cff" stroke-width="5" opacity=".6"/></g>`+
  `<circle cx="200" cy="215" r="52" fill="#000" stroke="#ffb347" stroke-width="3"/>`+
  `<g stroke="#fff" stroke-width="3" opacity=".5" stroke-linecap="round"><path d="M290 90L240 175M300 112L246 188M276 80L232 170"/></g>`+
  `<g transform="translate(262 150) rotate(58) scale(.34 1)">${miniBlock(0,0,.5)}</g>`+
  `<text x="200" y="372" text-anchor="middle" font-size="20" fill="#cdb8ff" font-weight="500" class="tw">spaghettificación</text>`,
hipercubo:()=>grad('#07061a','#1a0f3d')+`<g stroke="#5ef3ff" stroke-width="1.5" opacity=".18">${Array.from({length:10},(_,i)=>`<path d="M0 ${250+i*18}H400"/>`).join('')}</g>`+stars(30,8,0,230,'#bfaaff')+
  `<g transform="translate(200 332) scale(1.2)" style="filter:drop-shadow(0 0 6px #5ef3ff)">${wire(1,'#5ef3ff',3)}<g class="pulse" style="filter:drop-shadow(0 0 6px #ff5ef0)">${wire(.5,'#ff5ef0',3)}</g>${V6.map(([x,y])=>`<path d="M${x} ${y}L${CC[0]+(x-CC[0])*.5} ${CC[1]+(y-CC[1])*.5}" stroke="#fff" stroke-width="2" opacity=".6" fill="none"/>`).join('')}</g>`+
  `<g class="bob">${miniBlock(200,270,.16)}</g>`
};
function sceneFor(id,seq){
  if(SPECIAL[id])return W(SPECIAL[id]());
  return worldSVG(sim(seq&&seq.length?seq:examples()[id]||[]));
}

/* ================================================================== dom */
const $=id=>document.getElementById(id);
const screens=['menu','game','ending','gallery'];
let cur='menu';
function go(n){cur=n;screens.forEach(s=>$(s).classList.toggle('on',s===n));if(n==='menu')renderMenu();if(n==='gallery')renderGallery()}
function toast(t,ms=3200){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms)}
function sndIcon(){const i=SV.mute?'🔇':'🔊';$('mSnd').textContent=i;$('gSnd').textContent=i}
function toggleSnd(){SV.mute=!SV.mute;persist();sndIcon();AU.init()}

function renderMenu(){
  $('menuCube').innerHTML=`<g class="float">${worldInner({...S0,plant:'tree',bld:'hut'})}</g>`+
    ['💧','🔥','⚡','🌙'].map((e,i)=>`<text class="tw" style="animation-delay:-${i*.6}s" x="${[44,360,352,52][i]}" y="${[150,130,290,300][i]}" font-size="30" text-anchor="middle">${e}</text>`).join('');
  const n=nFound();$('mCount').textContent=n+'/'+N_END;document.querySelector('#mFin i').style.width=(n/N_END*100)+'%';
}
const chipsOf=seq=>seq.map(k=>`<span class="chip">${IT[k].e}</span>`).join('');
function renderGallery(){
  const n=nFound();$('gCount').textContent=n+'/'+N_END;
  const g=$('grid');g.innerHTML='';
  END.forEach((e,i)=>{
    const f=SV.found[e.id];const b=document.createElement('button');
    if(f){b.className='card';b.innerHTML=`<div class="th">${sceneFor(e.id,f.seq)}</div><div class="bd"><b>${e.t}</b><div class="chips">${chipsOf(f.seq)}</div></div>`;b.onclick=()=>showEnding(e.id,{replay:true})}
    else{b.className='card lock';b.innerHTML=`<div class="th">?</div><div class="bd"><b>Final ${i+1}</b><span class="clue ghost">Toca para ver una pista</span></div>`;b.onclick=()=>{const c=b.querySelector('.clue');c.textContent=e.c;c.classList.remove('ghost')}}
    g.appendChild(b);
  });
  const r=document.createElement('div');r.className='reset';r.innerHTML='<button>Borrar mi progreso</button>';
  r.firstChild.onclick=ev=>{
    const b=ev.currentTarget;
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Toca otra vez para borrar todo';setTimeout(()=>{b.dataset.sure='';b.textContent='Borrar mi progreso'},3000);return}
    SV.found={};persist();renderGallery();toast('Progreso borrado');
  };
  g.appendChild(r);
}
function showEnding(id,{replay=false,seq=[],isNew=false}={}){
  const e=EB[id],f=SV.found[id],list=replay?(f?f.seq:[]):seq;
  const idx=END.indexOf(e)+1;
  $('eScene').innerHTML=sceneFor(id,list)+(isNew?'<div class="badge">¡NUEVO!</div>':'');
  $('eNo').textContent=`Final ${idx} de ${N_END}`;
  $('eTitle').textContent=e.t;$('eText').textContent=e.d;
  $('eChips').innerHTML=chipsOf(list);$('eChips').hidden=!list.length;
  const note=$('eNote');note.hidden=true;
  if(!replay){
    const n=nFound();
    if(isNew&&n===V_AT&&!Q.has('v')){note.hidden=false;note.textContent='🌀 Ha aparecido un objeto misterioso en tu menú…'}
    else if(isNew&&n===N_END){note.hidden=false;note.textContent='🏆 ¡Los '+N_END+' finales! El mundo te da las gracias.'}
    else if(!isNew){note.hidden=false;note.textContent='Ya conocías este final. Quedan '+(N_END-n)+' por descubrir.'}
  }
  go('ending');$('ending').scrollTop=0;
  if(!replay){jingle(e.m);confetti(e.m)}
}
function confetti(m){
  if(m==='dark')return;
  const cols=m==='boom'?['#ffd23f','#ff7a2f','#fff']:['#ff7a59','#ffcf4a','#7ad34f','#6ec6ff','#c79bff'];
  for(let i=0;i<3;i++)setTimeout(()=>burst(innerWidth*(.25+i*.25),innerHeight*.35,cols,34,1.3),700+i*160);
}

/* particles */
const cv=$('fx'),cx=cv.getContext('2d');let PT=[];
function fit(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function burst(x,y,cols,n=26,pw=1){for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=(2+Math.random()*6)*pw;PT.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3*pw,l:1,d:.012+Math.random()*.014,c:cols[i%cols.length],s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,sq:Math.random()<.5})}}
function frame(){
  if(PT.length){
    cx.clearRect(0,0,innerWidth,innerHeight);PT=PT.filter(p=>p.l>0);
    PT.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.985;p.r+=p.vr;p.l-=p.d;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;if(p.sq)cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);else{cx.beginPath();cx.arc(0,0,p.s/2,0,6.283);cx.fill()}cx.restore()});
    if(!PT.length)cx.clearRect(0,0,innerWidth,innerHeight);
  }
  requestAnimationFrame(frame);
}

/* ================================================================== game */
let seq=[],busy=false,state={...S0};
const sv=$('sv'),gameEl=$('game');
function svgPt(x,y){const r=sv.getBoundingClientRect(),k=Math.min(r.width/400,r.height/400),ox=r.left+(r.width-400*k)/2,oy=r.top+(r.height-400*k)/2;return[ox+x*k,oy+y*k]}
function setSky(sk){const [a,b]=SKY[sk];gameEl.style.setProperty('--sky1',a);gameEl.style.setProperty('--sky2',b)}
const renderWorld=ch=>{$('world').innerHTML=worldInner(state,{changed:ch||new Set()})};
function say(t){const b=$('bubble');b.classList.remove('show');void b.offsetWidth;b.textContent=t;b.classList.add('show')}
function buildTray(){
  const t=$('tray');t.innerHTML='';
  ORDER.forEach(k=>{if(k==='V'&&!vUnlocked())return;const b=document.createElement('button');b.className='it'+(k==='V'?' secret':'');b.innerHTML=`<span class="e">${IT[k].e}</span><small>${IT[k].n}</small>`;b.onclick=()=>pick(k,b);t.appendChild(b)});
}
const buildSlots=()=>{$('slots').innerHTML=Array.from({length:TOTAL_LEN},()=>'<div class="slot"></div>').join('')};
const hint=()=>{$('hint').textContent=seq.length?`Objeto ${seq.length} de ${TOTAL_LEN}`:'Elige un objeto para el mundo'};
function newGame(){
  seq=[];busy=false;state={...S0};setSky('day');renderWorld();
  $('bubble').classList.remove('show');buildSlots();buildTray();hint();go('game');
  setTimeout(()=>say('Un mundo pequeñito. ¿Qué le damos primero?'),350);
}
function fly(emoji,x0,y0,x1,y1){
  const el=document.createElement('div');el.className='fly';el.textContent=emoji;document.body.appendChild(el);
  const mx=(x0+x1)/2,my=Math.min(y0,y1)-90;
  el.animate([{transform:`translate(${x0}px,${y0}px) scale(1)`},{transform:`translate(${mx}px,${my}px) scale(1.5) rotate(180deg)`,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(.6) rotate(360deg)`}],{duration:540,easing:'cubic-bezier(.45,0,.55,1)'});
  setTimeout(()=>el.remove(),600);
}
function pick(k,btn){
  if(busy||seq.includes(k))return;busy=true;AU.init();
  seq.push(k);btn.classList.add('used');
  const r=btn.getBoundingClientRect(),[x1,y1]=svgPt(...IT[k].tg);
  fly(IT[k].e,r.left+r.width/2,r.top+r.height/2,x1,y1);vib(8);
  setTimeout(()=>apply(k),520);
}
function apply(k){
  const n=seq.length,r=applyItem(state,k);state=r.s;
  setSky(state.sky);renderWorld(r.ch);
  const [px,py]=svgPt(...IT[k].tg);burst(px,py,IT[k].col,28,1);
  sfx(k,n);vib(20);
  const slot=$('slots').children[n-1];if(slot){slot.className='slot f';slot.textContent=IT[k].e}
  hint();
  const e=endingFor(seq);
  say(e&&n<TOTAL_LEN?'¡Algo está pasando…!':(r.m.length?r.m.slice(0,2).join(' · '):IT[k].say));
  if(e){
    setTimeout(()=>AU.tone(180,.9,'sawtooth',.06,0,700),500);
    setTimeout(()=>{$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on')},1500);
    setTimeout(()=>finish(e),1850);
  }else setTimeout(()=>{busy=false},700);
}
function finish(id){
  const isNew=!SV.found[id];
  if(isNew)SV.found[id]={seq:seq.slice(),n:1};else SV.found[id].n=(SV.found[id].n||1)+1;
  persist();showEnding(id,{seq:seq.slice(),isNew});
}

/* ================================================================== wiring */
$('mPlay').onclick=()=>{AU.init();newGame()};
$('mFin').onclick=()=>{AU.init();go('gallery')};
$('gBack').onclick=()=>go('menu');
$('lBack').onclick=()=>go('menu');
$('eAgain').onclick=()=>{AU.init();newGame()};
$('eGal').onclick=()=>go('gallery');
$('mSnd').onclick=toggleSnd;$('gSnd').onclick=toggleSnd;
sndIcon();renderMenu();requestAnimationFrame(frame);
if(Q.has('gallery')){const ex=examples();END.forEach(e=>{if(ex[e.id])SV.found[e.id]={seq:ex[e.id],n:1}});go('gallery')}
else if(Q.has('end')&&EB[Q.get('end')]){const s=(Q.get('seq')||'').toUpperCase().split('').filter(k=>IT[k]);showEnding(Q.get('end'),{seq:s.length?s:examples()[Q.get('end')]||[],isNew:Q.has('new')})}
else if(Q.has('play'))newGame();
</script>
