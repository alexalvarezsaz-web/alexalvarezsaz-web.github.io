<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crece Cubo</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.webmanifest?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crece Cubo">
<meta name="theme-color" content="#2b2438">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Paper-toy look: cream paper, thick ink outlines, offset ink shadows. The game screen takes its sky from the last item used. */
@property --cT{syntax:'<color>';inherits:true;initial-value:#f4f1ea}
@property --cL{syntax:'<color>';inherits:true;initial-value:#dcd6c8}
@property --cR{syntax:'<color>';inherits:true;initial-value:#c4bdac}
@property --sky1{syntax:'<color>';inherits:true;initial-value:#fdeccc}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#f6cfa0}
:root{--ink:#2b2438;--paper:#fff4dc;--accent:#ff7a59;--accent2:#ffcf4a;--cT:#f4f1ea;--cL:#dcd6c8;--cR:#c4bdac;--sky1:#fdeccc;--sky2:#f6cfa0;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#2b2438;color:var(--ink);font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{background:radial-gradient(circle at 50% 30%,#4a3d63,#241d33 70%)}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:var(--paper)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex;animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
svg text{font-family:'Fredoka',system-ui,sans-serif}

/* shared buttons */
.btn{border:3px solid var(--ink);background:var(--accent);color:#fff;font-weight:700;font-size:22px;padding:13px 26px;border-radius:20px;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(43,36,56,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink);text-shadow:none}
.btn.sm{font-size:17px;padding:9px 16px;border-radius:16px}
.round{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.round:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}

/* menu */
#menu{background:linear-gradient(#ffe9bd,#ffb98f);align-items:center;justify-content:space-between;padding-bottom:max(18px,env(safe-area-inset-bottom))}
#menu .bar{align-self:stretch;display:flex;justify-content:flex-end;padding:12px 14px}
#menu h1{margin:0;text-align:center;font-size:clamp(46px,15vw,76px);line-height:.9;font-weight:700;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);letter-spacing:1px}
#menu h1 span{display:block;color:var(--accent2)}
#menu .sub{margin:14px 0 0;text-align:center;font-size:18px;font-weight:500;opacity:.8}
#menuCube{width:min(80%,330px);flex:1;min-height:0;margin:0 auto}
#menu .col{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;padding:0 28px}
#menu .col .btn{width:100%;max-width:340px}
.fin{position:relative;overflow:hidden}
.fin i{position:absolute;left:0;top:0;bottom:0;background:var(--accent2);width:0;transition:width .6s;z-index:0}
.fin b{position:relative;z-index:1;font-weight:700}
.menu-tip{font-size:15px;opacity:.7;text-align:center;max-width:300px;margin:0}

/* game */
#game{background:linear-gradient(var(--sky1),var(--sky2));transition:--cT .7s,--cL .7s,--cR .7s,--sky1 .9s,--sky2 .9s}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 4px}
.slots{flex:1;display:flex;gap:6px;justify-content:center}
.slot{width:38px;height:38px;border-radius:12px;border:3px dashed rgba(43,36,56,.4);display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.35)}
.slot.f{border:3px solid var(--ink);background:#fff;animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
#stage{flex:1;position:relative;min-height:0}
#sv{width:100%;height:100%;display:block;overflow:visible}
#stars{opacity:0;transition:opacity .9s}
.night #stars{opacity:1}
.night #clouds{opacity:.25}
#clouds{transition:opacity .9s}
#bubble{position:absolute;left:50%;top:2%;transform:translateX(-50%) scale(0);max-width:84%;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:9px 16px;font-weight:600;font-size:17px;text-align:center;box-shadow:0 4px 0 var(--ink);transform-origin:50% 100%;pointer-events:none;z-index:3}
#bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:0 0 5px 0}
#bubble.show{animation:bub 2.3s ease both}
@keyframes bub{0%{transform:translateX(-50%) scale(0)}10%{transform:translateX(-50%) scale(1.08)}16%{transform:translateX(-50%) scale(1)}85%{transform:translateX(-50%) scale(1)}100%{transform:translateX(-50%) scale(0)}}
.fT{fill:var(--cT)}.fL{fill:var(--cL)}.fR{fill:var(--cR)}
#cubePos{transition:transform .65s cubic-bezier(.3,1.55,.5,1)}
.idle{animation:idle 2.6s ease-in-out infinite}
@keyframes idle{50%{transform:scale(1.025,.965)}}
.sq{animation:sq .7s ease both}
@keyframes sq{0%{transform:scale(1,1)}22%{transform:scale(1.28,.68)}52%{transform:scale(.88,1.22)}78%{transform:scale(1.05,.96)}100%{transform:scale(1,1)}}
.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(-3px,0)}50%{transform:translate(3px,-2px)}100%{transform:translate(-3px,1px)}}
#hint{text-align:center;font-weight:600;font-size:15px;opacity:.75;padding:0 0 6px;min-height:22px}
#tray{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;padding:6px 12px 14px}
.it{width:calc((100% - 36px)/5);max-width:92px;aspect-ratio:1/1.05;border-radius:20px;border:3px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;transition:transform .08s,box-shadow .08s,opacity .3s,filter .3s}
.it .e{font-size:clamp(24px,8vw,36px);line-height:1.1}
.it small{font-size:12px;font-weight:600;line-height:1}
.it:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.it.used{opacity:.28;filter:grayscale(1);pointer-events:none;transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.it.secret{background:linear-gradient(135deg,#3f3169,#6b3fa8);color:#fff;animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 5px 0 var(--ink),0 0 18px 4px rgba(150,100,255,.7)}}
.fly{position:fixed;left:0;top:0;font-size:36px;z-index:60;pointer-events:none;margin:-22px 0 0 -22px;will-change:transform}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
#flash.on{animation:flash 1s ease both}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}

/* ending */
#ending{background:var(--paper);overflow-y:auto}
.end-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 18px 22px;margin:auto 0}
.scene{position:relative;width:min(100%,46vh,420px);aspect-ratio:1;border-radius:28px;border:4px solid var(--ink);overflow:hidden;box-shadow:0 7px 0 var(--ink);background:#fff;flex:none}
.scene svg{display:block;width:100%;height:100%}
#eScene svg{animation:reveal 1s cubic-bezier(.2,.9,.3,1) both}
@keyframes reveal{from{clip-path:circle(0% at 50% 62%)}to{clip-path:circle(80% at 50% 62%)}}
.badge{position:absolute;left:10px;top:10px;background:var(--accent2);border:3px solid var(--ink);border-radius:12px;padding:3px 10px;font-weight:700;font-size:14px;transform:rotate(-6deg);animation:pop .5s .9s cubic-bezier(.3,1.7,.5,1) both;z-index:2}
.eno{font-weight:600;font-size:14px;opacity:.6;margin-top:6px}
#eTitle{margin:0;font-size:clamp(30px,9vw,42px);line-height:1;font-weight:700;text-align:center}
#eText{margin:0;text-align:center;font-size:17px;line-height:1.35;max-width:400px;font-weight:500}
.chips{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.chip{width:34px;height:34px;border-radius:11px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:18px}
.note{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:9px 14px;font-weight:600;font-size:15px;text-align:center;max-width:400px}
.btnrow{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;justify-content:center}

/* gallery */
#gallery{background:var(--paper)}
#gallery .top{padding:12px 14px 6px}
#gallery h2{margin:0;flex:1;font-size:26px;font-weight:700}
#gCount{font-weight:700;font-size:18px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 12px;box-shadow:0 3px 0 var(--ink)}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 16px 24px;align-content:start;grid-auto-rows:max-content}
.card{border:3px solid var(--ink);border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 5px 0 var(--ink);text-align:left;padding:0;display:flex;flex-direction:column}
.card .th{flex:none;width:100%;aspect-ratio:1;border-bottom:3px solid var(--ink);position:relative;overflow:hidden}
.card .th svg{display:block;width:100%;height:100%}
.card .bd{padding:7px 10px 9px;display:flex;flex-direction:column;gap:5px;min-height:62px}
.card b{font-size:16px;line-height:1.1}
.card .chips{justify-content:flex-start;gap:3px}
.card .chip{width:22px;height:22px;border-radius:7px;font-size:12px;border-width:2px}
.card.lock{background:#3a2f55;color:#fff}
.card.lock .th{background:repeating-linear-gradient(45deg,#4a3d6b 0 12px,#3f3360 12px 24px);display:grid;place-items:center;font-size:54px;font-weight:700;color:rgba(255,255,255,.85)}
.card.lock .clue{font-size:13px;line-height:1.25;opacity:.9;font-weight:500}
.card.lock small{font-size:12px;opacity:.6;font-weight:600}
.reset{grid-column:1/-1;text-align:center;margin-top:8px}
.reset button{background:none;border:0;text-decoration:underline;opacity:.55;font-size:14px}
.ghost{font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:var(--ink);color:#fff;border-radius:16px;padding:10px 18px;font-weight:600;opacity:0;pointer-events:none;transition:.35s;z-index:80;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* scene animations (SVG, no transform attribute on animated nodes) */
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}
.float{animation:float 3.6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}
.tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.spin{animation:spin 16s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.drift{animation:drift 7s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(16px)}}
.rain{animation:rain 1.3s linear infinite}@keyframes rain{0%{transform:translateY(-10px);opacity:0}20%{opacity:1}100%{transform:translateY(70px);opacity:0}}
.rise{animation:rise 2.6s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-80px);opacity:0}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes flick{to{transform:scale(.92,1.1)}}
.zz{animation:zz 2.8s ease-in-out infinite}@keyframes zz{0%{transform:translate(0,8px);opacity:0}30%{opacity:1}100%{transform:translate(10px,-26px);opacity:0}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.sway{animation:sway 5s ease-in-out infinite alternate}@keyframes sway{to{transform:translateX(18px)}}
.wob{animation:wob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes wob{50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.bob,.float,.spin,.drift,.sway,.wob,.idle{animation:none}}
</style></head>
<body>
<div id="app">

<!-- MENÚ -->
<section id="menu" class="screen on">
  <div class="bar"><button class="round" id="mSnd" aria-label="Sonido">🔊</button></div>
  <div>
    <h1>Crece<span>Cubo</span></h1>
    <p class="sub">Un solo cubo. Muchos finales.</p>
  </div>
  <svg id="menuCube" viewBox="0 0 400 400"></svg>
  <div class="col">
    <button class="btn" id="mPlay">Jugar</button>
    <button class="btn alt fin" id="mFin"><i></i><b>Finales <span id="mCount">0/25</span></b></button>
    <p class="menu-tip">Dale 6 objetos al cubo. El orden en que lo hagas lo cambia todo.</p>
  </div>
</section>

<!-- JUEGO -->
<section id="game" class="screen">
  <div class="top">
    <button class="round" id="gBack" aria-label="Volver">←</button>
    <div class="slots" id="slots"></div>
    <button class="round" id="gSnd" aria-label="Sonido">🔊</button>
  </div>
  <div id="stage">
    <div id="bubble"></div>
    <svg id="sv" viewBox="0 0 400 440" preserveAspectRatio="xMidYMid meet">
      <g id="stars"></g>
      <g id="clouds">
        <g class="drift"><g transform="translate(70 60)"><ellipse rx="46" ry="16" fill="#fff" opacity=".85"/><circle cx="-14" cy="-12" r="18" fill="#fff" opacity=".85"/><circle cx="12" cy="-18" r="22" fill="#fff" opacity=".85"/></g></g>
        <g class="drift" style="animation-delay:-3s"><g transform="translate(335 120) scale(.8)"><ellipse rx="46" ry="16" fill="#fff" opacity=".85"/><circle cx="-14" cy="-12" r="18" fill="#fff" opacity=".85"/><circle cx="12" cy="-18" r="22" fill="#fff" opacity=".85"/></g></g>
      </g>
      <g class="float" id="platWrap">
        <ellipse cx="200" cy="428" rx="130" ry="12" fill="#000" opacity=".12"/>
        <polygon points="50,320 200,395 200,420 50,345" fill="#e0cba3" stroke="#2b2438" stroke-width="3.5" stroke-linejoin="round"/>
        <polygon points="350,320 200,395 200,420 350,345" fill="#c9b186" stroke="#2b2438" stroke-width="3.5" stroke-linejoin="round"/>
        <polygon points="200,245 350,320 200,395 50,320" fill="#fff8e8" stroke="#2b2438" stroke-width="3.5" stroke-linejoin="round"/>
        <polygon points="200,265 322,320 200,375 78,320" fill="none" stroke="#e8d7b4" stroke-width="3" stroke-linejoin="round"/>
        <g id="orbBack"></g>
        <g id="cubePos" style="transform:translate(200px,320px) scale(1)">
          <ellipse cx="0" cy="4" rx="92" ry="26" fill="#000" opacity=".15"/>
          <g id="cubeSq"><g class="idle">
            <polygon class="fL" points="-70,-105 0,-70 0,0 -70,-35" stroke="#2b2438" stroke-width="3" stroke-linejoin="round"/>
            <polygon class="fR" points="0,-70 70,-105 70,-35 0,0" stroke="#2b2438" stroke-width="3" stroke-linejoin="round"/>
            <polygon class="fT" points="0,-140 70,-105 0,-70 -70,-105" stroke="#2b2438" stroke-width="3" stroke-linejoin="round"/>
            <path d="M-60 -100 L-8 -72" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".35" fill="none"/>
            <g id="face" transform="matrix(1 .5 0 1 0 -35)"></g>
          </g></g>
        </g>
        <g id="orbFront"></g>
      </g>
    </svg>
  </div>
  <div id="hint"></div>
  <div id="tray"></div>
</section>

<!-- FINAL -->
<section id="ending" class="screen">
  <div class="end-wrap">
    <div class="scene" id="eScene"></div>
    <div class="eno" id="eNo"></div>
    <h2 id="eTitle"></h2>
    <p id="eText"></p>
    <div class="chips" id="eChips"></div>
    <div class="note" id="eNote" hidden></div>
    <div class="btnrow">
      <button class="btn" id="eAgain">Otra vez</button>
      <button class="btn alt" id="eGal">Finales</button>
    </div>
  </div>
</section>

<!-- GALERÍA -->
<section id="gallery" class="screen">
  <div class="top">
    <button class="round" id="lBack" aria-label="Volver">←</button>
    <h2>Finales</h2>
    <div id="gCount">0/25</div>
  </div>
  <div class="grid" id="grid"></div>
</section>

</div>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="toast"></div>

<script>
'use strict';
/* ------------------------------------------------------------------ data */
const INK='#2b2438';
const IT={
  A:{e:'💧',n:'Agua',   pal:['#a4dcff','#4aa8f0','#2d84d3'],sky:['#d4f0ff','#8fcdf5'],face:'happy',say:['¡Glup! Qué fresquito.','Ahora estoy un poco empapado.']},
  F:{e:'🔥',n:'Llama',  pal:['#ffbf68','#ff7a2f','#d9481c'],sky:['#ffdcb0','#ff9d66'],face:'hot',  say:['¡Ay, quema! Pero qué calorcito…','Estoy que echo humo.']},
  S:{e:'🌱',n:'Semilla',pal:['#b4ee92','#6cc24a','#4a9a35'],sky:['#e8f8cf','#a9dd8c'],face:'happy',say:['Me hace cosquillas por dentro.','¿Algo está brotando ahí?']},
  R:{e:'⚡',n:'Rayo',   pal:['#fff39a','#ffd93d','#e3b100'],sky:['#4b4378','#8a6fd0'],face:'shock',night:1,say:['¡¡ZAS!! Veo la luz.','Me tiemblan hasta las aristas.']},
  L:{e:'🌙',n:'Luna',   pal:['#cdcdff','#8f8fe8','#6866c8'],sky:['#232a66','#4a4da0'],face:'sleep',night:1,say:['Todo se ha vuelto muy tranquilo…','Qué bonito brilla esto.']},
  O:{e:'☀️',n:'Sol',    pal:['#ffec8e','#ffc94a','#f5a31a'],sky:['#fff4b8','#ffd470'],face:'glass',say:['¡Qué calor más agradable!','Me están saliendo pecas.']},
  H:{e:'❄️',n:'Hielo',  pal:['#eefaff','#bfe6fa','#93cdea'],sky:['#eaf9ff','#b8def8'],face:'cold', say:['Brrr… mis aristas tiritan.','¡Se me congela hasta la sonrisa!']},
  M:{e:'🪙',n:'Moneda', pal:['#fff0b4','#f2c94c','#c99a1c'],sky:['#fff1c8','#f2d27a'],face:'rich', say:['¡Clink! Me siento valioso.','Esto vale más de lo que parece.']},
  E:{e:'🥚',n:'Huevo',  pal:['#fffaf0','#f5e6c8','#dec9a0'],sky:['#fff6ea','#f8dcc2'],face:'shock',say:['¿Eso es… un huevo?','Me da cosa romperlo.']},
  V:{e:'🌀',n:'Vacío',  pal:['#7b69b3','#3f3169','#261c47'],sky:['#0c0716','#2a1650'],face:'blank',night:1,say:['…','Algo me observa desde dentro.']}
};
const ORDER=['A','F','S','R','L','O','H','M','E','V'];
const BASE={pal:['#f4f1ea','#dcd6c8','#c4bdac'],sky:['#fdeccc','#f6cfa0']};
const PAIR={FA:'¡PSSSSSS! Vapor por todas partes.',AH:'Crrrk… se me está cuajando.',HF:'Glup… ¿me estoy derritiendo?',FH:'¡CRAC! Qué choque térmico.',AR:'¡BZZZT! Yo ahí no tocaba.',EF:'El huevo hace tic-tic… ¡se mueve!',FE:'Chisporroteo… ¿huele a desayuno?',LO:'Sol y luna a la vez, qué raro.',OL:'Sol y luna a la vez, qué raro.',SA:'La semilla bebe con ganas.',SL:'La semilla mira a la luna.',MF:'La moneda se pone al rojo vivo.'};
const TOTAL_LEN=6;

/* Ending rules: first match wins. See endingFor(). */
function endingFor(s){
  if(s[0]==='V')return 'nada';
  if(s.length===3){const f=k=>s.includes(k);if(f('F')&&f('O')&&f('R'))return 'supernova';if(f('H')&&f('L')&&f('R'))return 'aurora'}
  if(s.length<TOTAL_LEN)return null;
  const adj=(a,b)=>s.some((x,i)=>x===a&&s[i+1]===b);
  const sub=(...k)=>{let j=0;for(const x of s)if(x===k[j])j++;return j===k.length};
  const last=s[s.length-1];
  if(last==='V')return 'agujero';
  if(s.includes('V'))return 'hipercubo';
  if(sub('S','A','O'))return 'arbol';
  if(adj('E','F'))return 'dragon';
  if(adj('F','E'))return 'desayuno';

const scene=id=>W(SC[id]());

/* ------------------------------------------------------------------ dom */
const $=id=>document.getElementById(id);
const screens=['menu','game','ending','gallery'];
let cur='menu';
function go(n){cur=n;screens.forEach(s=>$(s).classList.toggle('on',s===n));if(n==='menu')renderMenu();if(n==='gallery')renderGallery()}
function toast(t,ms=3200){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms)}
function sndIcon(){const i=SV.mute?'🔇':'🔊';$('mSnd').textContent=i;$('gSnd').textContent=i}
function toggleSnd(){SV.mute=!SV.mute;persist();sndIcon();AU.init()}

/* menu */
function renderMenu(){
  $('menuCube').innerHTML=`<g class="float"><ellipse cx="200" cy="332" rx="140" ry="34" fill="#000" opacity=".1"/>`+cube(200,318,1.15,{face:'happy',pal:['#fff9ea','#ffe3a6','#ffc86b'],shadow:false,cls:'bob',
    x:`<g transform="translate(0 -142)"><path d="M0 0C-2 -20 2 -34 0 -48" stroke="#3f9a2d" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="-17" cy="-46" rx="18" ry="9" transform="rotate(-25 -17 -46)" fill="#7ad34f" stroke="${INK}" stroke-width="3"/><ellipse cx="18" cy="-54" rx="18" ry="9" transform="rotate(25 18 -54)" fill="#7ad34f" stroke="${INK}" stroke-width="3"/></g>`})+
    ['💧','🔥','⚡','🌙'].map((e,i)=>`<text class="tw" style="animation-delay:-${i*.6}s" x="${[60,340,330,70][i]}" y="${[120,100,250,260][i]}" font-size="34" text-anchor="middle">${e}</text>`).join('')+`</g>`;
  const n=nFound();$('mCount').textContent=n+'/'+N_END;document.querySelector('#mFin i').style.width=(n/N_END*100)+'%';
}

/* gallery */
function chipsOf(seq){return seq.map(k=>`<span class="chip">${IT[k].e}</span>`).join('')}
function renderGallery(){
  const n=nFound();$('gCount').textContent=n+'/'+N_END;
  const g=$('grid');g.innerHTML='';
  END.forEach((e,i)=>{
    const f=SV.found[e.id];const b=document.createElement('button');
    if(f){b.className='card';b.innerHTML=`<div class="th">${scene(e.id)}</div><div class="bd"><b>${e.t}</b><div class="chips">${chipsOf(f.seq)}</div></div>`;b.onclick=()=>showEnding(e.id,{replay:true})}
    else{b.className='card lock';b.innerHTML=`<div class="th">?</div><div class="bd"><b>Final ${i+1}</b><span class="clue ghost">Toca para ver una pista</span></div>`;b.onclick=()=>{const c=b.querySelector('.clue');c.textContent=e.c;c.classList.remove('ghost')}}
    g.appendChild(b);
  });
  const r=document.createElement('div');r.className='reset';r.innerHTML='<button>Borrar mi progreso</button>';
  r.firstChild.onclick=()=>{if(confirm('¿Borrar todos los finales descubiertos?')){SV.found={};persist();renderGallery();toast('Progreso borrado')}};
  g.appendChild(r);
}

/* ending */
function showEnding(id,{replay=false,seq=[],isNew=false}={}){
  const e=EB[id],f=SV.found[id],list=replay?(f?f.seq:[]):seq;
  const idx=END.indexOf(e)+1;
  $('eScene').innerHTML=scene(id)+(isNew?'<div class="badge">¡NUEVO!</div>':'');
  $('eNo').textContent=`Final ${idx} de ${N_END}`;
  $('eTitle').textContent=e.t;$('eText').textContent=e.d;
  $('eChips').innerHTML=chipsOf(list);$('eChips').hidden=!list.length;
  const note=$('eNote');note.hidden=true;
  if(!replay){
    const n=nFound();
    if(isNew&&n===6&&!Q.has('v')){note.hidden=false;note.textContent='🌀 Ha aparecido un objeto misterioso en tu bandeja…'}
    else if(isNew&&n===N_END){note.hidden=false;note.textContent='🏆 ¡Los '+N_END+' finales! El cubo te da las gracias.'}
    else if(!isNew){note.hidden=false;note.textContent='Ya conocías este final. Quedan '+(N_END-n)+' por descubrir.'}
  }
  go('ending');$('ending').scrollTop=0;
  if(!replay){jingle(e.m);confetti(e.m)}
}
function confetti(m){
  if(m==='dark')return;
  const cols=m==='boom'?['#ffd23f','#ff7a2f','#fff']:['#ff7a59','#ffcf4a','#7ad34f','#6ec6ff','#c79bff'];
  for(let i=0;i<3;i++)setTimeout(()=>burst(innerWidth*(.25+i*.25),innerHeight*.35,cols,34,1.3),700+i*160);
}

/* ------------------------------------------------------------------ particles */
const cv=$('fx'),cx=cv.getContext('2d');let PT=[];
function fit(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function burst(x,y,cols,n=26,pw=1){for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=(2+Math.random()*6)*pw;PT.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3*pw,l:1,d:.012+Math.random()*.014,c:cols[i%cols.length],s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,sq:Math.random()<.5})}}

/* ------------------------------------------------------------------ game */
let seq=[],busy=false,orbs=[];
const sv=$('sv'),cubePos=$('cubePos'),cubeSq=$('cubeSq'),gameEl=$('game');
const scaleFor=n=>1+.11*n;
function svgPt(x,y){const r=sv.getBoundingClientRect(),k=Math.min(r.width/400,r.height/440),ox=r.left+(r.width-400*k)/2,oy=r.top+(r.height-440*k)/2;return[ox+x*k,oy+y*k]}
function setLook(pal,sky){const s=gameEl.style;s.setProperty('--cT',pal[0]);s.setProperty('--cL',pal[1]);s.setProperty('--cR',pal[2]);s.setProperty('--sky1',sky[0]);s.setProperty('--sky2',sky[1])}
const setFace=k=>{$('face').innerHTML=FACE[k]};
function say(t){const b=$('bubble');b.classList.remove('show');void b.offsetWidth;b.textContent=t;b.classList.add('show')}
function squash(){cubeSq.classList.remove('sq');void cubeSq.getBoundingClientRect();cubeSq.classList.add('sq')}
function buildStars(){const r=rngf(5);let o='';for(let i=0;i<40;i++)o+=`<circle class="tw" style="animation-delay:-${(r()*3).toFixed(1)}s" cx="${(r()*400).toFixed(0)}" cy="${(r()*300).toFixed(0)}" r="${(1+r()*2).toFixed(1)}" fill="#fff"/>`;$('stars').innerHTML=o}
function buildTray(){
  const t=$('tray');t.innerHTML='';
  ORDER.forEach(k=>{if(k==='V'&&!vUnlocked())return;const b=document.createElement('button');b.className='it'+(k==='V'?' secret':'');b.innerHTML=`<span class="e">${IT[k].e}</span><small>${IT[k].n}</small>`;b.onclick=()=>pick(k,b);t.appendChild(b)});
}
function buildSlots(){$('slots').innerHTML=Array.from({length:TOTAL_LEN},()=>'<div class="slot"></div>').join('')}
function hint(){$('hint').textContent=seq.length?`Objeto ${seq.length} de ${TOTAL_LEN}`:'Elige un objeto para el cubo'}
function newGame(){
  seq=[];busy=false;orbs=[];$('orbBack').innerHTML='';$('orbFront').innerHTML='';
  gameEl.classList.remove('night');setLook(BASE.pal,BASE.sky);setFace('happy');
  cubePos.style.transform='translate(200px,320px) scale(1)';
  $('bubble').classList.remove('show');buildSlots();buildTray();hint();go('game');
  setTimeout(()=>say('¡Hola! Dame algo.'),350);
}
function fly(emoji,x0,y0,x1,y1){
  const el=document.createElement('div');el.className='fly';el.textContent=emoji;document.body.appendChild(el);
  const mx=(x0+x1)/2,my=Math.min(y0,y1)-110;
  const a=el.animate([{transform:`translate(${x0}px,${y0}px) scale(1)`},{transform:`translate(${mx}px,${my}px) scale(1.5) rotate(180deg)`,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(.5) rotate(360deg)`}],{duration:540,easing:'cubic-bezier(.45,0,.55,1)'});
  setTimeout(()=>el.remove(),600);return a;
}
function pick(k,btn){
  if(busy||seq.includes(k))return;busy=true;AU.init();
  const prev=seq[seq.length-1];seq.push(k);btn.classList.add('used');
  const r=btn.getBoundingClientRect(),n=seq.length,[x1,y1]=svgPt(200,320-70*scaleFor(n-1));
  fly(IT[k].e,r.left+r.width/2,r.top+r.height/2,x1,y1);
  vib(8);
  setTimeout(()=>apply(k,prev),520);
}
function apply(k,prev){
  const it=IT[k],n=seq.length,sc=scaleFor(n);
  setLook(it.pal,it.sky);setFace(it.face);gameEl.classList.toggle('night',!!it.night);
  cubePos.style.transform=`translate(200px,320px) scale(${sc})`;squash();
  const [px,py]=svgPt(200,320-70*sc);burst(px,py,[...it.pal,it.sky[1]],28,1);
  sfx(k,n);vib(20);
  const slot=$('slots').children[n-1];if(slot){slot.className='slot f';slot.textContent=it.e}
  addOrb(k,n);hint();
  const pr=prev?PAIR[prev+k]:null;
  const e=endingFor(seq);
  say(e&&!(n===TOTAL_LEN)?'¡Algo está pasando…!':(pr||it.say[Math.random()<.5?0:1]));
  if(e){
    setTimeout(()=>{cubeSq.firstElementChild.classList.add('shake');AU.tone(180,.9,'sawtooth',.06,0,700)},500);
    setTimeout(()=>{$('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on')},1350);
    setTimeout(()=>{cubeSq.firstElementChild.classList.remove('shake');finish(e)},1700);
  }else setTimeout(()=>{busy=false},650);
}
function finish(id){
  const isNew=!SV.found[id];
  if(isNew)SV.found[id]={seq:seq.slice(),n:1};else SV.found[id].n=(SV.found[id].n||1)+1;
  persist();
  if(DEBUG&&!Q.has('end'))return;
  showEnding(id,{seq:seq.slice(),isNew});
}
function addOrb(k,n){
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');t.setAttribute('font-size','28');t.textContent=IT[k].e;
  t.style.filter='drop-shadow(0 3px 0 rgba(43,36,56,.25))';
  $('orbFront').appendChild(t);orbs.push({el:t,a0:(n-1)*(6.283/TOTAL_LEN)+Math.random()*.3,t0:performance.now()});
}
function tickOrbs(t){
  const sc=scaleFor(orbs.length);
  orbs.forEach(o=>{
    const a=o.a0+(t-o.t0)/2600,s=Math.sin(a),c=Math.cos(a);
    const x=200+(150+orbs.length*5)*c,y=320+68*s-85*sc*.7;
    o.el.setAttribute('x',x.toFixed(1));o.el.setAttribute('y',y.toFixed(1));
    o.el.setAttribute('font-size',(22+10*(s+1)/2).toFixed(1));
    const par=s>0?$('orbFront'):$('orbBack');if(o.el.parentNode!==par)par.appendChild(o.el);
  });
}
function frame(t){
  if(cur==='game')tickOrbs(t);
  if(PT.length){
    cx.clearRect(0,0,innerWidth,innerHeight);
    PT=PT.filter(p=>p.l>0);
    PT.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.985;p.r+=p.vr;p.l-=p.d;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;if(p.sq)cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);else{cx.beginPath();cx.arc(0,0,p.s/2,0,6.283);cx.fill()}cx.restore()});
    if(!PT.length)cx.clearRect(0,0,innerWidth,innerHeight);
  }
  requestAnimationFrame(frame);
}

buildStars();sndIcon();renderMenu();requestAnimationFrame(frame);

else if(Q.has('gallery'))go('gallery');
