<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pronósticos</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.webmanifest?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pronósticos">
<meta name="theme-color" content="#5b5bd6">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="../shared/claude-firebase.js" data-app="pronosticos"></script>
<style>
:root{--bg:#f4f4fb;--card:#fff;--ink:#1f2040;--mut:#6a6b8a;--p:#5b5bd6;--pd:#4343b5;--p2:#e6e6fb;--ok:#2f9e63;--ok2:#dcf3e7;--no:#d6493f;--no2:#fbe3e0;--line:#e3e3f1;--r:18px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14142a;--card:#1f2040;--ink:#ececff;--mut:#9fa0c4;--p:#8d8cf5;--pd:#a9a8ff;--p2:#2d2e5a;--ok:#4cc486;--ok2:#1d3a2e;--no:#f06b60;--no2:#41231f;--line:#32335c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--p);outline-offset:2px}
input,textarea{font:inherit;font-size:16px;color:var(--ink)}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:12px calc(16px + env(safe-area-inset-right)) 6px calc(16px + env(safe-area-inset-left));display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:22px;letter-spacing:-.3px;flex:1}
#sync{font-size:12px;color:var(--mut)}
main{flex:1;overflow-y:auto;padding:4px calc(16px + env(safe-area-inset-right)) 24px calc(16px + env(safe-area-inset-left));-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);font-weight:600;position:relative}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--pd)}
nav .bd{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--no);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(31,32,64,.07)}
.card h2{margin:0 0 8px;font-size:16px}
.muted{color:var(--mut);font-size:13px}
label.l{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
label.l:first-child{margin-top:0}
textarea,input[type=date],input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border-radius:20px;background:var(--p2);font-weight:600;font-size:14px;min-height:38px}
.chip.on{background:var(--p);color:#fff}
.big{font-size:44px;font-weight:800;text-align:center;letter-spacing:-1px;line-height:1.1;margin:4px 0}
input[type=range]{width:100%;accent-color:var(--p);height:34px}
.btn{width:100%;min-height:48px;border-radius:14px;background:var(--p);color:#fff;font-weight:700;font-size:16px}
.btn:disabled{opacity:.45}
.btn.s{background:var(--p2);color:var(--pd)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.pred{display:flex;flex-direction:column;gap:8px}
.pred .t{font-weight:600;line-height:1.35}
.pred .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.pill{padding:2px 9px;border-radius:10px;background:var(--p2);color:var(--pd);font-weight:700}
.pill.late{background:var(--no2);color:var(--no)}
.pill.ok{background:var(--ok2);color:var(--ok)}
.pill.no{background:var(--no2);color:var(--no)}
.two{display:flex;gap:8px}
.two button{flex:1;min-height:44px;border-radius:12px;font-weight:700}
.yes{background:var(--ok2);color:var(--ok)}
.nop{background:var(--no2);color:var(--no)}
.del{color:var(--mut);font-size:13px;text-decoration:underline;min-height:32px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:24px;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--mut)}
.verdict{background:var(--p2);border-radius:14px;padding:12px 14px;line-height:1.45;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.empty{text-align:center;color:var(--mut);padding:26px 10px;line-height:1.5}
.q{font-size:19px;font-weight:700;line-height:1.35;margin:6px 0 14px}
.fb{padding:12px;border-radius:14px;margin-top:12px;font-weight:600;line-height:1.4}
svg text{fill:var(--mut);font-size:11px}
[hidden]{display:none!important}
</style></head>
<body>
<div id="app">
<header><h1>Pronósticos</h1><span id="sync"></span></header>
<main>
<section id="s-nueva">
 <div class="card">
  <label class="l" for="txt">¿Qué crees que va a pasar?</label>
  <textarea id="txt" placeholder="Ej.: Aprobaré el examen de Galénica"></textarea>
  <label class="l">¿Qué probabilidad le das?</label>
  <div class="big"><span id="pv">70</span>%</div>
  <input type="range" id="pr" min="1" max="99" step="1" value="70" aria-label="Probabilidad en porcentaje">
  <div class="chips" id="pchips"></div>
  <label class="l">Tema</label>
  <div class="chips" id="cats"></div>
  <input type="text" id="catx" placeholder="Otro tema" hidden style="margin-top:8px">
  <label class="l">¿Cuándo lo sabrás?</label>
  <div class="chips" id="dchips"></div>
  <input type="date" id="due" style="margin-top:8px">
  <div style="height:14px"></div>
  <button class="btn" id="save" disabled>Guardar pronóstico</button>
  <div class="muted" id="hint" style="margin-top:8px"></div>
 </div>
 <div class="card muted">Consejo: evita el 0 % y el 100 %. Si no tienes ni idea, pon 50 %. Pon un 90 % solo si de cada 10 cosas así esperas fallar una.</div>
</section>
<section id="s-pend" hidden></section>
<section id="s-cal" hidden></section>
<section id="s-entr" hidden></section>
</main>
<nav>
 <button data-t="nueva" class="on"><span>✍️</span>Nuevo</button>
 <button data-t="pend"><span>⏳</span>Pendientes<i class="bd" id="bd" hidden></i></button>
 <button data-t="cal"><span>🎯</span>Calibración</button>
 <button data-t="entr"><span>🧠</span>Entrenar</button>
</nav>
</div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var mem={};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function fmtDate(s){var d=new Date(s+'T12:00:00');return d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}
function pc(x){return Math.round(x*100)+'%'}
function dec(x,n){return x.toFixed(n).replace('.',',')}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

var LS='pronosticos.v1', LT='pronosticos.train.v1';
var P={}, TR={}, db=null, synced=false;
try{var r=JSON.parse(store.get(LS)||'null');if(r&&typeof r==='object')P=r}catch(e){}
try{var r2=JSON.parse(store.get(LT)||'null');if(r2&&typeof r2==='object')TR=r2}catch(e){}
function saveLocal(){store.set(LS,JSON.stringify(P));store.set(LT,JSON.stringify(TR))}
function put(o){P[o.id]=o;saveLocal();if(db)db.collection('predicciones').doc(o.id).set(o).catch(function(){});render()}
function drop(id){delete P[id];saveLocal();if(db)db.collection('predicciones').doc(id).delete().catch(function(){});render()}
function putTr(o){TR[o.id]=o;saveLocal();if(db)db.collection('entreno').doc(o.id).set(o).catch(function(){})}

// ---------- Nuevo ----------
var CATS=['Estudios','Familia','Trabajo','Salud','Deporte','Mundo','Vida'], PCH=[5,10,25,40,50,60,75,90,95];
var DCH=[['Mañana',1],['1 semana',7],['1 mes',30],['3 meses',90],['1 año',365]];
var F={cat:'',other:false};
function chips(id,items,cls){ $(id).innerHTML=items.map(function(x){return '<button type="button" class="chip" data-v="'+esc(x[0])+'">'+esc(x[1])+'</button>'}).join('') }
chips('pchips',PCH.map(function(v){return [v,v+'%']}));
chips('cats',CATS.map(function(c){return [c,c]}).concat([['__otra','Otro']]));
chips('dchips',DCH.map(function(d){return [d[1],d[0]]}));
function check(){var ok=$('txt').value.trim()&&$('due').value;$('save').disabled=!ok;$('hint').textContent=ok?'':'Escribe el pronóstico y elige cuándo lo sabrás.'}
$('pr').addEventListener('input',function(){$('pv').textContent=$('pr').value});
$('pchips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;$('pr').value=b.dataset.v;$('pv').textContent=b.dataset.v});
$('cats').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;
 [].forEach.call($('cats').children,function(c){c.classList.toggle('on',c===b)});
 F.other=b.dataset.v==='__otra';F.cat=F.other?'':b.dataset.v;$('catx').hidden=!F.other;if(F.other)$('catx').focus()});
$('dchips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;
 [].forEach.call($('dchips').children,function(c){c.classList.toggle('on',c===b)});$('due').value=addDays(+b.dataset.v);check()});
$('due').min=today();
$('due').addEventListener('input',function(){[].forEach.call($('dchips').children,function(c){c.classList.remove('on')});check()});
$('txt').addEventListener('input',check);
$('save').addEventListener('click',function(){
 var cat=F.other?($('catx').value.trim()||'Otro'):(F.cat||'Sin tema');
 put({id:uid(),text:$('txt').value.trim(),p:+$('pr').value,cat:cat,created:today(),due:$('due').value,outcome:null});
 $('txt').value='';$('due').value='';F={cat:'',other:false};$('catx').value='';$('catx').hidden=true;
 [].forEach.call(document.querySelectorAll('#cats .chip,#dchips .chip'),function(c){c.classList.remove('on')});
 check();tab('pend')});
check();

// ---------- Pendientes ----------
function predHtml(o,resolved){
 var late=!resolved&&o.due<=today();
 var m='<span class="pill">'+o.p+'%</span><span>'+esc(o.cat)+'</span><span>· '+(resolved?'resuelto':'vence')+' '+fmtDate(resolved?(o.resolved||o.due):o.due)+'</span>';
 if(late)m+='<span class="pill late">Toca resolver</span>';
 if(resolved)m+='<span class="pill '+(o.outcome?'ok':'no')+'">'+(o.outcome?'Pasó':'No pasó')+'</span>';
 var act=resolved?'<div class="row"><button class="del" data-re="'+o.id+'">Reabrir</button><span class="sp"></span><button class="del" data-del="'+o.id+'">Borrar</button></div>'
  :'<div class="two"><button class="yes" data-res="'+o.id+'" data-v="1">Pasó</button><button class="nop" data-res="'+o.id+'" data-v="0">No pasó</button></div><div class="row"><span class="sp"></span><button class="del" data-del="'+o.id+'">Borrar</button></div>';
 return '<div class="card pred"><div class="t">'+esc(o.text)+'</div><div class="m">'+m+'</div>'+act+'</div>';
}
function renderPend(){
 var all=Object.keys(P).map(function(k){return P[k]});
 var open=all.filter(function(o){return o.outcome===null||o.outcome===undefined}).sort(function(a,b){return a.due<b.due?-1:1});
 var done=all.filter(function(o){return o.outcome===true||o.outcome===false}).sort(function(a,b){return (b.resolved||'')<(a.resolved||'')?-1:1});
 var h='';
 if(!open.length)h+='<div class="empty">No tienes pronósticos pendientes.<br>Apunta uno en la pestaña Nuevo.</div>';
 else h+=open.map(function(o){return predHtml(o,false)}).join('');
 if(done.length)h+='<details><summary>Resueltos ('+done.length+')</summary>'+done.map(function(o){return predHtml(o,true)}).join('')+'</details>';
 h+='<div class="card" style="margin-top:12px"><div class="row"><button class="btn s" id="exp">Copia de seguridad</button><button class="btn s" id="imp">Importar</button></div><input type="text" id="impx" placeholder="Pega aquí la copia y pulsa Importar" style="margin-top:8px"></div>';
 $('s-pend').innerHTML=h;
 var late=open.filter(function(o){return o.due<=today()}).length;
 $('bd').hidden=!late;$('bd').textContent=late;
}
$('s-pend').addEventListener('click',function(e){
 var t=e.target.closest('button');if(!t)return;
 if(t.dataset.res){var o=P[t.dataset.res];if(o){o.outcome=t.dataset.v==='1';o.resolved=today();put(o)}}
 else if(t.dataset.re){var q=P[t.dataset.re];if(q){q.outcome=null;delete q.resolved;put(q)}}
 else if(t.dataset.del){if(confirm('¿Borrar este pronóstico?'))drop(t.dataset.del)}
 else if(t.id==='exp'){var s=JSON.stringify({p:P,t:TR});$('impx').value=s;$('impx').select();try{navigator.clipboard.writeText(s)}catch(x){}}
 else if(t.id==='imp'){try{var d=JSON.parse($('impx').value);var n=0;Object.keys(d.p||{}).forEach(function(k){if(!P[k]){P[k]=d.p[k];if(db)db.collection('predicciones').doc(k).set(d.p[k]).catch(function(){});n++}});
  Object.keys(d.t||{}).forEach(function(k){if(!TR[k])putTr(d.t[k])});saveLocal();render();alert('Importados: '+n)}catch(x){alert('La copia no es válida.')}}
});

// ---------- Calibración ----------
function stats(list){
 var n=list.length;if(!n)return null;
 var br=0,sp=0,hit=0;list.forEach(function(o){var p=o.p/100,y=o.outcome?1:0;br+=(p-y)*(p-y);sp+=p;hit+=y});
 return{n:n,brier:br/n,mean:sp/n,rate:hit/n};
}
function chart(list){
 var W=300,H=300,m=34,s=W-m-8,bins=[];
 for(var i=0;i<10;i++)bins.push([]);
 list.forEach(function(o){bins[Math.min(9,Math.floor(o.p/10))].push(o)});
 var x=function(v){return m+v*s},y=function(v){return H-m-v*s};
 var g='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Curva de calibración">';
 for(var k=0;k<=10;k+=2){g+='<line x1="'+x(k/10)+'" y1="'+y(0)+'" x2="'+x(k/10)+'" y2="'+y(1)+'" stroke="var(--line)"/><line x1="'+x(0)+'" y1="'+y(k/10)+'" x2="'+x(1)+'" y2="'+y(k/10)+'" stroke="var(--line)"/>';
  g+='<text x="'+x(k/10)+'" y="'+(H-m+14)+'" text-anchor="middle">'+k*10+'</text><text x="'+(m-6)+'" y="'+(y(k/10)+4)+'" text-anchor="end">'+k*10+'</text>'}
 g+='<line x1="'+x(0)+'" y1="'+y(0)+'" x2="'+x(1)+'" y2="'+y(1)+'" stroke="var(--mut)" stroke-dasharray="5 4"/>';
 g+='<text x="'+x(.5)+'" y="'+(H-4)+'" text-anchor="middle">Lo que dijiste (%)</text><text transform="translate(10 '+y(.5)+') rotate(-90)" text-anchor="middle">Lo que pasó (%)</text>';
 var pts=[];bins.forEach(function(b){if(b.length){var st=stats(b);pts.push([st.mean,st.rate,b.length])}});
 if(pts.length>1)g+='<polyline fill="none" stroke="var(--p)" stroke-width="2" points="'+pts.map(function(p){return x(p[0])+','+y(p[1])}).join(' ')+'"/>';
 pts.forEach(function(p){g+='<circle cx="'+x(p[0])+'" cy="'+y(p[1])+'" r="'+(5+Math.min(8,p[2]))+'" fill="var(--p)" fill-opacity=".75"><title>'+p[2]+' pronósticos</title></circle>'});
 return g+'</svg>';
}
function verdict(st,list){
 if(st.n<5)return 'Todavía tienes pocos pronósticos resueltos ('+st.n+'). Con unos 20 ya se empieza a ver algo claro.';
 var out=[];
 var hi=stats(list.filter(function(o){return o.p>=75})),lo=stats(list.filter(function(o){return o.p<=25}));
 var d=st.mean-st.rate;
 if(d>.08)out.push('Eres <b>optimista de más</b>: de media das un '+pc(st.mean)+' a lo que pasa y solo pasa el '+pc(st.rate)+'.');
 else if(d<-.08)out.push('Eres <b>pesimista de más</b>: de media das un '+pc(st.mean)+' y pasa el '+pc(st.rate)+'.');
 else out.push('En conjunto vas <b>bien calibrado</b>: de media dices '+pc(st.mean)+' y pasa el '+pc(st.rate)+'.');
 if(hi&&hi.n>=3)out.push('Cuando dices 75 % o más, aciertas el '+pc(hi.rate)+' ('+hi.n+' veces)'+(hi.rate<hi.mean-.1?': te pasas de confiado.':'.'));
 if(lo&&lo.n>=3)out.push('Cuando dices 25 % o menos, pasa el '+pc(lo.rate)+' ('+lo.n+' veces)'+(lo.rate>lo.mean+.1?': subestimas lo improbable.':'.'));
 out.push(st.brier<.15?'Tu Brier es muy bueno.':st.brier<=.25?'Mejor que tirar una moneda (0,25).':'Peor que decir siempre 50 % (0,25).');
 return out.join(' ');
}
function groupTable(list,keyf,title){
 var g={};list.forEach(function(o){var k=keyf(o);(g[k]=g[k]||[]).push(o)});
 var ks=Object.keys(g).sort();if(!ks.length)return '';
 return '<div class="card"><h2>'+title+'</h2><table><tr><th></th><th class="n">Nº</th><th class="n">Dijiste</th><th class="n">Pasó</th><th class="n">Brier</th></tr>'+
  ks.map(function(k){var s=stats(g[k]);return '<tr><td>'+esc(k)+'</td><td class="n">'+s.n+'</td><td class="n">'+pc(s.mean)+'</td><td class="n">'+pc(s.rate)+'</td><td class="n">'+dec(s.brier,2)+'</td></tr>'}).join('')+'</table></div>';
}
function hz(o){var d=dayDiff(o.created,o.due);return d<=7?'1 · Hasta 1 semana':d<=31?'2 · Hasta 1 mes':d<=183?'3 · Hasta 6 meses':'4 · Más de 6 meses'}
function renderCal(){
 var list=Object.keys(P).map(function(k){return P[k]}).filter(function(o){return o.outcome===true||o.outcome===false});
 var st=stats(list);
 if(!st){$('s-cal').innerHTML='<div class="empty">Aquí verás cómo de bien calibrado estás.<br>Resuelve tu primer pronóstico (¿pasó o no?) y aparecerá.</div>';return}
 var h='<div class="card"><div class="stats"><div class="stat"><b>'+st.n+'</b><span>pronósticos resueltos</span></div><div class="stat"><b>'+dec(st.brier,3)+'</b><span>Brier (0 = perfecto, 0,25 = moneda)</span></div><div class="stat"><b>'+pc(st.mean)+'</b><span>probabilidad media que diste</span></div><div class="stat"><b>'+pc(st.rate)+'</b><span>veces que pasó de verdad</span></div></div></div>';
 h+='<div class="card"><div class="verdict">'+verdict(st,list)+'</div></div>';
 h+='<div class="card"><h2>Curva de calibración</h2>'+chart(list)+'<div class="muted">Si los puntos siguen la línea discontinua, estás bien calibrado. Por encima: pasa más de lo que crees. Por debajo: pasa menos. Punto grande = más pronósticos.</div></div>';
 h+=groupTable(list,function(o){return o.cat},'Por tema')+groupTable(list,hz,'Por plazo');
 $('s-cal').innerHTML=h.replace(/(>)(\d) · /g,'$1');
}

// ---------- Entrenar ----------
var QS=[
['El Sol es una estrella.',1],['La Gran Muralla China se ve a simple vista desde la Luna.',0],['El agua hierve a 100 °C al nivel del mar.',1],['Los murciélagos son ciegos.',0],
['Australia es más grande que la Luna en diámetro.',0],['El corazón humano tiene cuatro cavidades.',1],['Barcelona es la capital de España.',0],['Un kilo de plomo pesa más que un kilo de plumas.',0],
['El oro tiene el símbolo químico Au.',1],['Las hormigas tienen seis patas.',1],['El Everest es la montaña más alta sobre el nivel del mar.',1],['Los humanos usan solo el 10 % del cerebro.',0],

var cur=null,pick=null,conf=null;
function nextQ(){var used={};Object.keys(TR).forEach(function(k){used[TR[k].q]=(used[TR[k].q]||0)+1});
 var min=Math.min.apply(null,QS.map(function(_,i){return used[i]||0}));
 var pool=[];QS.forEach(function(_,i){if((used[i]||0)===min)pool.push(i)});
 cur=pool[Math.floor(Math.random()*pool.length)];pick=null;conf=null;renderEntr()}
function renderEntr(){
 var list=Object.keys(TR).map(function(k){return TR[k]}),st=null;
 if(list.length){var l2=list.map(function(o){return{p:o.p,outcome:o.ok}});st=stats(l2);var hi=stats(l2.filter(function(o){return o.p>=90}))}
 var h='<div class="card">';
 if(cur===null){h+='<h2>Entrena tu calibración</h2><p class="muted" style="margin-top:0">Verás una frase. Di si es verdadera o falsa y cuánta confianza tienes. Si dices 90 %, deberías acertar 9 de cada 10.</p><button class="btn" id="go">Empezar</button>'}
 else{
  h+='<div class="q">'+esc(QS[cur][0])+'</div>';
  if(pick===null)h+='<div class="two"><button class="chip" data-pk="1" style="min-height:48px;font-size:16px">Verdadero</button><button class="chip" data-pk="0" style="min-height:48px;font-size:16px">Falso</button></div>';
  else if(conf===null){h+='<div class="muted" style="margin-bottom:8px">Dices <b>'+(pick?'verdadero':'falso')+'</b>. ¿Con qué confianza?</div><div class="chips">'+[50,60,70,80,90,99].map(function(v){return '<button class="chip" data-cf="'+v+'">'+v+'%</button>'}).join('')+'</div>'}
  else{var ok=(pick===1)===(QS[cur][1]===1);
   h+='<div class="fb" style="background:var(--'+(ok?'ok2':'no2')+');color:var(--'+(ok?'ok':'no')+')">'+(ok?'Acertaste.':'Fallaste.')+' Era '+(QS[cur][1]?'verdadero':'falso')+'.</div><div style="height:12px"></div><button class="btn" id="go">Siguiente</button>'}
 }
 h+='</div>';
 if(st)h+='<div class="card"><h2>Tu entrenamiento</h2><div class="stats"><div class="stat"><b>'+st.n+'</b><span>preguntas</span></div><div class="stat"><b>'+pc(st.rate)+'</b><span>aciertos (confianza media '+pc(st.mean)+')</span></div></div>'+
  '<div class="muted" style="margin-top:8px">'+(st.n<8?'Sigue hasta unas 20 preguntas para ver tendencia.':(st.mean-st.rate>.08?'Te pasas de confiado: baja un poco tus porcentajes.':(st.rate-st.mean>.08?'Aciertas más de lo que crees: puedes confiar más.':'Muy buena calibración.')))+(hi&&hi.n>=3?' Con 90 % o más aciertas el '+pc(hi.rate)+'.':'')+'</div></div>';
 $('s-entr').innerHTML=h;
}
$('s-entr').addEventListener('click',function(e){
 var t=e.target.closest('button');if(!t)return;
 if(t.id==='go')nextQ();
 else if(t.dataset.pk!==undefined){pick=+t.dataset.pk;renderEntr()}
 else if(t.dataset.cf){conf=+t.dataset.cf;var ok=(pick===1)===(QS[cur][1]===1);putTr({id:uid(),q:cur,p:conf,ok:ok,ts:Date.now()});renderEntr()}
});

function tab(t){
 ['nueva','pend','cal','entr'].forEach(function(k){$('s-'+k).hidden=k!==t});
 [].forEach.call(document.querySelectorAll('nav button'),function(b){b.classList.toggle('on',b.dataset.t===t)});
 $('app').querySelector('main').scrollTop=0;render()}
document.querySelector('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)tab(b.dataset.t)});
function render(){renderPend();if(!$('s-cal').hidden)renderCal();if(!$('s-entr').hidden)renderEntr()}
render();
setInterval(render,60000);

(async function(){
 try{
  var c=window.claude&&await window.claude.use('db');if(!c)return;
  db=c;var timer=setTimeout(function(){$('sync').textContent='Sin conexión con la base de datos'},10000);
  // Local data created before signing in goes up once, then Firestore is the source of truth
  var seen={};
  c.collection('predicciones').onSnapshot(function(snap){
   var m={};snap.docs.forEach(function(d){var x=d.data();if(x)m[d.id]=x});
   if(!(snap.metadata&&snap.metadata.fromCache)){synced=true;clearTimeout(timer);$('sync').textContent='';
    if(!seen.p){seen.p=1;Object.keys(P).forEach(function(k){if(!m[k])c.collection('predicciones').doc(k).set(P[k]).catch(function(){})})}}
   if((snap.metadata&&snap.metadata.fromCache)&&!synced&&!snap.docs.length)return;
   var keep={};Object.keys(P).forEach(function(k){if(!m[k]&&!synced)keep[k]=P[k]});
   P=Object.assign(keep,m);saveLocal();render();
  },function(){clearTimeout(timer);$('sync').textContent='No se pudo leer. Recarga.'});
  c.collection('entreno').onSnapshot(function(snap){
   var m={};snap.docs.forEach(function(d){var x=d.data();if(x)m[d.id]=x});
   if(!(snap.metadata&&snap.metadata.fromCache)){if(!seen.t){seen.t=1;Object.keys(TR).forEach(function(k){if(!m[k])c.collection('entreno').doc(k).set(TR[k]).catch(function(){})})}}
   else if(!Object.keys(m).length)return;
   TR=Object.assign({},(snap.metadata&&snap.metadata.fromCache)?TR:{},m);saveLocal();if(!$('s-entr').hidden)renderEntr();
  });
 }catch(e){}
})();
})();
