function parse(raw, base) {
  var s = ' ' + raw + ' ', T = today(), out = { d: base, h: '', r: '', hasD: false };
  function cut(re) { var m = re.exec(s); if (m) s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length); return m; }
  var m;
  if (cut(new RegExp(NB + '(cada semana|todas las semanas|semanalmente|semanal)' + NA, 'i'))) out.r = 'w';
  else if (cut(new RegExp(NB + '(cada mes|todos los meses|mensualmente|mensual)' + NA, 'i'))) out.r = 'm';
  else if (cut(new RegExp(NB + '(cada año|todos los años|anualmente|anual)' + NA, 'i'))) out.r = 'y';
  if ((m = cut(/(?:a las |a la |sobre las )?(?<![\d:\/])([01]?\d|2[0-3])[:h]([0-5]\d)(?!\d)/i))) out.h = p2(+m[1]) + ':' + m[2];
  else if ((m = cut(/(?:a las|a la) (\d{1,2})(?![\d:\/])(?: ?h)?/i))) out.h = p2(+m[1] % 24) + ':00';
  else if ((m = cut(/(?<![\d\/:])(\d{1,2}) ?h(?![a-záéíóúñ])/i)) && +m[1] < 24) out.h = p2(+m[1]) + ':00';
  if (out.h) {
    var hh = +out.h.slice(0, 2);
    if (cut(/ de la (tarde|noche)/i) && hh < 12) out.h = p2(hh + 12) + out.h.slice(2);
    cut(/ de la mañana/i);
  }
  function yearFor(mo, da, y) { if (y) return +y < 100 ? 2000 + +y : +y; var c = new Date().getFullYear(); return ds(new Date(c, mo, da, 12)) < T ? c + 1 : c; }
  if (cut(new RegExp(NB + 'pasado mañana' + NA, 'i'))) { out.d = addDays(T, 2); out.hasD = true; }
  else if (cut(new RegExp(NB + 'mañana' + NA, 'i'))) { out.d = addDays(T, 1); out.hasD = true; }
  else if (cut(new RegExp(NB + 'hoy' + NA, 'i'))) { out.d = T; out.hasD = true; }
  else if ((m = cut(/(?<![\d\/])(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?![\d\/])/))) { var y1 = yearFor(+m[2] - 1, +m[1], m[3]); out.d = y1 + '-' + p2(+m[2]) + '-' + p2(+m[1]); out.hasD = true; }
  else if ((m = cut(new RegExp('(?<![\\d])(\\d{1,2}) (?:de )?(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre|ene|feb|mar|abr|may|jun|jul|ago|sept|sep|oct|nov|dic)' + NA + '(?: de (\\d{4}))?', 'i')))) {
    var mi = MESC.indexOf(m[2].toLowerCase().slice(0, 3)); if (mi < 0) mi = 8;
    out.d = yearFor(mi, +m[1], m[3]) + '-' + p2(mi + 1) + '-' + p2(+m[1]); out.hasD = true;
  } else if ((m = cut(new RegExp('(?:(?:el|este|el próximo|el proximo|próximo|proximo) )?' + NB + '(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)' + NA, 'i')))) {
    var w = WK.indexOf(m[1].toLowerCase().replace('é', 'e').replace('á', 'a')), cur = new Date().getDay(), add = (w - cur + 7) % 7 || 7; out.d = addDays(T, add); out.hasD = true;
  } else if ((m = cut(/(?<![\d\/])\bel (\d{1,2})(?![\d\/:])/i))) {
    var dn = +m[1], t0 = new Date(), c = new Date(t0.getFullYear(), t0.getMonth(), dn, 12); if (ds(c) < T) c = new Date(t0.getFullYear(), t0.getMonth() + 1, dn, 12); out.d = ds(c); out.hasD = true;
  }
  var t = s.replace(/\s+/g, ' ').trim().replace(/^(el|la|a|de|para|en|con)\s+/i, '').replace(/\s+(el|la|a|de|para|en|a las|a la|este|el próximo)$/i, '');
  out.t = cap(t);
  return out;
}
function describe(p) { return fmtShort(p.d) + (p.h ? ' · ' + p.h : '') + (p.r ? ' · ' + { w: 'cada semana', m: 'cada mes', y: 'cada año' }[p.r] : ''); }

// ---------- Store: shared database when there is one, this browser otherwise ----------
function persistLocal() { try { localStorage.setItem(LS, JSON.stringify(EV)); } catch (e) {} }
function save(id, o) {
  EV[id] = o; render();
  if (col) col.doc(id).set(o).catch(function () { toast('No se ha podido guardar. Comprueba la conexión.'); });
  else persistLocal();
}
// One tap deletes; the toast offers Deshacer. A failed delete puts the plan back and says so.
function remove(id, quiet) {
  var old = EV[id]; if (!old) return;
  delete EV[id]; render();
  if (!quiet) toast('Borrado: ' + old.t, 'Deshacer', function () { save(id, old); });
  if (col) col.doc(id).delete().catch(function () { EV[id] = old; render(); toast('No se ha podido borrar. Comprueba la conexión.'); });
  else persistLocal();
}
function newId() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function toast(msg, label, fn) {
  var el = $('toast'); clearTimeout(toastT); el.hidden = false;
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (label ? '<button type="button" id="toastB">' + esc(label) + '</button>' : '');
  if (label) $('toastB').onclick = function () { el.hidden = true; fn(); };
  toastT = setTimeout(function () { el.hidden = true; }, 7000);
}

// ---------- Drawing ----------
function evRow(e) {
  var s = sel, done = isDone(e, s), past = !done && isPast(e, s);
  var multi = e.f && e.f > e.d ? fmtShort(e.d) + ' a ' + fmtShort(e.f) : '', rep = e.r ? { w: 'Cada semana', m: 'Cada mes', y: 'Cada año' }[e.r] : '';
  var sub = [multi, rep, e.n].filter(Boolean).join(' · ');
  var tag = done ? '<span class="ya">Hecho</span>' : past ? '<span class="ya">Ya pasó</span>' : e.k === 'cora' ? '<span class="tag">Cora</span>' : e.by === 'claude' ? '<span class="tag">Claude</span>' : '<span></span>';
  var hr = e.h ? esc(span(e)) : '<span style="font-size:12px">Todo el día</span>';
  return '<li class="ev' + (done ? ' done' : past ? ' past' : '') + '" style="--c:var(--' + esc(e.c || 'cielo') + ')"><button type="button" class="open" data-id="' + esc(e.id) + '"><span class="h">' + hr + '</span><span class="t">' + esc(e.t) + (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</span>' + tag + '</button><button type="button" class="ok" data-ok="' + esc(e.id) + '" aria-pressed="' + done + '" aria-label="' + (done ? 'Quitar hecho: ' : 'Marcar hecho: ') + esc(e.t) + '"><i aria-hidden="true">✓</i></button><button type="button" class="x" data-del="' + esc(e.id) + '" aria-label="Borrar ' + esc(e.t) + '">✕</button></li>';
}
function nextCora() {
  var T = today(), best = null;
  Object.keys(EV).forEach(function (k) { var e = EV[k]; if (e.k === 'cora' && e.d >= T && (!best || e.d < best.d)) best = e; });
  return best;
}
function drawCora() {
  var e = nextCora(), b = $('coraBox'); b.hidden = !e;
  if (e) b.innerHTML = '<span class="plus" aria-hidden="true">✚</span><div>Próximo sábado en la farmacia Cora<small>' + esc(fmtLong(e.d) + ' · ' + span(e) + ' · ' + rel(e.d).toLowerCase()) + '</small></div>';
}
function drawCover() {
  var T = today(), d = pd(T), nx = [], cora = nextCora();
  $('cvDate').textContent = DIAC[d.getDay()] + ' ' + d.getDate() + ' ' + MESC[d.getMonth()];
  $('cvBig').innerHTML = '<b>' + d.getDate() + '</b><span>' + esc(DIA[d.getDay()]) + '<br>' + esc(MES[d.getMonth()]) + '</span>';
  for (var k = 0; k < 30 && nx.length < 3; k++) { var s2 = addDays(T, k); eventsOn(s2).forEach(function (e) { if (nx.length < 3 && e.k !== 'cora' && !isGone(e, s2)) nx.push([s2, e]); }); }
  var h = '<h2>Lo próximo</h2>' + (nx.length ? nx.map(function (p) { return '<p><b>' + esc(rel(p[0])) + '</b><span>' + esc(p[1].t + (p[1].h ? ' · ' + p[1].h : '')) + '</span></p>'; }).join('') : '<p><span>Nada apuntado. Día libre.</span></p>');
  if (cora) h += '<p><b>✚ Cora</b><span>' + esc(fmtShort(cora.d) + ' · ' + span(cora)) + '</span></p>';
  $('cvNx').innerHTML = h;
}
function render() {
  var T = today(), y = view.y, mo = view.m, first = new Date(y, mo, 1, 12), lead = (first.getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate(), rows = Math.ceil((lead + days) / 7), start = addDays(ds(first), -lead), cells = [];
  $('anio').textContent = y; $('mesN').textContent = MES[mo];
  for (var i = 0; i < rows * 7; i++) {
    var s = addDays(start, i), d = pd(s), evs = eventsOn(s), cls = 'day' + (d.getMonth() !== mo ? ' out' : '') + (s === T ? ' today' : '') + (s === sel ? ' sel' : '');
    var dots = evs.slice(0, 3).map(function (e) { return '<i style="--c:var(--' + esc(e.c || 'cielo') + ')"></i>'; }).join('') + (evs.length > 3 ? '<b>+' + (evs.length - 3) + '</b>' : '');
    var chips = evs.slice(0, 2).map(function (e) { return '<span' + (isDone(e, s) ? ' class="hecho"' : '') + ' style="--c:var(--' + esc(e.c || 'cielo') + ')">' + esc((e.h ? e.h + ' ' : '') + e.t) + '</span>'; }).join('') + (evs.length > 2 ? '<span style="--c:var(--muted)">+' + (evs.length - 2) + ' más</span>' : '');
    var cx = evs.some(function (e) { return e.k === 'cora'; }) ? '<span class="cx" aria-hidden="true">✚</span>' : '';
    cells.push('<button type="button" class="' + cls + '" data-d="' + s + '" aria-label="' + esc(fmtLong(s)) + (evs.length ? ', ' + evs.length + (evs.length === 1 ? ' plan' : ' planes') : '') + '"' + (s === sel ? ' aria-pressed="true"' : '') + '><span class="n">' + d.getDate() + '</span>' + cx + '<span class="dots">' + dots + '</span><span class="chips">' + chips + '</span></button>');
  }
  $('grid').innerHTML = cells.join('');
  var list = eventsOn(sel);
  $('dayT').innerHTML = esc(fmtLong(sel)) + '<em>' + esc(rel(sel)) + '</em>';
  $('dayL').innerHTML = list.length ? list.map(evRow).join('') : '<li><p class="empty">Nada este día. Escribe abajo lo que quieras apuntar.</p></li>';
  var nx = [];
  for (var k = 0; k < 60 && nx.length < 12; k++) { var s2 = addDays(T, k); eventsOn(s2).forEach(function (e) { if (nx.length < 12 && !isGone(e, s2)) nx.push([s2, e]); }); }
  $('nextL').innerHTML = nx.length ? nx.map(function (p) {
    var e = p[1], d = pd(p[0]);
    return '<li><button type="button" class="next" style="--c:var(--' + esc(e.c || 'cielo') + ')" data-id="' + esc(e.id) + '" data-d="' + p[0] + '"><span class="badge"><b>' + d.getDate() + '</b><span>' + MESC[d.getMonth()] + '</span></span><span class="t">' + esc(e.t) + '<span class="s">' + esc(DIA[d.getDay()] + (e.h ? ' · ' + span(e) : ' · todo el día')) + '</span></span><span class="when">' + esc(rel(p[0])) + '</span></button></li>';
  }).join('') : '<li><p class="empty">No hay nada apuntado en los próximos dos meses.</p></li>';
  drawCora(); drawCover();
  $('sync').textContent = !col ? 'Guardado solo en este navegador.' : synced ? 'Guardado en tu cuenta. Lo que apunte Claude aparece aquí al momento.' : 'Conectando…';
  preview();
}
function preview() {
  var v = $('qIn').value.trim();
  if (!v) { $('prevT').innerHTML = 'Apuntando en <b>' + esc(fmtShort(sel)) + '</b>. Prueba: «cena viernes 21h»'; return; }
  var p = parse(v, sel);
  $('prevT').innerHTML = p.t ? '<b>' + esc(p.t) + '</b> · ' + esc(describe(p)) : 'Escribe qué quieres apuntar';
}

// ---------- Actions ----------
function addQuick(ev) {
  ev.preventDefault();
  var v = $('qIn').value.trim(); if (!v) return;
  var p = parse(v, sel); if (!p.t) { toast('Falta qué quieres apuntar'); return; }
  var id = newId();
  save(id, { id: id, t: p.t, d: p.d, f: '', h: p.h, c: 'cielo', r: p.r, n: '', by: 'yo' });
  $('qIn').value = ''; sel = p.d; view = { y: pd(p.d).getFullYear(), m: pd(p.d).getMonth() }; render();
  toast('Apuntado: ' + p.t + ' · ' + describe(p), 'Deshacer', function () { remove(id, true); });
}
function openSheet(id, d) {
  var e = id ? EV[id] : null;
  form = e ? { id: id, c: e.c || 'cielo', r: e.r || '', by: e.by || 'yo', k: e.k || '' } : { id: null, c: 'cielo', r: '', by: 'yo', k: '' };
  var v = $('veil'); v.hidden = false;
  v.innerHTML = '<form class="sheet" id="sheet" role="dialog" aria-label="' + (e ? 'Editar plan' : 'Nuevo plan') + '"><h2>' + (e ? 'Editar plan' : 'Nuevo plan') + '</h2>' +
    '<label class="f">Qué<input id="fT" type="text" required maxlength="120" value="' + esc(e ? e.t : $('qIn').value.trim() ? parse($('qIn').value.trim(), d).t : '') + '"></label>' +
    '<div class="two"><label class="f">Día<input id="fD" type="date" required value="' + esc(e ? e.d : d) + '"></label><label class="f">Hora<input id="fH" type="time" value="' + esc(e ? e.h : '') + '"></label></div>' +
    '<div class="two"><label class="f">Hasta las<input id="fH2" type="time" value="' + esc(e ? e.h2 || '' : '') + '"></label><label class="f">Hasta el día, si dura varios<input id="fF" type="date" value="' + esc(e ? e.f || '' : '') + '"></label></div>' +
    '<div class="f">Color<div class="pick" id="pC">' + COLORS.map(function (c) { return '<button type="button" class="col" style="--c:var(--' + c + ')" data-c="' + c + '" aria-label="' + CN[c] + '" aria-pressed="' + (form.c === c) + '"></button>'; }).join('') + '</div></div>' +
    '<div class="f">Se repite<div class="pick" id="pR">' + [['', 'No'], ['w', 'Cada semana'], ['m', 'Cada mes'], ['y', 'Cada año']].map(function (r) { return '<button type="button" data-r="' + r[0] + '" aria-pressed="' + (form.r === r[0]) + '">' + r[1] + '</button>'; }).join('') + '</div></div>' +
    '<label class="f">Nota<textarea id="fN" rows="2" maxlength="300">' + esc(e ? e.n || '' : '') + '</textarea></label>' +
    '<div class="acts"><button type="submit" class="go">Guardar</button><button type="button" class="ghost" id="cancel">Cancelar</button>' + (e ? '<button type="button" class="del" id="del">Borrar</button>' : '') + '</div></form>';
  setTimeout(function () { var f = $('fT'); if (f && !e) f.focus(); }, 30);
}
function closeSheet() { $('veil').hidden = true; $('veil').innerHTML = ''; form = null; }
function enter() { $('cover').hidden = true; try { sessionStorage.setItem('ct-in', '1'); } catch (e) {} }
$('veil').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'), tgt = ev.target;
  if (tgt === $('veil')) { closeSheet(); return; }
  if (!b || !form) return;
  if (b.dataset.c) { form.c = b.dataset.c; [].forEach.call($('pC').children, function (x) { x.setAttribute('aria-pressed', x === b); }); }
  else if (b.dataset.r !== undefined && b.parentNode.id === 'pR') { form.r = b.dataset.r; [].forEach.call($('pR').children, function (x) { x.setAttribute('aria-pressed', x === b); }); }
  else if (b.id === 'cancel') closeSheet();
  else if (b.id === 'del') { var did = form.id; closeSheet(); remove(did); }
});
$('veil').addEventListener('submit', function (ev) {
  ev.preventDefault(); if (!form) return;
  var t = $('fT').value.trim(), d = $('fD').value, f = $('fF').value; if (!t || !d) return;
  var id = form.id || newId(), h = $('fH').value; if (f && f <= d) f = '';
  save(id, { id: id, t: t, d: d, f: f, h: h, h2: h ? $('fH2').value : '', k: form.k, c: form.c, r: f ? '' : form.r, n: $('fN').value.trim(), by: form.by });
  sel = d; view = { y: pd(d).getFullYear(), m: pd(d).getMonth() }; if (!form.id) $('qIn').value = ''; closeSheet(); render();
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && form) closeSheet(); });
$('quick').addEventListener('submit', addQuick);
$('enter').addEventListener('click', enter);
try { if (sessionStorage.getItem('ct-in')) $('cover').hidden = true; } catch (e) {}
$('qIn').addEventListener('input', preview);
$('more').addEventListener('click', function () { openSheet(null, sel); });
$('grid').addEventListener('click', function (ev) { var b = ev.target.closest('.day'); if (!b) return; sel = b.dataset.d; var d = pd(sel); if (d.getMonth() !== view.m) view = { y: d.getFullYear(), m: d.getMonth() }; render(); });
$('grid').addEventListener('dblclick', function (ev) { var b = ev.target.closest('.day'); if (b) openSheet(null, b.dataset.d); });
function onEv(ev) {
  var x = ev.target.closest('[data-del]'); if (x) { remove(x.dataset.del); return; }
  var ok = ev.target.closest('[data-ok]'); if (ok) { toggleDone(ok.dataset.ok, sel); return; }
  var b = ev.target.closest('[data-id]'); if (b && EV[b.dataset.id]) openSheet(b.dataset.id, sel);
}
$('dayL').addEventListener('click', onEv); $('nextL').addEventListener('click', onEv);
$('prev').addEventListener('click', function () { view = view.m === 0 ? { y: view.y - 1, m: 11 } : { y: view.y, m: view.m - 1 }; render(); });
$('nextM').addEventListener('click', function () { view = view.m === 11 ? { y: view.y + 1, m: 0 } : { y: view.y, m: view.m + 1 }; render(); });
$('hoy').addEventListener('click', function () { sel = today(); var d = new Date(); view = { y: d.getFullYear(), m: d.getMonth() }; render(); });

// ---------- Start ----------
(function () { var d = new Date(); sel = today(); view = { y: d.getFullYear(), m: d.getMonth() }; })();
try { var raw = JSON.parse(localStorage.getItem(LS) || 'null'); if (raw && typeof raw === 'object') EV = raw; } catch (e) {}
render();
(async function () {
  try {
    var c = window.claude && await window.claude.use('db'); if (!c) return;
    db = c; col = c.collection('eventos'); EV = {}; render();
    var timer = setTimeout(function () { $('sync').textContent = 'No se llega a la base de datos. Lo que ves puede estar desactualizado.'; }, 10000);
    col.onSnapshot(function (snap) {
      var m = {}; snap.docs.forEach(function (d) { var x = d.data(); if (x) m[d.id] = Object.assign({}, x, { id: d.id }); });
      EV = m; if (!snap.metadata.fromCache) { synced = true; clearTimeout(timer); } render();
    }, function () { clearTimeout(timer); $('sync').textContent = 'No se ha podido leer la agenda. Recarga la página.'; });
  } catch (e) {}
})();
setInterval(function () { if (!form) render(); }, 60000);
</script>
