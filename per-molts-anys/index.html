<style>
/* Layout: the next birthdays first, as a countdown list; a year calendar and the import/export tools in their own tabs. Each person opens in a sheet with the ways to congratulate them and their gift ideas */
:root {
  --bg: #fff6f0; --card: #ffffff; --ink: #2b1a24; --muted: #7a6470; --line: #f0dcd9; --soft: #fbe9e6;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a1116; --card: #24181f; --ink: #f6e9ee; --muted: #b59eaa; --line: #3a2a33; --soft: #2f2029;
  --berry: #ff6f9f; --berry-ink: #2a0716; --sun: #f7c25a; --mint: #5fd0b3; --sky: #7fb0ff; --plum: #e9b6c9; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1a1116; --card: #24181f; --ink: #f6e9ee; --muted: #b59eaa; --line: #3a2a33; --soft: #2f2029;
  --berry: #ff6f9f; --berry-ink: #2a0716; --sun: #f7c25a; --mint: #5fd0b3; --sky: #7fb0ff; --plum: #e9b6c9; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16.5px/1.45 var(--body); }

.top { position: relative; display: grid; gap: 4px; padding: 54px 18px 16px; border-radius: 22px; background: var(--card); box-shadow: 0 10px 30px -18px rgba(91, 42, 63, .5); overflow: hidden; }

.tab[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

/* Today's birthdays get a party card with confetti and the buttons to send the message right there */
.today { position: relative; display: grid; gap: 10px; padding: 16px; border-radius: 20px; background: var(--berry); color: var(--berry-ink); overflow: hidden; }

@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
.empty { margin: 0; padding: 24px 14px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 16px; display: grid; gap: 10px; justify-items: center; }

.note { margin: 0; font-size: 14.5px; color: var(--muted); }

.month h3 { margin: 0 0 4px; font: 700 19px var(--display); display: flex; justify-content: space-between; align-items: baseline; }
.month h3 small { font: 700 13px var(--body); color: var(--muted); }
.month button { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 40px; padding: 2px 4px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
.month button:hover { background: var(--soft); }
.month .d { font: 700 18px var(--display); color: var(--berry); text-align: center; }
.month .past { opacity: .5; }
.month .em { color: var(--muted); font-size: 14px; margin: 0; }
/* The person sheet slides over the list; on a phone it fills the screen */
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; justify-items: center; background: rgba(43, 26, 36, .45); }
.panel { width: 100%; max-width: 640px; max-height: 94vh; overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 14px; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(90px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); border-radius: 24px 24px 0 0; background: var(--bg); }
.phead { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.phead .av { width: 64px; height: 64px; font-size: 24px; }
.phead h2 { margin: 0; font: 700 26px/1.1 var(--display); overflow-wrap: anywhere; }
.phead small { color: var(--muted); font-weight: 700; }
.x { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 18px; font-weight: 800; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.send a, .send button { display: grid; place-items: center; min-height: 50px; padding: 0 10px; border-radius: 14px; border: 0; font-weight: 800; text-decoration: none; text-align: center; }
.wa { background: #25a35a; color: #fff; }
.sms { background: var(--sky); color: #fff; }
.tel { background: var(--card); color: var(--ink); border: 1px solid var(--line) !important; }
.msg { display: grid; gap: 6px; }
.msg .chip { min-height: 44px; padding: 8px 14px; border-radius: 14px; text-align: left; }
.idea { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 48px; padding: 4px 6px 4px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.idea span { overflow-wrap: anywhere; font-weight: 600; }
.idea .mini { display: flex; gap: 4px; }
.idea .mini button { min-width: 40px; min-height: 40px; padding: 0 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 13.5px; font-weight: 700; }
.given { margin: 0; padding-left: 18px; color: var(--muted); }
.panel, .form { grid-template-columns: minmax(0, 1fr); }
.form { display: grid; gap: 12px; }
.form label { display: grid; gap: 5px; min-width: 0; font-weight: 800; font-size: 14.5px; }
.form input, .form select, .form textarea { width: 100%; min-width: 0; min-height: 50px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-size: 17px; font-weight: 600; }
.form textarea { padding: 10px 12px; min-height: 80px; }
.date3 { display: grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap: 8px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.err { margin: 0; color: var(--berry); font-weight: 800; }
.toast { position: fixed; z-index: 30; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); max-width: 616px; margin: 0 auto; padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 700; display: flex; gap: 10px; align-items: center; min-height: 56px; }
.toast span { flex: 1; }
.toast button { min-height: 40px; padding: 0 12px; border: 1px solid currentColor; border-radius: 10px; background: transparent; color: inherit; font-weight: 800; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

<script>
// ---------- Calendar helpers ----------
var MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var DIA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
var TIPOS = { cumple: { t: 'Cumpleaños', e: '🎂' }, santo: { t: 'Santo', e: '😇' }, aniv: { t: 'Aniversario', e: '💍' }, otro: { t: 'Otra fecha', e: '⭐' } };
var GRUPOS = ['Familia', 'Amigos', 'Pareja', 'Trabajo', 'Clase'];
var AVISOS = [[0, 'El mismo día'], [1, '1 día antes'], [3, '3 días antes'], [7, '1 semana antes'], [14, '2 semanas antes']];
var SIGNOS = [[1, 20, '♑ Capricornio'], [2, 19, '♒ Acuario'], [3, 20, '♓ Piscis'], [4, 20, '♈ Aries'], [5, 21, '♉ Tauro'], [6, 21, '♊ Géminis'], [7, 22, '♋ Cáncer'], [8, 23, '♌ Leo'], [9, 23, '♍ Virgo'], [10, 23, '♎ Libra'], [11, 22, '♏ Escorpio'], [12, 21, '♐ Sagitario'], [12, 31, '♑ Capricornio']];
function signo(p) { for (var i = 0; i < SIGNOS.length; i++) if (p.mes < SIGNOS[i][0] || (p.mes === SIGNOS[i][0] && p.dia <= SIGNOS[i][1])) return SIGNOS[i][2]; return ''; }
function today0() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function leap(y) { return y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0); }
// Someone born on 29 February celebrates on the 28th in the other years
function onYear(p, y) { return new Date(y, p.mes - 1, p.mes === 2 && p.dia === 29 && !leap(y) ? 28 : p.dia); }
function nextOf(p) {
  var t = today0(), y = t.getFullYear(), d = onYear(p, y);
  if (d < t) { y++; d = onYear(p, y); }
  return { date: d, days: Math.round((d - t) / 864e5), year: y, age: p.anio ? y - p.anio : null };
}
function prevOf(p) { var t = today0(), y = t.getFullYear(), d = onYear(p, y); if (d > t) { y--; d = onYear(p, y); } return { date: d, days: Math.round((t - d) / 864e5), year: y }; }
function maxDay(m) { return [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1]; }

// ---------- Store: this phone first, Firestore when signed in ----------
var LS = 'per-molts-anys-v1', S = { p: {}, pend: {}, gone: {}, avisoDef: 3 }, db = null, tab = 'proximos', q = '', grupo = '', sheet = null, pasteOpen = false;
try { var raw = JSON.parse(localStorage.getItem(LS) || 'null'); if (raw) S = Object.assign(S, raw); } catch (e) {}
function persist() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }
function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function people() { return Object.keys(S.p).map(function (k) { return S.p[k]; }); }
function put(o) { S.p[o.id] = o; S.pend[o.id] = 1; delete S.gone[o.id]; persist(); render(); flush(); }
function del(id) { var o = S.p[id]; delete S.p[id]; delete S.pend[id]; S.gone[id] = 1; persist(); render(); flush(); return o; }
function patch(id, ch) { var o = S.p[id]; if (o) put(Object.assign({}, o, ch, { ts: Date.now() })); }
var flushing = false;
async function flush() {
  if (!db || flushing || navigator.onLine === false) { status(); return; }
  flushing = true; status();
  try {
    for (var id in S.pend) { if (S.p[id]) await db.doc('personas/' + id).set(strip(S.p[id])); delete S.pend[id]; persist(); }
    for (var g in S.gone) { await db.doc('personas/' + g).delete(); delete S.gone[g]; persist(); }
  } catch (e) {}
  flushing = false; status();
}
function strip(o) { var c = Object.assign({}, o); delete c.id; return c; }
function status() {
  var n = Object.keys(S.pend).length + Object.keys(S.gone).length, el = $('sync'); if (!el) return;
  el.textContent = !db ? 'Guardado en este móvil' : navigator.onLine === false ? '📵 Sin conexión' + (n ? ' · ' + n + ' por enviar' : '') : n ? 'Guardando ' + n + '…' : '✓ Guardado en tu cuenta';
}
window.addEventListener('online', flush); window.addEventListener('offline', status); setInterval(flush, 20000);
function setAviso(n) { S.avisoDef = n; persist(); if (db) db.doc('ajustes/general').set({ avisoDef: n }).catch(function () {}); render(); }
var toastT = null;
function toast(msg, label, fn) { var el = $('toast'); clearTimeout(toastT); el.hidden = false; el.innerHTML = '<span>' + esc(msg) + '</span>' + (label ? '<button type="button" id="tb">' + esc(label) + '</button>' : ''); if (label) $('tb').onclick = function () { el.hidden = true; fn(); }; toastT = setTimeout(function () { el.hidden = true; }, 5000); }

// ---------- How each date reads ----------
function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function initials(n) { var w = n.trim().split(/\s+/); return ((w[0] || '?')[0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); }
function avatar(p) { return '<span class="av" style="--h:' + hue(p.nombre) + '" aria-hidden="true">' + esc(initials(p.nombre)) + '</span>'; }
function first(p) { return p.nombre.trim().split(/\s+/)[0]; }
function what(p, n) {
  var t = p.tipo || 'cumple';
  if (t === 'cumple') return n.age != null ? (n.days === 0 ? 'Cumple ' + n.age + ' hoy' : 'Cumple ' + n.age) : 'Cumpleaños';
  if (t === 'aniv') return n.age != null ? n.age + '.º aniversario' : 'Aniversario';
  if (t === 'santo') return 'Su santo';
  return p.etiqueta || 'Otra fecha';
}
function round(p, n) { return n.age != null && (p.tipo || 'cumple') !== 'santo' && (n.age === 18 || (n.age >= 10 && n.age % 10 === 0) || (p.tipo === 'aniv' && n.age % 5 === 0 && n.age > 0)); }
function fecha(d) { return DIA[d.getDay()].slice(0, 3) + ' ' + d.getDate() + ' ' + MES[d.getMonth()].slice(0, 3); }
function sub(p, n) { return (TIPOS[p.tipo || 'cumple'] || TIPOS.cumple).e + ' ' + esc(what(p, n)) + (round(p, n) ? '<span class="tag">Redondo</span>' : '') + ' · ' + fecha(n.date); }
function whenHtml(n) {
  if (n.days === 0) return '<span class="when"><b>🎉</b><small>hoy</small></span>';
  if (n.days === 1) return '<span class="when"><b>1</b><small>mañana</small></span>';
  return '<span class="when' + (n.days > 30 ? ' far' : '') + '"><b>' + n.days + '</b><small>días</small></span>';
}
function row(p) { var n = nextOf(p); return '<button class="row" type="button" data-open="' + p.id + '">' + avatar(p) + '<span class="who"><b>' + esc(p.nombre) + '</b><small>' + sub(p, n) + '</small></span>' + whenHtml(n) + '</button>'; }

// ---------- Ways to congratulate ----------

// The edit form lives in sheet.form so tapping a chip does not lose what was typed
function readForm() {
  var f = sheet.form; if (!f || !$('fNombre')) return f;
  f.nombre = $('fNombre').value; f.dia = $('fDia').value; f.mes = $('fMes').value; f.anio = $('fAnio').value; f.tel = $('fTel').value;
  if ($('fEtiqueta')) f.etiqueta = $('fEtiqueta').value;
  if ($('fGrupo')) f.grupo = $('fGrupo').value.trim();

}
function saveForm() {
  var f = readForm(), nombre = f.nombre.trim(), dia = +f.dia, mes = +f.mes, anio = f.anio ? +String(f.anio).replace(/\D/g, '') : null, err = '';
  if (!nombre) err = 'Falta el nombre.';
  else if (!dia || !mes) err = 'Elige el día y el mes.';
  else if (dia > maxDay(mes)) err = MES[mes - 1].charAt(0).toUpperCase() + MES[mes - 1].slice(1) + ' no tiene ' + dia + ' días.';
  else if (anio && (anio < 1900 || anio > new Date().getFullYear())) err = 'El año no cuadra. Déjalo vacío si no lo sabes.';
  else if (anio && dia === 29 && mes === 2 && !leap(anio)) err = anio + ' no fue bisiesto.';
  if (err) { $('fErr').textContent = err; return; }
  var old = sheet.id ? S.p[sheet.id] : null;
  var o = Object.assign({}, old || { id: uid(), ideas: [], notas: '' }, { nombre: nombre, tipo: f.tipo, dia: dia, mes: mes, anio: anio || null, grupo: f.grupo || '', tel: (f.tel || '').trim(), aviso: f.aviso == null ? null : f.aviso, ts: Date.now() });

}

// ---------- Calendar file (.ics), one yearly event per person with its reminders ----------
function icsText(list) {
  var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Per molts anys//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Cumpleaños'], t = today0(), y = t.getFullYear(), stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  function d8(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
  function tx(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
  list.forEach(function (p) {
    var tp = p.tipo || 'cumple', st = onYear(p, y), en = new Date(st.getFullYear(), st.getMonth(), st.getDate() + 1), av = p.aviso == null ? S.avisoDef : p.aviso;
    var title = TIPOS[tp].e + ' ' + (tp === 'cumple' ? 'Cumple de ' : tp === 'santo' ? 'Santo de ' : tp === 'aniv' ? 'Aniversario: ' : (p.etiqueta || 'Fecha') + ': ') + p.nombre;
    var desc = (p.anio ? (tp === 'cumple' ? 'Nació en ' : 'Desde ') + p.anio : '') + (p.tel ? (p.anio ? '\n' : '') + 'Tel. ' + p.tel : '');
    L.push('BEGIN:VEVENT', 'UID:' + p.id + '@per-molts-anys', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + d8(st), 'DTEND;VALUE=DATE:' + d8(en),
      'RRULE:FREQ=YEARLY' + (p.mes === 2 && p.dia === 29 ? ';BYMONTH=2;BYMONTHDAY=-1' : ''), 'SUMMARY:' + tx(title), 'TRANSP:TRANSPARENT');
    if (desc) L.push('DESCRIPTION:' + tx(desc));
    // All-day events start at 00:00, so 9:00 n days before is n-1 days and 15 hours earlier
    if (av > 0) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + tx(title + (av === 1 ? ' mañana' : ' en ' + av + ' días')), 'TRIGGER:-P' + (av - 1) + 'DT15H', 'END:VALARM');
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + tx(title + ' es hoy'), 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}

// ---------- Importing: contacts (.vcf), pasted lists and backups ----------
function qp(s) { try { return decodeURIComponent(s.replace(/=\r?\n/g, '').replace(/=([0-9A-F]{2})/gi, '%$1')); } catch (e) { return s; } }

function vDate(s) {

  var y = m[1] === '--' ? null : +m[1]; if (y && (y < 1900 || y > new Date().getFullYear())) y = null;
  var mes = +m[2], dia = +m[3]; if (!mes || mes > 12 || !dia || dia > maxDay(mes)) return null;

function parseVcf(text) {

var MESRE = MES.join('|');

  text.split(/\r?\n/).forEach(function (ln) {

    var m = new RegExp('(\\d{1,2})\\s+de\\s+(' + MESRE + ')(?:\\s+(?:de\\s+)?(\\d{4}))?', 'i').exec(ln), dia, mes, anio = null;
    if (m) { dia = +m[1]; mes = MES.indexOf(m[2].toLowerCase()) + 1; anio = m[3] ? +m[3] : null; }
    else if ((m = /(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/.exec(ln))) { dia = +m[1]; mes = +m[2]; if (m[3]) { anio = +m[3]; if (anio < 100) anio += anio > Y % 100 ? 1900 : 2000; } }

// Brings people in without duplicating anyone already here with the same name and date
function importList(list, from) {

  list.forEach(function (x) {
    var k = norm(x.nombre) + '|' + x.dia + '|' + x.mes + '|' + x.tipo; if (have[k]) return; have[k] = 1;
    var o = { id: uid(), nombre: x.nombre, tipo: x.tipo, dia: x.dia, mes: x.mes, anio: x.anio || null, grupo: x.grupo || '', tel: x.tel || '', aviso: x.aviso == null ? null : x.aviso, ideas: x.ideas || [], notas: x.notas || '', ts: Date.now() };

function readFile(input, fn) { var f = input.files[0]; input.value = ''; if (!f) return; var r = new FileReader(); r.onload = function () { fn(String(r.result)); }; r.readAsText(f); }

  if (t.closest('[data-close]')) { closeSheet(); return; }
