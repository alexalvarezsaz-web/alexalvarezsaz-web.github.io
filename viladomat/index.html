  $('tareas').innerHTML = t.length ? t.map(function (x) { return C.row({ col: 'tareas', id: x.id, check: 'hecha', done: x.hecha, title: x.texto, sub: C.esc([x.zona, x.nota].filter(Boolean).join(' · ')) }); }).join('') : '<p class="empty">Sin tareas en ' + est.toLowerCase() + '. Apunta lo que toca hacer cada estación y lo tendrás a mano el año que viene.</p>';
  var p = C.data.plantas.slice().sort(function (a, b) { return (b.fecha || '').localeCompare(a.fecha || ''); });
  $('plantas').innerHTML = p.length ? p.map(function (x) { return C.row({ col: 'plantas', id: x.id, title: x.nombre, sub: C.esc([x.zona, x.nota].filter(Boolean).join(' · ')), right: C.fmt(x.fecha) }); }).join('') : '<p class="empty">Aquí irá lo que plantas, dónde y cómo va creciendo.</p>';
  var g = C.data.gastos.slice().sort(function (a, b) { return (b.fecha || '').localeCompare(a.fecha || ''); }), yr = String(new Date().getFullYear());
  var sum = g.filter(function (x) { return (x.fecha || '').slice(0, 4) === yr; }).reduce(function (a, x) { return a + (+x.importe || 0); }, 0);
  $('total').textContent = euros(sum); $('totalT').textContent = 'en ' + yr;
  $('gastos').innerHTML = g.length ? g.map(function (x) { return C.row({ col: 'gastos', id: x.id, title: x.concepto, sub: C.esc([C.fmt(x.fecha), x.zona].filter(Boolean).join(' · ')), right: euros(+x.importe || 0) }); }).join('') : '<p class="empty">Apunta material, herramientas y trabajos para ver cuánto llevas este año.</p>';
  var f = C.data.fotos.slice().sort(function (a, b) { return (b.fecha || '').localeCompare(a.fecha || '') || (b.ts || 0) - (a.ts || 0); });
  $('fotos').innerHTML = f.length ? f.map(function (x) { return '<figure><img src="/_blob/' + C.esc(x.asset) + '" alt="' + C.esc(x.texto || 'Foto de Viladomat') + '" loading="lazy"><figcaption>' + C.esc(C.fmt(x.fecha)) + (x.texto ? ' · ' + C.esc(x.texto) : '') + ' <button class="lnk edit-only" type="button" data-edit="fotos|' + C.esc(x.id) + '" aria-label="Editar foto">Editar</button></figcaption></figure>'; }).join('') : '<p class="empty" style="grid-column:1/-1">Sube fotos para ver el antes y el después de cada zona.</p>';
}
C.start(['mapa', 'tareas', 'plantas', 'gastos', 'fotos'], render, { key: 'viladomat-v1', assets: true });
</script>
