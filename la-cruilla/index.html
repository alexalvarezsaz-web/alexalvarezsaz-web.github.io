<style>
/* Layout: a mosaic of tiles that fits one screen. Each page is a tile coloured from the Catalan outdoors; the tiles with something to tell (a photo, a countdown) are the big ones. */
:root {
  --bg: #e4e7df;
  --fg: #1c221d;
  --muted: #5d665c;
  --line: #c4cabc;
  --field: #f3f4ee;
  --accent: #2e4a38;
  --accent-ink: #f6f3ea;
  --err: #a02c1c;
  --contour: rgba(58, 86, 60, .2);
  --t-ink: #f7f4ea;
  --t-soft: rgba(247, 244, 234, .78);
  --t-nat: #2e4a38; --t-via: #7c2b28; --t-est: #84651a; --t-tra: #27496d; --t-cas: #8a4d29; --t-sal: #1f5a66; --t-oci: #6d2438; --t-otr: #4d554e;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131613; --fg: #e8ebe1; --muted: #9ba596; --line: #333a32; --field: #1e231e; --accent: #a9c6ad; --accent-ink: #11160f; --err: #ff9d85; --contour: rgba(170, 196, 165, .1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131613; --fg: #e8ebe1; --muted: #9ba596; --line: #333a32; --field: #1e231e; --accent: #a9c6ad; --accent-ink: #11160f; --err: #ff9d85; --contour: rgba(170, 196, 165, .1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#topo { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.wrap { position: relative; max-width: 1040px; margin: 0 auto; padding-block: 14px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; display: flex; align-items: center; gap: .28em; font: 800 clamp(30px, 6vw, 44px)/1 var(--font-display); letter-spacing: -.025em; }
.logo { flex: none; width: 1.05em; height: 1.05em; border-radius: 24%; }
.today { font: 500 12.500px var(--font-mono); color: var(--muted); white-space: nowrap; }
.finder { display: grid; gap: 8px; min-width: 0; }
.search input { width: 100%; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); font-size: 16px; }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 3px 10px; font-weight: 500; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.dot { width: 9px; height: 9px; border-radius: 2px; background: var(--m); }
@media (min-width: 720px) { .finder { grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); align-items: center; } }

/* Mosaic */
.mosaic { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 96px; grid-auto-flow: dense; gap: 8px; }
.slot { position: relative; min-width: 0; grid-column: span var(--m, 1); grid-row: span var(--mr, 1); }
.slot.note { grid-column: 1 / -1; grid-row: span 2; color: var(--muted); padding: 20px 4px; }
@media (min-width: 720px) {
  .mosaic { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 176px; gap: 10px; }
  .slot { grid-column: span var(--d, 1); grid-row: span var(--dr, 1); }
}
.tile { position: relative; display: grid; grid-template-rows: auto 1fr; gap: 2px; width: 100%; height: 100%; padding: 10px 12px; border: 0; border-radius: 12px; overflow: hidden; background: var(--c, var(--t-otr)); color: var(--t-ink); text-align: left; text-decoration: none; cursor: pointer; }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 55%; }
.tile:not(.photo):not(.add) { background-image: radial-gradient(120% 130% at 90% 110%, rgba(255, 255, 255, .13), transparent 60%); background-color: var(--c, var(--t-otr)); }
/* Travel posters: flat colour, layered silhouettes, a cream keyline */
.poster-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tile.poster { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.tile.poster::before, .tile.photo::before { content: ""; position: absolute; inset: 5px; z-index: 1; border: 1px solid rgba(247, 240, 222, .5); border-radius: 8px; pointer-events: none; }
.tile.poster::after { content: ""; position: absolute; inset: 40% 0 0; background: linear-gradient(to top, rgba(8, 10, 12, .62), transparent); }
.tile.poster > span { z-index: 2; }
.tile.poster { padding: 12px 14px; }
.tile.poster .kind { color: rgba(250, 244, 228, .92); text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.tile.poster .name { font-weight: 800; text-shadow: 0 1px 6px rgba(0, 0, 0, .55); }
.tile.poster .desc { color: rgba(250, 244, 228, .9); text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
@media (prefers-reduced-motion: no-preference) {
  .poster-art { transition: transform .5s ease; }
  .tile.poster:hover .poster-art { transform: scale(1.04); }
  .mosaic.intro .slot { animation: hang .5s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 45ms); }
  @keyframes hang { from { transform: translateY(10px); opacity: .25; } }
}
/* A line drawing of each page's own world sits behind its text */
.art { position: absolute; right: 0; bottom: 0; width: 72%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .3; }
.art.wide { width: 100%; }
.art .solid { fill: currentColor; stroke: none; }
@media (prefers-reduced-motion: no-preference) {
  .art { transition: opacity .25s ease, transform .4s ease; transform-origin: 100% 100%; }
  .tile:hover .art { opacity: .48; transform: scale(1.03); }
  .flake { animation: fall 7s linear infinite; animation-delay: calc(var(--n) * -1s); }
  @keyframes fall { from { transform: translateY(-14px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateY(66px); opacity: 0; } }
}
.tile.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10, 12, 8, .78), rgba(10, 12, 8, .1) 55%, rgba(10, 12, 8, .6)); }
.tile > span { position: relative; z-index: 1; min-width: 0; }
.kind { font: 500 11px var(--font-mono); letter-spacing: .03em; color: var(--t-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.body { align-self: end; display: grid; gap: 1px; }
.name { font: 700 clamp(17px, 2.200vw, 22px)/1.08 var(--font-display); letter-spacing: -.012em; overflow-wrap: break-word; }
.big .name { font-size: clamp(22px, 3.300vw, 34px); font-weight: 800; }
.desc { display: none; font-size: 13.500px; line-height: 1.3; color: var(--t-soft); }
@media (min-width: 720px) { .desc { display: block; } }
.stat { position: absolute !important; top: 8px; right: 12px; text-align: right; font: 800 34px/1 var(--font-display); letter-spacing: -.02em; }
.stat small { display: block; font: 500 11px var(--font-mono); letter-spacing: .02em; color: var(--t-soft); }
@media (min-width: 720px) { .stat { font-size: 56px; } .stat small { font-size: 12px; } }
.note-tag { justify-self: start; margin-top: 3px; padding: 0 6px; border-radius: 4px; background: rgba(255, 255, 255, .18); font-size: 12px; font-weight: 500; }
.tile:hover { filter: brightness(1.1); }
.tile:focus-visible { outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .tile img { transition: transform .4s ease; }
  .tile:hover img { transform: scale(1.03); }
}
.tile.add { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); align-content: center; justify-items: center; grid-template-rows: auto; font-weight: 700; }
.tools { position: absolute; top: 6px; right: 6px; z-index: 2; display: flex; gap: 3px; }
.tools button { width: 27px; height: 27px; padding: 0; border: 0; background: rgba(0, 0, 0, .5); color: #fff; border-radius: 7px; font-size: 12px; cursor: pointer; }
.tools button[aria-pressed="true"] { background: #fff; color: #111; }

.below { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 14px; font-size: 13.500px; color: var(--muted); }
.recent { margin: 0; }
.recent a { color: var(--fg); font-weight: 700; }
.link { border: 0; background: none; padding: 2px 0; font-weight: 500; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.msg { flex-basis: 100%; margin: 0; color: var(--err); font-weight: 700; }

/* Form */
dialog { border: 0; padding: 0; border-radius: 14px; background: var(--field); color: var(--fg); width: min(500px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .6); }
dialog::backdrop { background: rgba(10, 14, 10, .6); }
form { display: grid; gap: 12px; padding: 22px; }
form h2 { margin: 0; font: 800 26px var(--font-display); letter-spacing: -.02em; }
label { display: grid; gap: 4px; font-size: 13.500px; font-weight: 700; color: var(--muted); min-width: 0; }
label input, label select { width: 100%; min-width: 0; padding: 9px 11px; font-weight: 400; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .two { grid-template-columns: 1fr; } }
.err { margin: 0; color: var(--err); font-weight: 700; font-size: 14px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 0; border-radius: 9px; padding: 9px 16px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.del { margin-right: auto; background: transparent; color: var(--err); border: 1px solid var(--err); }
.btn.del.sure { background: var(--err); color: var(--bg); }
</style>

<canvas id="topo" aria-hidden="true"></canvas>
<div class="wrap" id="wrap">
  <div class="top">
    <h1><img class="logo" src="icon.svg" alt="">La Cruïlla</h1>
    <span class="today" id="today"></span>
  </div>
  <div class="finder">
    <div class="search"><input id="q" type="search" placeholder="Buscar: bolets, Cracovia…" aria-label="Buscar página" autocomplete="off"></div>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo"></div>
  </div>
  <ul class="mosaic" id="post"><li class="slot note">Cargando tus páginas…</li></ul>
  <div class="below">
    <p class="msg" id="msg" role="alert" hidden></p>
    <p class="recent" id="recent" hidden></p>
    <button class="link" type="button" id="modeBtn" hidden>Añadir, ordenar y editar</button>
  </div>
</div>

<dialog id="dlg">
  <form id="form" novalidate>
    <h2 id="fTitle">Nueva página</h2>
    <label>Nombre<input id="fName" maxlength="60" required placeholder="Diari de bolets"></label>
    <label>Enlace<input id="fUrl" type="url" inputmode="url" placeholder="https://claude.ai/artifact/…" required></label>
    <label>Qué es<input id="fDesc" maxlength="120" placeholder="Una frase para reconocerla de un vistazo"></label>
    <div class="two">
      <label>Tipo<select id="fCat"></select></label>
      <label>Lugar (opcional)<input id="fPlace" maxlength="40" placeholder="Berguedà"></label>
    </div>
    <label>Fecha para la cuenta atrás (opcional)<input id="fDate" type="date"></label>
    <label>Nota en el bloque (opcional)<input id="fNote" maxlength="50" placeholder="Reservar el bus antes de Navidad"></label>
    <p class="err" id="fErr" role="alert" hidden></p>
    <div class="bar">
      <button class="btn del" type="button" id="fDel" hidden>Eliminar</button>
      <button class="btn ghost" type="button" id="fCancel" style="margin-left:auto">Cancelar</button>
      <button class="btn" type="submit">Guardar</button>
    </div>
  </form>
</dialog>

// Days to a page's date: null when it has none or it has passed
function daysLeft(f) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f || ''); if (!m) return null;
  var now = new Date(), n = Math.round((Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  return n < 0 ? null : n;
}
function daysSince(f) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f || ''); if (!m) return null;
  var now = new Date(), n = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(+m[1], +m[2] - 1, +m[3])) / 864e5);
  return n < 0 ? null : n;
}
function ago(ts) {
  var a = new Date(ts), b = new Date();
  var n = Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
  return n <= 0 ? 'hoy' : n === 1 ? 'ayer' : 'hace ' + n + ' días';
}

function matches() {
  var q = norm($('q').value.trim());
  return items.filter(function (o) {
    if (filter !== 'all' && o.categoria !== filter) return false;
    return !q || norm([o.nombre, o.texto, o.categoria, o.lugar, o.aviso].join(' ')).indexOf(q) >= 0;
  });
}

function renderChips() {
  var used = CATS.filter(function (c) { return items.some(function (o) { return o.categoria === c[0]; }); });
  if (filter !== 'all' && !used.some(function (c) { return c[0] === filter; })) filter = 'all';
  $('chips').hidden = used.length < 2;
  $('chips').innerHTML = '<button class="chip" type="button" data-c="all" aria-pressed="' + (filter === 'all') + '">Todas</button>' + used.map(function (c) {
    return '<button class="chip" type="button" data-c="' + esc(c[0]) + '" aria-pressed="' + (filter === c[0]) + '"><i class="dot" style="--m:var(' + c[1] + ')"></i>' + esc(c[0]) + '</button>';
  }).join('');
}

function renderRecent() {
  var best = null;
  items.forEach(function (o) { if (visits[o.id] && safeUrl(o.url) && (!best || visits[o.id] > visits[best.id])) best = o; });
  var show = best && !$('q').value.trim() && filter === 'all';
  $('recent').hidden = !show;
  $('recent').innerHTML = show ? 'Última abierta: <a data-id="' + esc(best.id) + '" href="' + esc(best.url) + '" target="_blank" rel="noopener">' + esc(best.nombre) + '</a> ' + esc(ago(visits[best.id])) : '';
}

// Tile sizes: a photo gets the most room, a countdown a wide tile. The last tile stretches to close the mosaic.
function layout(list, extra) {
  var cells = { d: 0, m: 0 }, sizes = list.map(function (o) {
    var photo = safeBlob(o.foto), dated = daysLeft(o.fecha) !== null, since = daysSince(o.desde) !== null;
    var s = o.grande ? { d: 2, dr: 2, m: 2, mr: 2 } : photo ? { d: 2, dr: 2, m: 2, mr: 1 } : dated ? { d: 2, dr: 1, m: 2, mr: 1 } : since ? { d: 2, dr: 1, m: 1, mr: 1 } : { d: 1, dr: 1, m: 1, mr: 1 };
    cells.d += s.d * s.dr; cells.m += s.m * s.mr;
    return s;
  });
  cells.d += extra; cells.m += extra;
  if (!extra && sizes.length) {
    var last = sizes[sizes.length - 1];
    if (last.dr === 1) last.d = Math.min(4, last.d + (4 - cells.d % 4) % 4);
    if (last.mr === 1) last.m = Math.min(2, last.m + (2 - cells.m % 2) % 2);

  return sizes;

  $('post').innerHTML = html;
  if (!introDone && list.length) { introDone = true; $('post').classList.add('intro'); setTimeout(function () { $('post').classList.remove('intro'); }, 1200); }
  $('modeBtn').hidden = !canEdit || !items.length;
  $('modeBtn').textContent = editMode ? 'He terminado' : 'Añadir, ordenar y editar';
  renderRecent();
}
var introDone = false;
function renderAll() { renderChips(); render(); }
function say(m) { $('msg').textContent = m || ''; $('msg').hidden = !m; }

// ---------- Search ----------
$('q').addEventListener('input', render);
$('q').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { var a = document.querySelector('#post a.tile'); if (a) { e.preventDefault(); a.click(); } }
  if (e.key === 'Escape') { this.value = ''; render(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === '/' && !$('dlg').open && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); }
});
$('chips').addEventListener('click', function (e) {
  var b = e.target.closest('.chip'); if (!b) return;
  filter = b.getAttribute('data-c'); renderAll();
});

// ---------- Visits: remembered per person, on every device they use ----------
function remember(id) {
  visits[id] = Date.now();
  try { localStorage.setItem(LV, JSON.stringify(visits)); } catch (e) {}
  if (visitDoc) visitDoc.set({ v: visits }).catch(function () {});
  setTimeout(renderRecent, 300);
}
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[data-id]'); if (a) remember(a.getAttribute('data-id'));
});

// ---------- Pin, reorder, add and edit ----------
function byId(id) { return items.filter(function (o) { return o.id === id; })[0]; }
async function togglePin(o) {
  var v = !o.fijada; o.fijada = v; sortItems(items); render(); say('');
  try { await db.doc('paginas/' + o.id).update({ fijada: v }); } catch (e) { o.fijada = !v; sortItems(items); render(); say('No se ha podido fijar. Comprueba la conexión y vuelve a probar.'); }
}
async function move(o, dir) {
  var i = items.indexOf(o), p = items[i + dir]; if (!p) return;
  var a = o.orden || 0, b = p.orden || 0; if (a === b) b = a + dir;
  o.orden = b; p.orden = a; sortItems(items); render(); say('');
  try { await db.doc('paginas/' + o.id).update({ orden: b }); await db.doc('paginas/' + p.id).update({ orden: a }); }
  catch (e) { say('No se ha podido guardar el orden. Comprueba la conexión y vuelve a probar.'); }
}
$('modeBtn').addEventListener('click', function () { editMode = !editMode; say(''); render(); });
$('fCat').innerHTML = CATS.map(function (c) { return '<option>' + c[0] + '</option>'; }).join('');
function openForm(o) {
  editing = o || null;
  $('fTitle').textContent = o ? 'Editar página' : 'Nueva página';
  $('fName').value = o ? o.nombre || '' : '';
  $('fUrl').value = o ? o.url || '' : '';
  $('fDesc').value = o ? o.texto || '' : '';
  $('fCat').value = o && o.categoria ? o.categoria : 'Otros';
  $('fPlace').value = o ? o.lugar || '' : '';
  $('fDate').value = o ? o.fecha || '' : '';
  $('fNote').value = o ? o.aviso || '' : '';
  $('fErr').hidden = true;
  $('fDel').hidden = !o; $('fDel').classList.remove('sure'); $('fDel').textContent = 'Eliminar';
  $('dlg').showModal();
}
function fail(msg) { $('fErr').textContent = msg; $('fErr').hidden = false; }
$('post').addEventListener('click', function (e) {
  if (e.target.closest('#addBtn')) return openForm(null);
  var b = e.target.closest('[data-act]'); if (!b) return;
  var o = byId(b.getAttribute('data-id')), act = b.getAttribute('data-act'); if (!o) return;
  if (act === 'edit') openForm(o);
  if (act === 'pin') togglePin(o);
  if (act === 'up') move(o, -1);
  if (act === 'down') move(o, 1);
});
$('fCancel').addEventListener('click', function () { $('dlg').close(); });
$('form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var nombre = $('fName').value.trim(), url = $('fUrl').value.trim();
  if (!nombre) return fail('Ponle un nombre a la página.');
  if (!safeUrl(url)) return fail('El enlace tiene que empezar por https://');
  if (!db) return fail('No se ha podido guardar: abre la página con tu sesión de Claude iniciada.');
  var id = editing ? editing.id : 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  var doc = { nombre: nombre, url: url, texto: $('fDesc').value.trim(), categoria: $('fCat').value, lugar: $('fPlace').value.trim(), fecha: $('fDate').value, aviso: $('fNote').value.trim(), desde: editing ? editing.desde || '' : '', grande: editing ? !!editing.grande : false, icono: editing ? editing.icono || '' : '', foto: editing ? editing.foto || '' : '', fijada: editing ? !!editing.fijada : false, orden: editing ? editing.orden || 0 : Date.now() };
  try { await db.doc('paginas/' + id).set(doc); $('dlg').close(); }
  catch (err) { fail('No se ha podido guardar. Comprueba la conexión y vuelve a probar.'); }
});
$('fDel').addEventListener('click', async function () {
  if (!this.classList.contains('sure')) { this.classList.add('sure'); this.textContent = '¿Seguro? Eliminar'; return; }
  try { await db.doc('paginas/' + editing.id).delete(); $('dlg').close(); }
  catch (err) { fail('No se ha podido eliminar. Comprueba la conexión y vuelve a probar.'); }
});

sortItems(items);
renderAll();

// Apps built later in this repo, added to the pages once (a marker keeps a deleted one from coming back).
// The link is the app's folder next to this one, so it only runs where the apps are served over https.
var NEW_PAGES = [['formigues', { nombre: 'Formigues', texto: 'Diario y mapa del hormiguero de las Messor', categoria: 'Naturaleza', desde: '2026-04-21' }, '../formigues/'],
  ['per-molts-anys', { nombre: 'Per molts anys', texto: 'Los cumpleaños de tu gente, con avisos e ideas de regalo', categoria: 'Casa' }, '../per-molts-anys/']];
var adding = false;
async function addOnce() {
  if (adding || location.protocol !== 'https:') return;
  adding = true;
  try {
    var mark = await db.doc('ajustes/anadidas').get(), done = mark.exists ? mark.data() : {}, ch = {};
    for (var i = 0; i < NEW_PAGES.length; i++) {
      var p = NEW_PAGES[i], url = new URL(p[2], location.href).href;
      if (done[p[0]]) continue;
      if (!items.some(function (o) { return o.id === p[0] || String(o.url || '').indexOf('/' + p[0] + '/') >= 0; })) {
        await db.doc('paginas/' + p[0]).set(Object.assign({ url: url, lugar: '', fecha: '', aviso: '', grande: false, icono: '', foto: '', fijada: false, orden: Date.now() }, p[1]));
      }
      ch[p[0]] = true;
    }
    if (Object.keys(ch).length) await db.doc('ajustes/anadidas').set(Object.assign({}, done, ch));
  } catch (e) {}
  adding = false;
}

// ---------- Shared store ----------
(async function () {
  var timer = setTimeout(function () { if (!loaded) { status = 'Tus páginas están tardando en llegar. Comprueba la conexión.'; render(); } }, 10000);
  if (!(window.claude && window.claude.use)) { clearTimeout(timer); if (!loaded) { status = 'Abre esta página desde Claude para ver tus páginas.'; render(); } return; }
  try {
    db = await window.claude.use('db');
    if (!db) { clearTimeout(timer); if (!loaded) { status = 'Inicia sesión en Claude para ver tus páginas.'; render(); } return; }
    var user = await window.claude.use('user');
    canEdit = user ? (await user.canEdit()) === true : false;
    var uid = user && user.id ? await user.id() : null;
    if (uid) {
      visitDoc = db.collection('data/users/' + uid).doc('visitas');
      visitDoc.onSnapshot(function (x) {
        if (!x.exists) return;
        var v = x.data().v || {};
        Object.keys(v).forEach(function (k) { if (!visits[k] || v[k] > visits[k]) visits[k] = v[k]; });
        try { localStorage.setItem(LV, JSON.stringify(visits)); } catch (e) {}
        renderRecent();
      }, function () {});
    }
    db.collection('paginas').onSnapshot(function (s) {
      if (s.metadata && s.metadata.fromCache && !s.size) return;
      clearTimeout(timer); loaded = true;
      items = sortItems(s.docs.map(function (x) { var o = Object.assign({}, x.data()); o.id = x.id; return o; }));
      try { localStorage.setItem(LS, JSON.stringify(items)); } catch (e) {}
      renderAll();
      if (canEdit && !(s.metadata && s.metadata.fromCache)) addOnce();
    }, function () { clearTimeout(timer); if (!loaded) { status = 'No se han podido cargar tus páginas. Recarga la página.'; } renderAll(); });
    renderAll();
  } catch (e) { clearTimeout(timer); if (!loaded) { status = 'No se han podido cargar tus páginas. Recarga la página.'; render(); } }
})();
</script>

</body></html>
